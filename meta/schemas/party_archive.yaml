# ============================================
# 对外档案面（party_archive）— foundation 步 2 · F1 治理分域 v1.1 §3.5
# object_type: view（真 SQL 视图；读=视图口径，写经 write_anchor 转发到锚 party，
#              对齐 SQL 可更新视图语义；无锚真视图仍由 READ_ONLY_VIEW 护栏拒写）
# 谓词: COALESCE(source, '') <> 'org'（NULL 安全：空 source 视为外部）
# 绑定: 不挂 org 维度绑定 ⇒ 拦截器永不注入（对外档案恒排除内部行，结构强制、无绕过面）
# [F1 write_anchor 2026-10-11] 写转发：面为消费方单入口（读+写+状态机全功能），
#   写以锚 party 身份执行（校验/规则/审计/key_template 全按锚）
# ============================================

id: party_archive
name: 身份档案（对外）
table_name: party_archive
description: 对外档案面：恒排除 source='org' 的内部组织表示（口径由视图 SQL 结构强制）
display_name_field: name
object_type: view
view_definition: |
  SELECT id, code, name, party_type, source, org_id, status
  FROM parties
  WHERE COALESCE(source, '') <> 'org'

# [F1 write_anchor 2026-10-11] 写锚：POST/PUT/DELETE 经 ActionExecutor 转发到 party 执行
write_anchor: party

# [F1 §7.1-4 + write_anchor] 声明任一 {id}_* 动作即触发 has_any_crud 短路 ⇒
# 读（read/list）与写（create/update/delete）动作均需显式声明；auto_crud 关闭
import_export:
  auto_crud: false

actions:
  - id: party_archive_read
    name: 查询身份档案
    type: crud
    method: GET
    path: "/api/v1/party_archives/{id}"
    description: 查询单个对外档案记录
  - id: party_archive_list
    name: 查询身份档案列表
    type: crud
    method: GET
    path: "/api/v1/party_archives"
    description: 查询对外档案列表
  # [F1 write_anchor 2026-10-11] 写动作：声明后 v1/v2 写链路可解析；
  # 执行时由 ActionExecutor._execute_crud 转发到写锚 party（本面不直接落库）
  - id: party_archive_create
    name: 创建身份档案
    type: crud
    method: POST
    path: "/api/v1/party_archives"
    description: 创建记录（转发到写锚 party 执行）
  - id: party_archive_update
    name: 更新身份档案
    type: crud
    method: PUT
    path: "/api/v1/party_archives/{id}"
    description: 更新记录（转发到写锚 party 执行）
  - id: party_archive_delete
    name: 删除身份档案
    type: crud
    method: DELETE
    path: "/api/v1/party_archives/{id}"
    description: 删除记录（转发到写锚 party 执行）

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true
    description: 技术主键（继承自 parties.id）
    semantics:
      meaning: 自增主键
      primary_key: true

  - id: code
    name: 身份主体编号
    type: string
    db_column: code
    required: true
    max_length: 20
    description: 身份主体唯一识别号（继承自 parties.code）
    semantics:
      meaning: 身份主体业务编码
      business_key: true
      immutable: true
      data_category: code
    ui:
      widget: input

  - id: name
    name: 显示名
    type: string
    db_column: name
    required: true
    max_length: 200
    description: 身份显示名（组织名 / 人名）
    semantics:
      meaning: 身份显示名称
      display_name: true
      searchable: true
    ui:
      widget: input

  - id: party_type
    name: 身份类型
    type: string
    db_column: party_type
    required: true
    default: organization
    max_length: 30
    description: 身份类型（organization 企业 / person 个人）——描述「业务伙伴自身是什么性质」，与我方内部组织对象（org）不是一回事
    enum_values:
      - value: organization
        label: 企业
        color: primary
      - value: person
        label: 个人
        color: success
    semantics:
      meaning: 身份类型分类
    ui:
      widget: select

  # [F1 2026-10-17] 恒空字段隐藏 + relation 绑定修复（用户手机端实测报障）
  #   source: 视图谓词 COALESCE(source,'') <> 'org' ⇒ 本面恒空；且它是架构
  #     内部标记（'org' = 内部组织），不属于对外业务语义，暴露即噪声。
  #   org_id: 内部行已被谓词排除 ⇒ 本面恒空；隐藏同时补 ui.relation，
  #     修复"渲染成 el-input-number 数字框"——ObjectPageShell 按 ui.relation
  #     构造 value_help 走 BO 选择器（见 L246-255），缺 relation 即退回按
  #     type:integer 渲染数字框。基表同字段见 party.yaml 的 party_to_org。
  - id: source
    name: 治理分域
    type: string
    db_column: source
    nullable: true
    max_length: 30
    description: 治理分域键（本面恒不含 'org'；外部记录为空）
    semantics:
      meaning: 治理分域来源键
    ui:
      visible: false

  - id: org_id
    name: 组织引用
    type: integer
    db_column: org_id
    nullable: true
    description: orgs 外键（本面恒为 NULL —— 内部行已被视图谓词排除）
    semantics:
      meaning: 对应组织（本面恒空）
    ui:
      visible: false
      relation: org
      display_field: name

  # [生命周期 2026-10-07] 与基表同列出口径（谓词列 + status），供消费方按状态过滤
  - id: status
    name: 状态
    type: string
    db_column: status
    required: true
    default: active
    max_length: 30
    description: 身份主体状态 active/inactive（继承自 parties.status；停用方不进入新关系选择候选）
    enum_values:
      - value: active
        label: 启用
        color: success
        category: active
        is_initial: true
      - value: inactive
        label: 停用
        color: info
        category: inactive
    semantics:
      meaning: 身份主体启用状态
      filterable: true
      filter_type: enum
      filter_label: 状态
      filter_scope: local
    ui:
      widget: select

relations: []

# 详情分区（[关系分区 2026-10-17] 业务伙伴详情展示其参与的关系，两侧合并）
#   动机：party_relation 是连接两个 party 的边（party1_id 我方侧 / party2_id 对手侧），
#     归属「业务伙伴」这个域管辖 ⇒ 在业务伙伴详情里要能看到本单位的全部关系。
#   口径 C（两侧都列）：party1_id = 本 id 的行（本单位为我方侧）+ party2_id = 本 id 的行
#     （本单位为对手侧），合并去重后按「方向」列区分。理由：关系里同一个 party 可能是
#     任一侧（对外伙伴常为对手侧，内部组织为我方侧），只列一侧会漏。
#   取数不走平台关联端点：平台的 association 过滤列写死为 `{父对象类型}_id`
#     （AssociationSection.associationFilters），本对象是 party，会得 `party_id` —— 该列不存在。
#     故走自定义取数器 customFetcher=party_relations（先例：business_object「对象关系」用
#     merged_bo_relationships），由前端做两次查询（party1_id / party2_id）后合并。
ui_view_config:
  skip_auto_menu: true
  # 列表列（[列表列 2026-10-17] 补回数据列）
  #   背景：本文件此前只写 skip_auto_menu，未声明 list.columns；前端 useMetaList
  #     只认 listConfig.tableColumns || listConfig.columns（缺则告警并留空、不回退字段自动生成），
  #     故右表只渲染勾选框列、无数据列，看不出每行是谁。
  #   口径对齐 party_group.yaml 的 list.columns 写法（field 键 + 宽度/筛选/展示形态）。
  list:
    detail_mode: drawer
    title: 业务伙伴
    columns:
      - field: code
        width: 140
        sortable: true
      - field: name
        width: 240
      - field: party_type
        width: 110
        filterable: true
        filter_type: enum
        render_as: tag
      - field: status
        width: 90
        filterable: true
        filter_type: select
        render_as: tag
    searchFields:
      - code
      - name
    # [列表动作 2026-10-17] 补 actions（用户手机端报障「新建按钮文案不一致」）
    #   起因：本面此前未声明 actions ⇒ useMetaList 走兜底 ⇒ 按钮文案只有裸「新建」，
    #     而同页 party_group tab 是「新建业务伙伴组」，同一页面两套文案。
    #   文案口径依据 SAP Fiori 官方 List Report Floorplan：
    #     "replace the generic tooltip Create Object with a more specific text,
    #      such as Create Purchase Order" —— 明确反对泛化文案，要求动词 + 对象名。
    #     配套 UI Text Guidelines: "starting with a verb, keep them as short as possible"。
    #     故取「新建业务伙伴」：不取「新建」（泛化），也不取「新建业务伙伴组」（本面就是业务伙伴本身）。
    #   permission 用双段式，与 permissions 表实际值精确一致（实测该表只有双段式，
    #     单段式 party:create / party_group:create / item:create 命中数均为 0）。
    #     前端 authStore.hasPermission 是精确字符串匹配（perms.includes，无格式转换），
    #     写成单段式会导致非 admin 用户看不到按钮。
    #     登记缺陷（本次未改，勿照抄）：party_group.yaml:344 用的是单段式
    #     `party_group:create`，而 permissions 表里只有 `party_group:party_group_create`
    #     ⇒ 该按钮目前只对 admin（permissions=['*']）可见，非 admin 会丢失。
    #     另注：本面权限码用 party_archive:*（表内确有该 5 条），而菜单 required_permissions
    #     用的是 party:party_* —— 两者不同层：前者控按钮显隐（action 级），
    #     后者控页面可达（路由门禁级），互不替代，不要混用。
    actions:
      - id: create
        label: 新建业务伙伴
        icon: plus
        type: primary
        permission: party_archive:party_archive_create
      - id: export
        label: 导出
        icon: download
        type: default
  # [编辑态表单 2026-10-17] 补 form 声明（用户手机端实测报障「点编辑后基本信息分区空白」）
  #   起因：DetailPage.computedSections 只读态走 detail.facets 的 fieldGroup，
  #     但编辑态走的是 ui_view_config.form.sections（DetailPage.vue:759/812 对 fieldGroup
  #     显式 `if (isEditing) continue`，L853 的 facets 分支也带 `&& !isEditing`）。
  #     本文件此前只声明了 detail.facets、未声明 form ⇒ 编辑态 formSections 为空
  #     ⇒ 无任何字段可渲染，只剩标题栏「保存/取消」和只读的业务伙伴关系分区。
  #     注：后端 config_builder 虽有「form 为空则按字段推导」的兜底
  #     （UIConfigBuilder.build L70-75），但推导只收 ui.editable 的字段，
  #     本面字段未声明 editable ⇒ 推导结果同样是空 sections。
  #   列集合与 detail.facets 的基本信息保持一致（code/name/party_type/status），
  #     source/org_id 已被视图谓词恒定化并 ui.visible: false，不进表单。
  #   code 仍列在表单内：code 语义 immutable，但编辑时值不变、原样回写，
  #     且去掉后基本信息会缺「身份主体编号」这一行，与只读态观感不一致。
  #     （注：字段级只读无法在本链路表达 —— schema_loader._serialize_field_ui 的
  #     透传白名单里只有 read_only、没有 readonly，ui.readonly 不会到前端。）
  form:
    title: 业务伙伴信息
    layout: vertical
    sections:
      - title: 基本信息
        columns:
          - fields: [code, name]
          - fields: [party_type, status]
  detail:
    facets:
      - title: 基本信息
        type: fieldGroup
        fields:
          - code
          - name
          - party_type
          - status
      # 自定义取数器的分区：无需平台 association 定义（DetailPage 已放开闸门，见该组件注释）
      - title: 业务伙伴关系
        type: association
        association: party_relation
        customFetcher: party_relations
        readonly: true
        pageSize: 10
        # [入口 2026-10-20] 声明创建入口（引导式）。AssociationSection 的
        #   isPartyRelations 分支从 section.actions 里读 create（annotation 分支同款先例）。
        #   DetailPage 已把 f.actions 透传（L890 `actions: f.actions || [...]`），故无需改 DetailPage。
        #   permission 用双段式（permissions 表实有 party_relation:party_relation_create；
        #     单段式命中 0，口径同 party_relation.yaml L485-486 注）。
        #   readonly: true 保留 —— 语义是"本分区的行不可行内编辑"（两侧合并视图本就不该行内改），
        #     且编辑态可见性（shouldShowAssociation）依赖它；创建入口由 actions 单独承载。
        actions:
          - key: create
            label: 新建伙伴关系
            variant: primary
            permission: party_relation:party_relation_create

  # 税务登记子表（party_tax_registration，parent_field=party_id）
  #   与 calendar→calendar_day / items→item_uom_conversion 同一套 child_sections 机制，
  #   由 AssociationSection 的 parent_child 分支按 party_id 取数。
  #   父键推断依赖子对象 party_id 的 ui.relation=party_archive（前端 getParentIdField 口径），
  #   不要改成 party —— 挂载面是视图 party_archive，写 party 会回退 party_archive_id 而取不到数。
  child_sections:
    - child_object: party_tax_registration
      title: 税务登记
      display: tab
      useMetaList: true
      enableDetail: false
      enableAutoCrud: false
      pageSize: 20
