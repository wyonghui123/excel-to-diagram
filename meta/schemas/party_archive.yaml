# ============================================
# 对外档案面（party_archive）— foundation 步 2 · F1 治理分域 v1.1 §3.5
# object_type: view（真 SQL 视图，只读面；写请求由 READ_ONLY_VIEW 护栏拒绝 → API 400）
# 谓词: COALESCE(source, '') <> 'org'（NULL 安全：空 source 视为外部）
# 绑定: 不挂 org 维度绑定 ⇒ 拦截器永不注入（对外档案恒排除内部行，结构强制、无绕过面）
# ============================================

id: party_archive
name: 身份档案（对外）
table_name: party_archive
description: 对外档案面：恒排除 source='org' 的内部组织表示（口径由视图 SQL 结构强制）
display_name_field: name
object_type: view
view_definition: |
  SELECT id, name, party_type, source, org_id
  FROM parties
  WHERE COALESCE(source, '') <> 'org'

# [F1 §7.1-4] 只读面：面不含写动作（read / list 之外的动作不声明）；auto_crud 关闭
import_export:
  auto_crud: false

actions:
  - id: party_archive_read
    name: 查询身份档案
    type: crud
    method: GET
    path: "/api/v1/party_archives/{id}"
    description: 查询单个对外档案记录
  - id: party_archive_list
    name: 查询身份档案列表
    type: crud
    method: GET
    path: "/api/v1/party_archives"
    description: 查询对外档案列表

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true
    description: 技术主键（继承自 parties.id）
    semantics:
      meaning: 自增主键
      primary_key: true

  - id: name
    name: 显示名
    type: string
    db_column: name
    required: true
    max_length: 200
    description: 身份显示名（组织名 / 人名）
    semantics:
      meaning: 身份显示名称
      display_name: true
      searchable: true
    ui:
      widget: input

  - id: party_type
    name: 身份类型
    type: string
    db_column: party_type
    required: true
    max_length: 30
    description: 身份类型（organization / person）
    semantics:
      meaning: 身份类型分类
    ui:
      widget: select

  - id: source
    name: 治理分域
    type: string
    db_column: source
    nullable: true
    max_length: 30
    description: 治理分域键（本面恒不含 'org'；外部记录为空）
    semantics:
      meaning: 治理分域来源键

  - id: org_id
    name: 组织引用
    type: integer
    db_column: org_id
    nullable: true
    description: orgs 外键（本面恒为 NULL —— 内部行已被视图谓词排除）
    semantics:
      meaning: 对应组织（本面恒空）

relations: []

ui_view_config:
  skip_auto_menu: true