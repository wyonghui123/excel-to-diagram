ui_view_config:
  # 菜单由波次 0 迁移手工声明
  skip_auto_menu: true
  showChangeHistory: true
  list:
    # 详情需承载可编辑行子表，抽屉放不下
    detail_mode: page
    title: 销售订单
    description: 销售订单（草稿 / 已提交 / 已确认 / 已关闭 / 已取消）
    columns:
      - field: order_no
        width: 180
        sortable: true
      - field: order_type_id
        width: 120
      - field: order_date
        width: 120
        format: date
        sortable: true
      - field: customer_account_id
        width: 200
      - field: sales_org_id
        width: 160
      # [TER-M3] 区域列：未分配显示「未分配」，支持按区域过滤
      - field: territory_id
        width: 160
        filterable: true
        filter_type: value_help
        render_as: association
        target_type: territory
        display_field: name
        placeholder: "未分配"
      - field: currency_id
        width: 90
      - field: pricing_status
        width: 110
        filterable: true
        filter_type: select
      - field: gross_amount
        width: 130
      - field: requested_date
        width: 120
        format: date
      - field: status
        width: 100
        filterable: true
        filter_type: select
    selection:
      enabled: true
      mode: multiple
    searchFields:
      - order_no
      - customer_po_no
    actions:
      - id: create
        label: 新建订单
        icon: plus
        type: primary
        permission: sales_order:sales_order_create
      - id: export
        label: 导出
        icon: download
        type: default
    defaultSort:
      field: order_date
      order: desc
  form:
    title: 销售订单信息
    layout: vertical
    sections:
      - title: 单据信息
        columns:
          - fields: [order_no, order_type_id]
          - fields: [order_date, status]
      - title: 客户与组织
        columns:
          - fields: [customer_account_id, ship_to_party_id]
          - fields: [bill_to_account_id, payer_account_id]
          - fields: [ship_to_address_id, bill_to_address_id]
          - fields: [salesperson_id, territory_id]
          - fields: [org_id, sales_org_id]
          - fields: [division_code]
      - title: 地址快照（确认时写入）
        columns:
          - fields: [ship_to_address_text, bill_to_address_text]
      - title: 商务条件
        columns:
          - fields: [currency_id, exchange_rate]
          - fields: [exchange_rate_type, exchange_rate_date]
          - fields: [payment_term_id, incoterm_code]
          - fields: [customer_po_no]
          - fields: [requested_date, confirmed_date]
      - title: 定价信息
        columns:
          - fields: [price_date, pricing_status]
          - fields: [price_list_id, pricing_procedure_id]
      - title: 金额合计
        columns:
          - fields: [net_amount, tax_amount, gross_amount]
      - title: 其他信息
        columns:
          - fields: [description]

  # 订单行子表：父字段由 sales_order_line.order_id 的 ui.relation=sales_order 推断
  child_sections:
    - child_object: sales_order_line
      title: 订单行
      display: tab
      pageSize: 10
      useMetaList: true
      enableDetail: true
      enableAutoCrud: true
      rowMutability: fullEditable
      extraRowActions:
        - key: expand
          label: 展开
          icon: expand
          condition: "row.parent_line_id == null"

    # 计划行子表：父字段由 sales_order_schedule.order_id 的 ui.relation=sales_order 推断
    # 依据: docs/superpowers/specs/2026-10-26-sales-order-schedule-line-spec.md §5
    - child_object: sales_order_schedule
      title: 计划行
      display: tab
      pageSize: 10
      useMetaList: true
      enableDetail: true
      enableAutoCrud: true
