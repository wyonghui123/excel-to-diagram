  - id: updated_at
    name: 更新时间
    type: datetime
    db_column: updated_at
    description: 更新时间
    semantics:
      meaning: 记录更新时间
      audit_field: true

# 状态机（波次 0）：draft → submitted → confirmed → closed；任意态可 cancelled
# 迁移由平台状态接口按 PUT status 执行；本波次不引入额外 action 权限码，
# 写权限仍由 sales_order:update 收口。
rules:
  - id: submit_sales_order
    name: 提交订单
    type: state_transition
    state_field: status
    from_states: [draft]
    to_state: submitted
    triggers: [before_update]
    ui_hints:
      label: 提交
      icon: send
      confirm_message: "提交后将进入待确认状态，确定要提交吗？"

  - id: confirm_sales_order
    name: 确认订单
    type: state_transition
    state_field: status
    from_states: [submitted]
    to_state: confirmed
    triggers: [before_update]
    ui_hints:
      label: 确认
      icon: check_circle
      highlight: true
      confirm_message: "确认后汇率、税率与单价将冻结，确定要确认吗？"

  - id: close_sales_order
    name: 关闭订单
    type: state_transition
    state_field: status
    from_states: [confirmed]
    to_state: closed
    triggers: [before_update]
    ui_hints:
      label: 关闭
      icon: archive
      confirm_message: "关闭后订单只读，确定要关闭吗？"

  - id: cancel_sales_order
    name: 取消订单
    type: state_transition
    state_field: status
    from_states: [draft, submitted, confirmed]
    to_state: cancelled
    triggers: [before_update]
    ui_hints:
      label: 取消
      icon: cancel
      confirm_message: "取消后订单不再参与履约，确定要取消吗？"

indexes:
  - fields: [order_no]
    unique: true
    name: uidx_sales_order_no
  - fields: [customer_account_id, order_date]
    name: idx_sales_order_customer_date
  - fields: [sales_org_id, order_date]
    name: idx_sales_order_sales_org_date
  - fields: [status]
    name: idx_sales_order_status
  - fields: [order_type_id]
    name: idx_sales_order_type

relations:
  - id: sales_order_to_type_definition
    name: 订单类型
    type: reference
    target: type_definition
    source_field: order_type_id
    target_field: id
    cardinality: N:1
    description: 订单单据类型引用（真外键，限定 header 层）
  - id: sales_order_to_customer_account
    name: 售达方
    type: reference
    target: customer_account
    source_field: customer_account_id
    target_field: id
    cardinality: N:1
    description: 售达方客户档案引用（真外键）
  - id: sales_order_to_bill_to_account
    name: 收票方
    type: reference
    target: customer_account
    source_field: bill_to_account_id
    target_field: id
    cardinality: N:1
    description: 收票方客户档案引用（可空）
  - id: sales_order_to_payer_account
    name: 付款方
    type: reference
    target: customer_account
    source_field: payer_account_id
    target_field: id
    cardinality: N:1
    description: 付款方客户档案引用（可空）
  - id: sales_order_to_party
    name: 送达方
    type: reference
    target: party
    source_field: ship_to_party_id
    target_field: id
    cardinality: N:1
    description: 送达方往来单位引用（可空）
  - id: sales_order_to_org
    name: 业务实体
    type: reference
    target: org
    source_field: org_id
    target_field: id
    cardinality: N:1
    description: 业务实体引用（真外键）
  - id: sales_order_to_sales_org
    name: 销售组织
    type: reference
    target: org
    source_field: sales_org_id
    target_field: id
    cardinality: N:1
    description: 销售组织引用（真外键，须具备 sales 职能）
  - id: sales_order_to_currency
    name: 订单币种
    type: reference
    target: currency
    source_field: currency_id
    target_field: id
    cardinality: N:1
    description: 订单币种引用（真外键）
  - id: sales_order_to_payment_term
    name: 付款条件
    type: reference
    target: payment_term
    source_field: payment_term_id
    target_field: id
    cardinality: N:1
    description: 付款条件引用（可空）

ui_view_config:
  # 菜单由波次 0 迁移手工声明
  skip_auto_menu: true
  showChangeHistory: true
  list:
    # 详情需承载可编辑行子表，抽屉放不下
    detail_mode: page
    title: 销售订单
    description: 销售订单（草稿 / 已提交 / 已确认 / 已关闭 / 已取消）
    columns:
      - field: order_no
        width: 180
        sortable: true
      - field: order_type_id
        width: 120
      - field: order_date
        width: 120
        format: date
        sortable: true
      - field: customer_account_id
        width: 200
      - field: sales_org_id
        width: 160
      - field: currency_id
        width: 90
      - field: gross_amount
        width: 130
      - field: requested_date
        width: 120
        format: date
      - field: status
        width: 100
        filterable: true
        filter_type: select
    selection:
      enabled: true
      mode: multiple
    searchFields:
      - order_no
      - customer_po_no
    actions:
      - id: create
        label: 新建订单
        icon: plus
        type: primary
        permission: sales_order:sales_order_create
      - id: export
        label: 导出
        icon: download
        type: default
    defaultSort:
      field: order_date
      order: desc
  form:
    title: 销售订单信息
    layout: vertical
    sections:
      - title: 单据信息
        columns:
          - fields: [order_no, order_type_id]
          - fields: [order_date, status]
      - title: 客户与组织
        columns:
          - fields: [customer_account_id, ship_to_party_id]
          - fields: [bill_to_account_id, payer_account_id]
          - fields: [org_id, sales_org_id]
          - fields: [division_code]
      - title: 商务条件
        columns:
          - fields: [currency_id, exchange_rate]
          - fields: [payment_term_id, incoterm_code]
          - fields: [customer_po_no]
          - fields: [requested_date, confirmed_date]
      - title: 金额合计
        columns:
          - fields: [net_amount, tax_amount, gross_amount]
      - title: 其他信息
        columns:
          - fields: [description]

  # 订单行子表：父字段由 sales_order_line.order_id 的 ui.relation=sales_order 推断
  child_sections:
    - child_object: sales_order_line
      title: 订单行
      display: tab
      pageSize: 10
      useMetaList: true
      enableDetail: true
      enableAutoCrud: true
      rowMutability: fullEditable
