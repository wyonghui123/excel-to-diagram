    ui:
      widget: date

  - id: confirmed_date
    name: 承诺交货日
    type: date
    db_column: confirmed_date
    nullable: true
    description: 承诺交货日（波次 0 手工填，无 ATP 推算）
    semantics:
      meaning: 我方承诺交货日
    ui:
