    db_column: sales_org_id
    required: true
    description: 销售组织（须具备 sales 职能）；数据范围与报表主过滤维度
    semantics:
      meaning: 订单的销售组织
      display:
        type: association
        target_type: org
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: org
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        value_filter:
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 组织编码
            width: 140
          - field: name
            label: 组织名称
            width: 220
    ui:
      widget: select
      relation: org
      multiple: false

  # SAP 销售区域的产品组切片（扁平字符串，不建对象）；≠ item_group
  - id: division_code
    name: 产品组
    type: string
    db_column: division_code
    nullable: true
    max_length: 10
    description: 产品组切片代码（SAP division 语义；非物料分类 item_group）
    semantics:
      meaning: 销售产品组切片
      data_category: code
    ui:
      widget: input

  - id: currency_id
    name: 订单币种
    type: integer
    db_column: currency_id
    required: true
    description: 订单币种（金额精度来源）
    semantics:
      meaning: 订单币种
      display:
        type: association
        target_type: currency
        display_field: code
    value_help:
      source:
        type: bo
        target_bo: currency
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        value_filter:
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 币种
            width: 100
          - field: name
            label: 名称
            width: 160
    ui:
      widget: select
      relation: currency
      multiple: false

  - id: exchange_rate
    name: 汇率
    type: number
    db_column: exchange_rate
    required: true
    default: 1
    description: 汇率快照（1 订单币种 = exchange_rate 本位币）；确认时冻结
    constraints:
      - type: numeric_range
        gt: 0
        decimal_places: 12
    semantics:
      meaning: 订单汇率快照
    ui:
      widget: input

  - id: payment_term_id
    name: 付款条件
    type: integer
    db_column: payment_term_id
    nullable: true
    description: 付款条件（默认取客户档案，可改）
    semantics:
      meaning: 订单付款条件
      display:
        type: association
        target_type: payment_term
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: payment_term
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        value_filter:
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} - {name}"
        columns:
