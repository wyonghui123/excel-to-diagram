  - id: payer_account_id
    name: 付款方
    type: integer
    db_column: payer_account_id
    nullable: true
    description: 付款方客户档案；空 = 同售达方
    semantics:
      meaning: 付款方客户档案
      display:
        type: association
        target_type: customer_account
        display_field: name
        placeholder: "同售达方"
    value_help:
      source:
        type: bo
        target_bo: customer_account
        value_field: id
        display_field: name
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{name}"
        columns:
          - field: name
            label: 客户档案
            width: 220
    ui:
      widget: select
      relation: customer_account
