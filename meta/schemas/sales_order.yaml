# 销售订单头 (Sales Order) — 波次 0
# 依据: docs/superpowers/specs/2026-10-24-sales-order-wave0-detailed-plan.md v1.5 §1
#       docs/superpowers/specs/2026-10-24-sales-order-specification.md v0.4
#
# 定位: 销售域第一张事实单据（订单头）。行见 sales_order_line。
#
# 设计口径:
#   ① 单据类型复用 type_definitions（scope_bo='sales_order' + level='header'），
#      不另建对象；编号由 type_definition.number_sequence_id 指向的序列取号。
#   ② 金额三项（net/tax/gross）是快照，由服务层按行汇总回写，界面只读。
#   ③ 退货方向由单据类型的 document_category 决定，行内不自带方向（W0-R2/R3）。
#   ④ org_id（财务归属）与 sales_org_id（数据范围/取价）分列，不合并。
#   ⑤ 波次 0 不落 pricing_* / customer_sales_org / 地址角色层等字段，
#      随各自波次以 nullable 列追加。
#
# 服务层不变量（YAML 表达不了的，由 sales_order_guard_service 强制）:
#   W0-R1  order_no 生成后不可改；取号失败不回退（允许跳号）
#   W0-R2  qty > 0；方向由抬头单据类型决定
#   W0-R3  退货单 net/tax/gross 必须为负；非退货单必须 >= 0
#   W0-R4  order_type 必须 scope_bo='sales_order' + level='header'；
#          行 line_type 必须 level='line'
#   W0-R5  order_type.default_type_id 与行的 line_type 必须同 scope_bo
#   W0-R6  行 item_id 为空时 description 必填；uom_id 恒必填
#   W0-R7  抬头合计恒等于行合计（任一行变更后重算回写）
#   W0-R8  status != draft 后禁止删除行；禁止改 order_no / order_type_id / currency_id
#   W0-R9  确认时冻结 exchange_rate / exchange_rate_type / exchange_rate_date
#          / tax_rate_percent / unit_price
#   W0-R10 sales_org_id 必须存在 org_functions.function_type='sales' 的行
#   W0-R11 行级先按币种精度舍入，再汇总
#   W0-R12 金额由服务层计算并落快照，界面不提供自动定价
#   W0-R13 汇率折算快照：exchange_rate != 1 时 exchange_rate_date 必填
#          （本币无折算，rate=1 允许留空）

id: sales_order
name: 销售订单
table_name: sales_orders
description: 销售订单头（行见 sales_order_line）
display_name_field: order_no
aspects: [audit_aspect]

semantics:
  meaning: 销售订单
  category: business_document
  business_key: [order_no]
  aliases:
    - 销售订单
    - 订单
    - Sales Order

deletion_policy:
  # 订单是事实单据：非草稿禁止删除（守卫拦截器强制度）；草稿删除时级联清行
  mode: restrict
  restrict_on: []
  cascade_delete:
    - sales_order_lines

audit:
  enabled: true
  create:
    enabled: true
    fields: all
  update:
    enabled: true
    fields: changed_only
    exclude:
      - id
      - created_at
      - updated_at
  delete:
    enabled: true
    fields: business_only
    exclude:
      - id
      - created_at
      - updated_at
  associate:
    enabled: true
  dissociate:
    enabled: true

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true
    description: 技术主键
    semantics:
      meaning: 自增主键
      primary_key: true

  # 编号由创建拦截器按 order_type.number_sequence_id 取号后回填；
  # 界面只读（ui.editable: false），用户不手工录入。
  - id: order_no
    name: 订单编号
    type: string
    db_column: order_no
    required: true
    max_length: 30
    description: 订单编号（业务键，取号生成后不可修改）
    semantics:
      meaning: 订单业务编号
      business_key: true
      immutable: true
      data_category: code
      searchable: true
    ui:
      widget: input
      editable: false

  - id: order_type_id
    name: 订单类型
    type: integer
    db_column: order_type_id
    required: true
    description: 订单类型（type_definitions，scope_bo='sales_order' + level='header'）
    semantics:
      meaning: 订单单据类型
      display:
        type: association
        target_type: type_definition
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: type_definition
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        value_filter:
          scope_bo: sales_order
          level: header
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 类型编码
            width: 120
          - field: name
            label: 类型名称
            width: 200
    ui:
      widget: select
      relation: type_definition
      multiple: false

  - id: order_date
    name: 订单日期
    type: date
    db_column: order_date
    required: true
    description: 单据日期；汇率快照与编号日期段的基准日
    semantics:
      meaning: 订单业务日期
      filterable: true
      filter_type: date
      filter_label: 订单日期
      filter_scope: local
    ui:
      widget: date

  - id: status
    name: 状态
    type: string
    db_column: status
    required: true
    default: draft
    description: 订单状态（草稿 / 已提交 / 已确认 / 已关闭 / 已取消）
    enum_values:
      - value: draft
        label: 草稿
        color: info
        category: draft
        is_initial: true
      - value: submitted
        label: 已提交
        color: primary
        category: active
      - value: confirmed
        label: 已确认
        color: success
        category: active
      - value: closed
        label: 已关闭
        color: info
        category: inactive
      - value: cancelled
        label: 已取消
        color: danger
        category: inactive
    semantics:
      meaning: 订单状态
      filterable: true
      filter_type: enum
      filter_label: 状态
      filter_scope: local
    ui:
      widget: select

  - id: customer_account_id
    name: 售达方
    type: integer
    db_column: customer_account_id
    required: true
    description: 售达方客户档案（商务默认值的来源）
    semantics:
      meaning: 售达方客户档案
      display:
        type: association
        target_type: customer_account
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: customer_account
        value_field: id
        display_field: name
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{name}"
        columns:
          - field: name
            label: 客户档案
            width: 220
    ui:
      widget: select
      relation: customer_account
      multiple: false

  - id: bill_to_account_id
    name: 收票方
    type: integer
    db_column: bill_to_account_id
    nullable: true
    description: 收票方客户档案；空 = 同售达方
    semantics:
      meaning: 收票方客户档案
      display:
        type: association
        target_type: customer_account
        display_field: name
        placeholder: "同售达方"
    value_help:
      source:
        type: bo
        target_bo: customer_account
        value_field: id
        display_field: name
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{name}"
        columns:
          - field: name
            label: 客户档案
            width: 220
    ui:
      widget: select
      relation: customer_account
      multiple: false
      clearable: true

  - id: payer_account_id
    name: 付款方
    type: integer
    db_column: payer_account_id
    nullable: true
    description: 付款方客户档案；空 = 同售达方
    semantics:
      meaning: 付款方客户档案
      display:
        type: association
        target_type: customer_account
        display_field: name
        placeholder: "同售达方"
    value_help:
      source:
        type: bo
        target_bo: customer_account
        value_field: id
        display_field: name
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{name}"
        columns:
          - field: name
            label: 客户档案
            width: 220
    ui:
      widget: select
      relation: customer_account
      multiple: false
      clearable: true

  - id: ship_to_party_id
    name: 送达方
    type: integer
    db_column: ship_to_party_id
    nullable: true
    description: 送达方往来单位；空 = 售达方对应的往来单位
    semantics:
      meaning: 送达方往来单位
      display:
        type: association
        target_type: party
        display_field: name
        placeholder: "同售达方"
    value_help:
      source:
        type: bo
        target_bo: party
        value_field: id
        display_field: name
        code_field: name
        apply_target_permissions: true
        value_filter:
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{name}"
        columns:
          - field: name
            label: 往来单位
            width: 220
    ui:
      widget: select
      relation: party
      multiple: false
      clearable: true

  # 地址角色：默认取往来单位在该角色下的默认地址；留空不构成校验失败（W1-R15）
  - id: ship_to_address_id
    name: 收货地址
    type: integer
    db_column: ship_to_address_id
    nullable: true
    description: 收货地址；默认取送达方的 ship_to 默认地址，可手工改选
    semantics:
      meaning: 订单收货地址引用
      display:
        type: association
        target_type: address
        display_field: formatted_address
        placeholder: "默认取送达方收货地址"
    value_help:
      source:
        type: bo
        target_bo: address
        value_field: id
        display_field: formatted_address
        code_field: code
        apply_target_permissions: true
        value_filter:
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dialog
        display_format: "{code} {formatted_address}"
        columns:
          - field: code
            label: 地址编码
            width: 140
          - field: formatted_address
            label: 地址全文
            width: 320
    ui:
      widget: select
      relation: address
      multiple: false
      clearable: true

  - id: bill_to_address_id
    name: 收票地址
    type: integer
    db_column: bill_to_address_id
    nullable: true
    description: 收票地址；默认取收票方的 bill_to 默认地址，可手工改选
    semantics:
      meaning: 订单收票地址引用
      display:
        type: association
        target_type: address
        display_field: formatted_address
        placeholder: "默认取收票方收票地址"
    value_help:
      source:
        type: bo
        target_bo: address
        value_field: id
        display_field: formatted_address
        code_field: code
        apply_target_permissions: true
        value_filter:
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dialog
        display_format: "{code} {formatted_address}"
        columns:
          - field: code
            label: 地址编码
            width: 140
          - field: formatted_address
            label: 地址全文
            width: 320
    ui:
      widget: select
      relation: address
      multiple: false
      clearable: true

  # 地址文本快照（W2-D）：确认时按 address.formatted_address 写入；确认后由守卫冻结
  - id: ship_to_address_text
    name: 收货地址快照
    type: text
    db_column: ship_to_address_text
    nullable: true
    description: 送达地址文本快照；确认订单时按地址库 formatted_address 写入，确认后只读
    semantics:
      meaning: 订单收货地址文本快照
      searchable: true
    ui:
      widget: textarea

  - id: bill_to_address_text
    name: 收票地址快照
    type: text
    db_column: bill_to_address_text
    nullable: true
    description: 开票地址文本快照；确认订单时按地址库 formatted_address 写入，确认后只读
    semantics:
      meaning: 订单开票地址文本快照
      searchable: true
    ui:
      widget: textarea

  - id: salesperson_id
    name: 销售员
    type: integer
    db_column: salesperson_id
    nullable: true
    description: 销售员；默认取客户在该销售组织下的主销售员，可手工改选（W1-R18）
    semantics:
      meaning: 订单销售员引用
      display:
        type: association
        target_type: salesperson
        display_field: name
        placeholder: "默认取客户主销售员"
    value_help:
      source:
        type: bo
        target_bo: salesperson
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        value_filter:
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 销售员编码
            width: 140
          - field: name
            label: 姓名
            width: 160
    ui:
      widget: select
      relation: salesperson
      multiple: false
      clearable: true

  # [TER-M3 2026-10-26] 销售区域快照 —— 抬头唯一持有，不做行级快照
  #   创建时按客户主区域带出（§6.1 判定），可手工改（候选限 active）；
  #   确认后冻结（R-TER-8），此后客户分配变化不影响本单。
  - id: territory_id
    name: 销售区域
    type: integer
    db_column: territory_id
    nullable: true
    description: 销售区域（责任田）；创建时按客户主区域带出，确认后冻结
    semantics:
      meaning: 订单责任销售区域
      display:
        type: association
        target_type: territory
        display_field: name
        placeholder: "未分配"
    value_help:
      source:
        type: bo
        target_bo: territory
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        value_filter:
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dialog
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 区域编码
            width: 140
          - field: name
            label: 区域名称
            width: 220
    ui:
      widget: select
      relation: territory
      multiple: false
      clearable: true

  - id: org_id
    name: 业务实体
    type: integer
    db_column: org_id
    required: true
    description: 业务实体（法人 / BU），财务归属口径
    semantics:
      meaning: 订单的业务实体
      display:
        type: association
        target_type: org
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: org
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        value_filter:
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 组织编码
            width: 140
          - field: name
            label: 组织名称
            width: 220
    ui:
      widget: select
      relation: org
      multiple: false

  - id: sales_org_id
    name: 销售组织
    type: integer
    db_column: sales_org_id
    required: true
    description: 销售组织（须具备 sales 职能）；数据范围与报表主过滤维度
    semantics:
      meaning: 订单的销售组织
      display:
        type: association
        target_type: org
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: org
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        value_filter:
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 组织编码
            width: 140
          - field: name
            label: 组织名称
            width: 220
    ui:
      widget: select
      relation: org
      multiple: false

  # 产品组：SAP Sales Area（销售组织 + 分销渠道 + 产品组）中的产品组切片，
  # 由薄主数据 division（code / name / status）承载；无层级、无带出链、不参与定价。
  # ≠ item_group（物料分类）；与本平台的「销售区域」（territory，责任田）无关，勿同名混用。
  - id: division_code
    name: 产品组
    type: string
    db_column: division_code
    nullable: true
    max_length: 10
    description: 产品组切片代码（SAP division 语义；非物料分类 item_group）
    semantics:
      meaning: 销售产品组切片
      data_category: code
      display:
        type: association
        target_type: division
        display_field: name
        placeholder: "未指定"
    value_help:
      source:
        type: bo
        target_bo: division
        value_field: code
        display_field: name
        code_field: code
        apply_target_permissions: true
        value_filter:
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 产品组编码
            width: 120
          - field: name
            label: 产品组名称
            width: 200
    ui:
      widget: select
      relation: division
      multiple: false
      clearable: true

  - id: currency_id
    name: 订单币种
    type: integer
    db_column: currency_id
    required: true
    description: 订单币种（金额精度来源）
    semantics:
      meaning: 订单币种
      display:
        type: association
        target_type: currency
        display_field: code
    value_help:
      source:
        type: bo
        target_bo: currency
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        value_filter:
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 币种
            width: 100
          - field: name
            label: 名称
            width: 160
    ui:
      widget: select
      relation: currency
      multiple: false

  - id: exchange_rate
    name: 汇率
    type: number
    db_column: exchange_rate
    required: true
    default: 1
    description: 汇率快照（1 订单币种 = exchange_rate 本位币）；确认时冻结
    constraints:
      - type: numeric_range
        gt: 0
        decimal_places: 12
    semantics:
      meaning: 订单汇率快照
    ui:
      widget: input

  # 汇率类型与汇率日期构成「折算快照口径」（对标 SAP VBAK-KURST / Oracle
  # CurrencyConversionType+ConversionDate）：记录该汇率取自哪条 currency_rates
  # 的哪个 rate_type 与哪个有效日切片，便于事后追溯与审计复算。
  # rate_type 值集与 currency_rate.rate_type 对齐；空值由守卫按 spot 推导。
  - id: exchange_rate_type
    name: 汇率类型
    type: string
    db_column: exchange_rate_type
    required: true
    default: spot
    description: 汇率类型快照（即期 / 公司 / 用户 / 固定）
    enum_values:
      - value: spot
        label: 即期汇率
        color: primary
        is_initial: true
      - value: corporate
        label: 公司汇率
        color: info
      - value: user
        label: 用户汇率
        color: warning
      - value: fixed
        label: 固定汇率
        color: success
    semantics:
      meaning: 订单汇率类型快照
      filterable: true
    ui:
      widget: select

  # 折算日期：仅 exchange_rate != 1（存在折算）时必填，由守卫在创建/更新时
  # 默认取 order_date（W0-R13）。本币 rate=1 允许留空。
  - id: exchange_rate_date
    name: 汇率日期
    type: date
    db_column: exchange_rate_date
    nullable: true
    description: 汇率有效日快照（空 = 无折算或未指定，创建时默认取订单日期）
    semantics:
      meaning: 订单汇率有效日期快照
