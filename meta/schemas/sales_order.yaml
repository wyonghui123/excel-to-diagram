      editable: false

  - id: tax_amount
    name: 税额合计
    type: number
    db_column: tax_amount
    required: true
    default: 0
    description: 税额合计（行汇总快照，服务层回写）
    constraints:
      - type: numeric_range
        decimal_places: 4
    semantics:
      meaning: 订单税额合计
    ui:
      widget: input
      editable: false

  - id: gross_amount
    name: 含税合计
    type: number
    db_column: gross_amount
    required: true
    default: 0
