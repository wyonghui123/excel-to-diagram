    semantics:
      meaning: 定价生效日基准
    ui:
      widget: date

  - id: pricing_status
    name: 定价状态
    type: string
    db_column: pricing_status
    required: true
    default: pending
    description: 抬头定价状态（未取价 / 已取价 / 手工价 / 取价失败）
    enum_values:
      - value: pending
