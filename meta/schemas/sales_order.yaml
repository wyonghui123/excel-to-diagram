# 销售订单头 (Sales Order) — 波次 0
# 依据: docs/superpowers/specs/2026-10-24-sales-order-wave0-detailed-plan.md v1.5 §1
#       docs/superpowers/specs/2026-10-24-sales-order-specification.md v0.4
#
# 定位: 销售域第一张事实单据（订单头）。行见 sales_order_line。
#
# 设计口径:
#   ① 单据类型复用 type_definitions（scope_bo='sales_order' + level='header'），
#      不另建对象；编号由 type_definition.number_sequence_id 指向的序列取号。
#   ② 金额三项（net/tax/gross）是快照，由服务层按行汇总回写，界面只读。
#   ③ 退货方向由单据类型的 document_category 决定，行内不自带方向（W0-R2/R3）。
#   ④ org_id（财务归属）与 sales_org_id（数据范围/取价）分列，不合并。
#   ⑤ 波次 0 不落 pricing_* / customer_sales_org / 地址角色层等字段，
#      随各自波次以 nullable 列追加。
#
# 服务层不变量（YAML 表达不了的，由 sales_order_guard_service 强制）:
#   W0-R1  order_no 生成后不可改；取号失败不回退（允许跳号）
#   W0-R2  qty > 0；方向由抬头单据类型决定
#   W0-R3  退货单 net/tax/gross 必须为负；非退货单必须 >= 0
#   W0-R4  order_type 必须 scope_bo='sales_order' + level='header'；
#          行 line_type 必须 level='line'
#   W0-R5  order_type.default_type_id 与行的 line_type 必须同 scope_bo
#   W0-R6  行 item_id 为空时 description 必填；uom_id 恒必填
#   W0-R7  抬头合计恒等于行合计（任一行变更后重算回写）
#   W0-R8  status != draft 后禁止删除行；禁止改 order_no / order_type_id / currency_id
#   W0-R9  确认时冻结 exchange_rate / tax_rate_percent / unit_price
#   W0-R10 sales_org_id 必须存在 org_functions.function_type='sales' 的行
#   W0-R11 行级先按币种精度舍入，再汇总
#   W0-R12 金额由服务层计算并落快照，界面不提供自动定价

id: sales_order
name: 销售订单
table_name: sales_orders
description: 销售订单头（行见 sales_order_line）
display_name_field: order_no
aspects: [audit_aspect]

semantics:
  meaning: 销售订单
  category: business_document
  business_key: [order_no]
  aliases:
    - 销售订单
    - 订单
    - Sales Order

deletion_policy:
  # 订单是事实单据：非草稿禁止删除（守卫拦截器强制度）；草稿删除时级联清行
  mode: restrict
  restrict_on: []
  cascade_delete:
    - sales_order_lines

audit:
  enabled: true
  create:
    enabled: true
    fields: all
  update:
    enabled: true
    fields: changed_only
    exclude:
      - id
      - created_at
      - updated_at
  delete:
    enabled: true
    fields: business_only
    exclude:
      - id
      - created_at
      - updated_at
  associate:
    enabled: true
  dissociate:
    enabled: true

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true
    description: 技术主键
    semantics:
      meaning: 自增主键
      primary_key: true

  # 编号由创建拦截器按 order_type.number_sequence_id 取号后回填；
  # 界面只读（ui.editable: false），用户不手工录入。
  - id: order_no
    name: 订单编号
    type: string
    db_column: order_no
    required: true
    max_length: 30
    description: 订单编号（业务键，取号生成后不可修改）
    semantics:
      meaning: 订单业务编号
      business_key: true
      immutable: true
      data_category: code
      searchable: true
    ui:
      widget: input
      editable: false

  - id: order_type_id
    name: 订单类型
    type: integer
    db_column: order_type_id
    required: true
    description: 订单类型（type_definitions，scope_bo='sales_order' + level='header'）
    semantics:
      meaning: 订单单据类型
      display:
        type: association
        target_type: type_definition
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: type_definition
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        value_filter:
          scope_bo: sales_order
          level: header
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 类型编码
            width: 120
          - field: name
            label: 类型名称
            width: 200
    ui:
      widget: select
      relation: type_definition
      multiple: false

  - id: order_date
    name: 订单日期
    type: date
    db_column: order_date
    required: true
    description: 单据日期；汇率快照与编号日期段的基准日
    semantics:
      meaning: 订单业务日期
      filterable: true
      filter_type: date
      filter_label: 订单日期
      filter_scope: local
    ui:
      widget: date

  - id: status
    name: 状态
    type: string
    db_column: status
    required: true
    default: draft
    description: 订单状态（草稿 / 已提交 / 已确认 / 已关闭 / 已取消）
    enum_values:
      - value: draft
        label: 草稿
        color: info
        category: draft
        is_initial: true
      - value: submitted
        label: 已提交
        color: primary
        category: active
      - value: confirmed
        label: 已确认
        color: success
        category: active
      - value: closed
        label: 已关闭
        color: info
        category: inactive
      - value: cancelled
        label: 已取消
        color: danger
        category: inactive
    semantics:
      meaning: 订单状态
      filterable: true
      filter_type: enum
      filter_label: 状态
      filter_scope: local
    ui:
      widget: select

  - id: customer_account_id
    name: 售达方
    type: integer
    db_column: customer_account_id
    required: true
    description: 售达方客户档案（商务默认值的来源）
    semantics:
      meaning: 售达方客户档案
      display:
        type: association
        target_type: customer_account
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: customer_account
        value_field: id
        display_field: name
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{name}"
        columns:
          - field: name
            label: 客户档案
            width: 220
    ui:
      widget: select
      relation: customer_account
      multiple: false

  - id: bill_to_account_id
