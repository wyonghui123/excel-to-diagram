        target_bo: rate_table
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        value_filter:
          status: approved
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 价目表编码
            width: 160
          - field: name
            label: 价目表名称
            width: 220
    ui:
      widget: select
      relation: rate_table
      multiple: false
      editable: false

  - id: pricing_procedure_id
    name: 定价过程
    type: integer
    db_column: pricing_procedure_id
    nullable: true
    description: 命中的定价过程快照（取价服务回写）
    semantics:
      meaning: 命中的定价过程
      display:
        type: association
        target_type: calc_procedure
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: calc_procedure
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 过程编码
            width: 160
          - field: name
            label: 过程名称
            width: 220
    ui:
      widget: select
      relation: calc_procedure
      multiple: false
      editable: false

  - id: net_amount
    name: 不含税合计
    type: number
    db_column: net_amount
    required: true
    default: 0
    description: 不含税合计（行汇总快照，服务层回写）
    constraints:
      - type: numeric_range
        decimal_places: 4
    semantics:
      meaning: 订单不含税合计
    ui:
      widget: input
      editable: false

  - id: tax_amount
    name: 税额合计
    type: number
    db_column: tax_amount
    required: true
    default: 0
    description: 税额合计（行汇总快照，服务层回写）
    constraints:
      - type: numeric_range
        decimal_places: 4
    semantics:
      meaning: 订单税额合计
    ui:
      widget: input
      editable: false

  - id: gross_amount
    name: 含税合计
    type: number
    db_column: gross_amount
    required: true
    default: 0
    description: 含税合计（行汇总快照，服务层回写）
    constraints:
      - type: numeric_range
        decimal_places: 4
    semantics:
      meaning: 订单含税合计
    ui:
      widget: input
      editable: false

  - id: description
    name: 备注
    type: text
    db_column: description
    nullable: true
    description: 订单备注
    semantics:
      meaning: 订单备注
      searchable: true
    ui:
      widget: textarea

  - id: created_at
    name: 创建时间
    type: datetime
    db_column: created_at
    description: 创建时间
    semantics:
      meaning: 记录创建时间
      audit_field: true

  - id: updated_at
    name: 更新时间
    type: datetime
    db_column: updated_at
    description: 更新时间
    semantics:
      meaning: 记录更新时间
      audit_field: true

# 状态机（波次 0）：draft → submitted → confirmed → closed；任意态可 cancelled
# 迁移由平台状态接口按 PUT status 执行；本波次不引入额外 action 权限码，
# 写权限仍由 sales_order:update 收口。
rules:
  - id: submit_sales_order
    name: 提交订单
    type: state_transition
    state_field: status
    from_states: [draft]
    to_state: submitted
    triggers: [before_update]
    ui_hints:
      label: 提交
      icon: send
      confirm_message: "提交后将进入待确认状态，确定要提交吗？"

  - id: confirm_sales_order
    name: 确认订单
    type: state_transition
    state_field: status
    from_states: [submitted]
    to_state: confirmed
    triggers: [before_update]
    ui_hints:
      label: 确认
      icon: check_circle
      highlight: true
      confirm_message: "确认后汇率、税率与单价将冻结，确定要确认吗？"

  - id: close_sales_order
    name: 关闭订单
    type: state_transition
    state_field: status
    from_states: [confirmed]
    to_state: closed
    triggers: [before_update]
    ui_hints:
      label: 关闭
      icon: archive
      confirm_message: "关闭后订单只读，确定要关闭吗？"

  - id: cancel_sales_order
    name: 取消订单
    type: state_transition
    state_field: status
    from_states: [draft, submitted, confirmed]
    to_state: cancelled
    triggers: [before_update]
    ui_hints:
      label: 取消
      icon: cancel
      confirm_message: "取消后订单不再参与履约，确定要取消吗？"

indexes:
  - fields: [order_no]
    unique: true
    name: uidx_sales_order_no
  - fields: [customer_account_id, order_date]
    name: idx_sales_order_customer_date
  - fields: [sales_org_id, order_date]
    name: idx_sales_order_sales_org_date
  - fields: [status]
