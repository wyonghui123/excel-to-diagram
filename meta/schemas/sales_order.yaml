  - id: requested_date
    name: 要求交货日
    type: date
    db_column: requested_date
    nullable: true
    description: 客户要求交货日
    semantics:
      meaning: 客户要求交货日
      filterable: true
      filter_type: date
      filter_label: 要求交货日
