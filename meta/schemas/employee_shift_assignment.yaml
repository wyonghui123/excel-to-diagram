# 员工排班（Employee Shift Assignment）—— 统一资源模型 P3 / FR-015
# 依据: docs/specs/spec-unified-resource-model-2026-11-01-v1.0.md §FR-015
#
# 定位: 「谁上哪个班」（人员侧），复用 FR-014 的 shift 时段模板，不复制时段定义。
#   与 calendar_shift 的差异: calendar_shift 回答「哪个日历哪天开哪个班」（产能侧）；
#   本对象回答「哪个员工哪天在哪个班」（人员侧）。
#
# 口径:
#   ① 某日生效 = effective_from ~ effective_to 覆盖该日，且当日星期掩码为真；
#   ② 唯一 (employee_id, shift_id, seq, effective_from)；
#   ③ work_center_id 指向 resource_group(group_kind=work_center)，表示实际上班工作中心；
#   ④ 关系对象 ⇒ **不做独立菜单**（收进员工详情页分区），但 ui_view_config 三态必须齐全。

id: employee_shift_assignment
name: 员工排班
table_name: employee_shift_assignments
description: 员工排班（员工 × 班次 × 星期掩码 × 生效区间 × 工作中心）
display_name_field: seq
aspects: [audit_aspect]

semantics:
  meaning: 员工排班
  category: relationship
  aliases:
    - 员工排班
    - 排班
    - shift assignment

deletion_policy:
  mode: restrict
  restrict_on: []
  cascade_delete: []

audit:
  enabled: true
  create:
    enabled: true
    fields: all
  update:
    enabled: true
    fields: changed_only
    exclude: [id, created_at, updated_at]
  delete:
    enabled: true
    fields: business_only
    exclude: [id, created_at, updated_at]

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true
    description: 技术主键
    semantics:
      meaning: 自增主键
      primary_key: true

  - id: employee_id
    name: 员工
    type: integer
    db_column: employee_id
    required: true
    description: 员工引用（必填）
    semantics:
      meaning: 员工引用
      display:
        type: association
        target_type: employee
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: employee
        value_field: id
        display_field: name
        code_field: employee_no
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dialog
        display_format: "{employee_no} - {name}"
        columns:
          - field: employee_no
            label: 工号
            width: 140
          - field: name
            label: 姓名
            width: 160
    ui:
      widget: select
      relation: employee
      multiple: false
      clearable: false
      fieldGroup: 排班
      fieldGroupPosition: 10

  - id: shift_id
    name: 班次
    type: integer
    db_column: shift_id
    required: true
    description: 班次引用（复用 shift 时段模板）
    semantics:
      meaning: 班次引用
      display:
        type: association
        target_type: shift
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: shift
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dialog
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 班次编码
            width: 140
          - field: name
            label: 班次名称
            width: 180
    ui:
      widget: select
      relation: shift
      multiple: false
      clearable: false
      fieldGroup: 排班
      fieldGroupPosition: 20

  - id: day_mask_mon
    name: 周一
    type: boolean
    db_column: day_mask_mon
    required: true
    default: true
    description: 周一是否上班
    ui:
      widget: switch
      fieldGroup: 星期掩码
      fieldGroupPosition: 30

  - id: day_mask_tue
    name: 周二
    type: boolean
    db_column: day_mask_tue
    required: true
    default: true
    description: 周二是否上班
    ui:
      widget: switch
      fieldGroup: 星期掩码
      fieldGroupPosition: 40

  - id: day_mask_wed
    name: 周三
    type: boolean
    db_column: day_mask_wed
    required: true
    default: true
    description: 周三是否上班
    ui:
      widget: switch
      fieldGroup: 星期掩码
      fieldGroupPosition: 50

  - id: day_mask_thu
    name: 周四
    type: boolean
    db_column: day_mask_thu
    required: true
    default: true
    description: 周四是否上班
    ui:
      widget: switch
      fieldGroup: 星期掩码
      fieldGroupPosition: 60

  - id: day_mask_fri
    name: 周五
    type: boolean
    db_column: day_mask_fri
    required: true
    default: true
    description: 周五是否上班
    ui:
      widget: switch
      fieldGroup: 星期掩码
      fieldGroupPosition: 70

  - id: day_mask_sat
    name: 周六
    type: boolean
    db_column: day_mask_sat
    required: true
    default: true
    description: 周六是否上班
    ui:
      widget: switch
      fieldGroup: 星期掩码
      fieldGroupPosition: 80

  - id: day_mask_sun
    name: 周日
    type: boolean
    db_column: day_mask_sun
    required: true
    default: true
    description: 周日是否上班
    ui:
      widget: switch
      fieldGroup: 星期掩码
      fieldGroupPosition: 90

  - id: seq
    name: 序号
    type: integer
    db_column: seq
    required: true
    default: 1
    description: 同日多班排序（早/中/晚班）
    ui:
      widget: number
      fieldGroup: 排班
      fieldGroupPosition: 100

  - id: effective_from
    name: 生效起
    type: datetime
    db_column: effective_from
    required: true
    description: 生效起始日（含）
    ui:
      widget: datetime
      fieldGroup: 生效区间
      fieldGroupPosition: 110

  - id: effective_to
    name: 生效止
    type: datetime
    db_column: effective_to
    nullable: true
    description: 生效截止日（含）；空表示长期有效
    ui:
      widget: datetime
      fieldGroup: 生效区间
      fieldGroupPosition: 120

  - id: work_center_id
    name: 工作中心
    type: integer
    db_column: work_center_id
    nullable: true
    description: 实际上班工作中心/班组（resource_group(group_kind=work_center)）
    semantics:
      meaning: 工作中心引用
      display:
        type: association
        target_type: resource_group
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: resource_group
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dialog
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 组编码
            width: 140
          - field: name
            label: 组名称
            width: 200
    ui:
      widget: select
      relation: resource_group
      multiple: false
      clearable: true
      fieldGroup: 排班
      fieldGroupPosition: 130

  - id: note
    name: 备注
    type: string
    db_column: note
    nullable: true
    max_length: 200
    description: 备注
    ui:
      widget: input
      fieldGroup: 排班
      fieldGroupPosition: 140

  - id: created_at
    name: 创建时间
    type: datetime
    db_column: created_at
    description: 创建时间
    semantics:
      meaning: 记录创建时间
      audit_field: true

  - id: updated_at
    name: 更新时间
    type: datetime
    db_column: updated_at
    description: 更新时间
    semantics:
      meaning: 记录更新时间
      audit_field: true

indexes:
  - fields: [employee_id, shift_id, seq, effective_from]
    unique: true
    name: uq_employee_shift_assignment
  - fields: [employee_id]
    name: idx_employee_shift_assignment_employee
  - fields: [shift_id]
    name: idx_employee_shift_assignment_shift

relations:
  - id: employee_shift_assignment_to_employee
    name: 员工
    type: reference
    target: employee
    source_field: employee_id
    target_field: id
    cardinality: N:1
    description: 员工引用（必填；真外键）
  - id: employee_shift_assignment_to_shift
    name: 班次
    type: reference
    target: shift
    source_field: shift_id
    target_field: id
    cardinality: N:1
    description: 班次引用（必填；真外键）
  - id: employee_shift_assignment_to_work_center
    name: 工作中心
    type: reference
    target: resource_group
    source_field: work_center_id
    target_field: id
    cardinality: N:1
    description: 工作中心引用（可空；真外键）

ui_view_config:
  # 关系对象: 不做独立菜单（收进员工详情页分区）
  skip_auto_menu: true
  list:
    detail_mode: drawer
    title: 员工排班
    columns:
      - field: employee_id
        width: 160
        filterable: true
        filter_type: value_help
        render_as: association
        target_type: employee
        display_field: name
      - field: shift_id
        width: 160
        filterable: true
        filter_type: value_help
        render_as: association
        target_type: shift
        display_field: name
      - field: seq
        width: 90
      - field: effective_from
        width: 130
      - field: effective_to
        width: 130
      - field: work_center_id
        width: 170
        filterable: true
        filter_type: value_help
        render_as: association
        target_type: resource_group
        display_field: name
      - field: note
        width: 180
    selection:
      enabled: true
      mode: multiple
    searchFields: [note]
    actions:
      - id: create
        label: 新建排班
        icon: plus
        type: primary
        permission: employee_shift_assignment:create
    defaultSort:
      field: effective_from
      order: desc
  form:
    title: 员工排班
    layout: vertical
    sections:
      - title: 排班
        columns:
          - fields: [employee_id, shift_id]
          - fields: [seq, work_center_id]
      - title: 星期掩码
        columns:
          - fields: [day_mask_mon, day_mask_tue, day_mask_wed, day_mask_thu]
          - fields: [day_mask_fri, day_mask_sat, day_mask_sun]
      - title: 生效区间
        columns:
          - fields: [effective_from, effective_to]
          - fields: [note]
  detail:
    layout: tabs
    title: 员工排班 详情
    tabs:
      - id: basic
        label: 基本信息
        type: fields
        fields: [employee_id, shift_id, seq, day_mask_mon, day_mask_tue,
                 day_mask_wed, day_mask_thu, day_mask_fri, day_mask_sat,
                 day_mask_sun, effective_from, effective_to, work_center_id,
                 note]

category_config:
  create_permission: employee_shift_assignment:create
  update_permission: employee_shift_assignment:update
  delete_permission: employee_shift_assignment:delete
  owner_auto_permission: false
