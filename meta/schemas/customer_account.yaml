# 客户档案 (Customer Account) — foundation 步 3 · 角色层 C2
# 依据: docs/superpowers/specs/2026-10-06-customer-account-profile-design.md v1.2
#       （PM 2026-10-06 拍板：① 建骨架 ② 命名 customer_account ③ 供应商留第二步）
#       docs/superpowers/specs/2026-10-04-customer-master-data-object-model-research.md C2（档案落点）
#       docs/superpowers/specs/2026-10-04-foundation-object-model-and-architecture.md §7 步 3 · §3.3
# 上游已建: party.yaml（身份锚）· party_archive / party_internal（两读面）· party_relation（F2 角色层）
#
# 定位: 我方与某 party 的「客户关系侧商务属性」承载对象；挂在 party_relation(role='customer') 之上 1:1
# 命名裁定（spec Q1，PM 2026-10-06 拍板）:
#   取 customer_account 而非 customer_profile —— 后者与平台既有 ProfileConfig（权限档案）字面撞车；
#   且 Oracle HZ_CUST_ACCOUNTS「客户账号」正是本对象的对标语义，未来建第 2 层可无缝复用此名。
#
# 粒度裁定（D1，PM 2026-10-06 拍板 = account 级，非研究稿 C2 原倾向的 account × site_use）:
#   Oracle HZ_CUSTOMER_PROFILES_F 粒度为 CUST_ACCOUNT_ID + SITE_USE_ID，但 SITE_USE_ID **可空**
#   ⇒ account 级 profile 是 Oracle 的合法子集。且我方 C5「用途对象」已定本期不做，
#   建 site_use_id 会指向不存在的对象（同 currency decimal_places「无消费者字段是负债」教训）。
#
# ⚠️ 能力边界（禁止越界宣称）—— 本对象当前是**结构占位**，无实际业务价值字段:
#   ① 无任何财务语义字段（信用评级 / 风险码 / 账期 / 折扣 / 催收 / 信用额度）—— 随 D1「会计处置」挂起，
#      Oracle HZ_CUSTOMER_PROFILES_F 有 12 项、PeopleSoft CUST_CREDIT 独立表，本期全不做;
#   ② **不建生效期**（Oracle 主键含 EFFECTIVE_START_DATE / EFFECTIVE_END_DATE）—— 平台零对象有生效期机制，
#      单独引入成孤例 ⇒ TBD-14;
#   ③ **不建 site_use / 用途对象**（bill-to / ship-to / sold-to）—— 四家一致判定为**交易域**：
#      Oracle HZ_CUST_SITE_USES_ALL 是交易挂点（订单必填 BILL_TO_SITE_USE_ID）、
#      SAP 落在订单伙伴表 VBPA 而非客户档案、Salesforce 无此层、PeopleSoft 是三张「角色选择页」;
#   ④ ~~**不建 status** —— 与 party_relation.internal_mark 语义重叠，且无生效期则启停无意义;~~
#      [生命周期 2026-10-07 修订注] 停用语义已落关系层（party_relation.status，两态瞬时开关 §5.4/D4），
#      account 属其后 1:1 明细面，不重复建 status。原理由不成立：「与 internal_mark 重叠」否 ——
#      internal_mark 是内｜外标记（非启停）；「无生效期则启停无意义」否 —— D4 已判停用=瞬时开关。
#   ⑤ ~~**customer_type 是纯标签，非配置驱动**~~ —— [字段删除 2026-10-23] 该字段已整体删除。
#      它与 party_relation.internal_mark 同值域重复（后者是系统派生的正源）、零消费者、
#      对标失败（Oracle 是派生结果、SAP 是配置驱动，取并集后只拿到壳）、
#      且是零消费的必填项 ⇒ 按spec §3.1.2「无消费者的字段是负债」删除。
#      内外展示统一取 internal_mark。
#   ⑥ relation_id 无 DB 级 FK、无跨表类型守卫（顶层 validations: 已废弃）⇒ 可写入孤儿行 ⇒ TBD-16;
#   ⑦ 不挂任何权限维度（与 party_internal 的 org 维度绑定先例不同）⇒ 跨法人数据范围无法收窄;
#   ⑧ 供应商侧（role='vendor'）已由同批第二步落地 —— 见 vendor_account.yaml（对称结构）⇒ TBD-15 关闭。
#
# ⚠️ 跨法人差异化条款已可表达（spec v1.1 修正）:
#   party_relation 唯一键含 le_org_id（法人域）⇒ 同一对 party 在不同法人下本就是不同 relation 行
#   ⇒ 本对象挂 relation_id 即天然「一法人一档案」。剩余缺口仅「同一法人内多销售组织的条款差异」（TBD-17）。

id: customer_account
name: 客户档案
table_name: customer_accounts
description: 客户档案（我方与某 party 的客户关系侧商务属性；挂在 party_relation(role='customer') 之上 1:1）
display_name_field: name
aspects: [audit_aspect]

semantics:
  meaning: 客户档案
  category: core_entity
  aliases:
    - 客户档案
    - 客户账号
    - customer account
    - customer profile

deletion_policy:
  # S19: 主数据禁止物理删除
  # restrict_on 本期留空：customer_account 当前**零引用方** —— 无任何 schema 字段引用它
  # （relation_id 是本对象向外的引用，不是入向引用）。
  # 保留结构供未来接上后补条目（不改骨架）。对比：uom 列 2 条、region 列 5 条。
  mode: restrict
  restrict_on: []
  cascade_delete: []

audit:
  # 无需排除 PII（对照 person_profile 的 exclude 口径）—— 本对象字段全为非敏感商务参照数据
  enabled: true
  create:
    enabled: true
    fields: all
  update:
    enabled: true
    fields: changed_only
    exclude:
      - id
      - created_at
      - updated_at
  delete:
    enabled: true
    fields: business_only
    exclude:
      - id
      - created_at
      - updated_at
  associate:
    enabled: true
  dissociate:
    enabled: true

import_export:
  auto_crud: false

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true
    description: 技术主键
    semantics:
      meaning: 自增主键
      primary_key: true

  # 1:1 锚 → party_relation.id。照 party.party_id / person_profile.party_id 先例：
  #   不建 DB 级 FK（跨库 / 演进友好），仅作「当前指向」。
  # [候选来源 2026-10-17] 显式声明 value_help（照 party_relation.party1_id 范式）：
  #   target_bo = party_relation；display_field = party2_id_display（对手侧本体）。
  # 成因: party_relation 无 name 列（字段只有两侧 party 引用 + role/le_org_id/group_id），
  #   故不能照搬 {name} 口径；平台对 FK 字段生成的 *_display 虚列（PartyManagement 桥接
  #   与 list 响应均可见）是唯一可显示口径。display_field 必须落在 *_display 上，
  #   否则 _resolve_effective_fields 找不到字段、display 恒为空串。
  # value_filter(role=customer): 在**选择层**收窄候选（不选到 vendor 关系）。
  # ⚠️ 仍是「选择层」守卫，非写入守卫：直连 API 仍可写 role='vendor' 的 id（无 DB 级 FK /
  #   无跨表类型校验，顶层 validations: 已废弃）⇒ 孤儿行仍可能 ⇒ TBD-16 保持开启。
  - id: relation_id
    name: 关联客户关系
    type: integer
    db_column: relation_id
    required: true
    unique: true
    description: 关联的客户关系实例（party_relation 中 role='customer' 的行）
    semantics:
      meaning: 关联的客户关系实例（party_relation，role='customer'）；1:1，仅作当前指向
      data_category: code
      display:
        type: association
        target_type: party_relation
        display_field: party2_id_display
    value_help:
      source:
        type: bo
        target_bo: party_relation
        value_field: id
        display_field: party2_id_display
        apply_target_permissions: true
        value_filter:
          role: customer
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{party2_id_display}"
        columns:
          - field: party2_id_display
            label: 对手侧
            width: 200
          - field: role
            label: 角色
            width: 100
          - field: status
            label: 状态
            width: 90
    ui:
      widget: select
      relation: party_relation
      multiple: false

  # [字段删除 2026-10-23] 原customer_type（内部客户/外部客户）已删。
  #   删除依据（spec 2026-10-06 §3.1.2 的既定原则「无消费者的字段是负债」）：
  #   ① 语义重复 —— internal/external 与 party_relation.internal_mark 同值域，而后者才是
  #      正源（由系统按对手侧 parties.source 派生，ui.editable:false，人工改不了）。
  #      一派生一手填 ⇒ 可不一致且无任何约束。
  #   ② 零消费者 —— 全库检索无任何业务逻辑读它，仅出现在 schema / 测试 / 前端列名映射。
  #   ③ 立项理由本身是对标失败 —— Oracle CUSTOMER_TYPE 语义是「是否关联方」（派生结果），
  #      SAP KTOKD 语义是「归哪一类」（配置驱动，值域非 internal/external）；spec 把两者
  #      取并集后只拿到壳，既无 Oracle 的派生逻辑，也无 SAP 的配置能力（§6缺口6 已登记）。
  #   ④ 它是必填项 —— 零消费的必填项等于每次建档案都要用户为无意义的选择费心。
  #   内外展示统一取父关系 party_relation.internal_mark。
  #   ⚠️ DB 列 customer_type 保留不DROP（避免迁移风险），只是不再展示与录入。

  - id: name
    name: 客户档案名称
    type: string
    db_column: name
    required: true
    max_length: 200
    description: 客户档案名称（业务上通常沿用 party 名称，此处为档案的显示名）
    semantics:
      meaning: 客户档案显示名称
      display_name: true
      data_category: text
    ui:
      widget: input

  - id: description
    name: 描述
    type: text
    db_column: description
    nullable: true
    description: 客户档案说明（自由备注；商务条款字段随 D1 会计处置挂起，本期不建）
    semantics:
      meaning: 客户档案详细说明
      searchable: true
    ui:
      widget: textarea

  - id: created_at
    name: 创建时间
    type: datetime
    db_column: created_at
    description: 创建时间
    semantics:
      meaning: 记录创建时间
      audit_field: true

# 5 个显式动作（照 person_profile 范式：角色层档案不自动挂菜单，入口由权限面控制）
actions:
  - id: customer_account_create
    name: 新建客户档案
    type: create
    path: /api/v1/customer_accounts
    method: POST
    permission: customer_account:create
    ui_hints:
      label: 新建客户档案
      icon: plus
      primary: true

  - id: customer_account_read
    name: 查看客户档案
    type: read
    path: /api/v1/customer_accounts/{id}
    method: GET
    permission: customer_account:read
    ui_hints:
      label: 查看
      icon: eye

  - id: customer_account_update
    name: 编辑客户档案
    type: update
    path: /api/v1/customer_accounts/{id}
    method: PUT
    permission: customer_account:update
    ui_hints:
      label: 编辑
      icon: edit

  - id: customer_account_delete
    name: 删除客户档案
    type: delete
    path: /api/v1/customer_accounts/{id}
    method: DELETE
    permission: customer_account:delete
    ui_hints:
      label: 删除
      icon: trash
      danger: true

  - id: customer_account_list
    name: 客户档案列表
    type: list
    path: /api/v1/customer_accounts
    method: GET
    permission: customer_account:list
    ui_hints:
      label: 客户档案列表
      icon: list

# 索引：字段级 unique（列级 UNIQUE）+ 命名唯一索引「双落」
# 对齐 person_profile(idx_person_profile_party_unique) / currency(idx_currency_code) 惯例
# 不建 idx_customer_account_type：无查询场景，避免孤例（同 uom / region / currency 先例）
indexes:
  - fields: [relation_id]
    unique: true
    name: idx_customer_account_relation_unique

relations: []

# ============================================
# [分区落点 2026-10-22] 档案不再作独立菜单，进party_relation 详情页的关联分区
#   理由：customer_account 挂在 party_relation(role='customer') 之上 1:1，是「关系侧
#   属性」而非与party 并列的主体实体。party_relation 自己已于 2026-10-17 下架独立菜单、
#   收进业务伙伴页第三 tab（理由同款：关系是连接两个 party 的边，平级入口属放错层），
#   比关系再下一层的档案平级更说不通。
#   落点：party_relation.yaml 的 detail.facets 声明两个关联分区
#   （客户档案 / 供应商档案），由 AssociationSection 的 customFetcher
#   = relation_accounts 分支按 relation_id 取数（平台关联端点的过滤列写死
#   `{父对象类型}_id`，本对象会得 party_relation_id，而本表列名是 relation_id）。
#
# [ui_view_config 2026-10-22] 补 list/form/detail —— 修掉两处缺陷：
#   ① 裸 ID 列：此前本文件只写 skip_auto_menu，未声明 list.columns；/ui-config 端点
#      走 config_builder 的兜底推导（config_builder.py L70-75 → view_config_service
#      .build_list_view_from_fields），该推导按 ui.visible 收全部字段⇒ 把技术主键 id、
#      created_at、审计字段全渲染成列。分区里每行都显示 id、看不出是谁。
#      同 party_archive / party_relation 2026-10-17 的同类修复。
#   ② 编辑态空白：DetailPage 编辑态走 form.sections，只读态才走 detail.facets 的
#      fieldGroup（DetailPage.vue L759/812 对 fieldGroup 显式 if (isEditing) continue）。
#      此前既无 form 也无 detail ⇒ 新建/编辑抽屉里一个字段都没有。
#   列集合刻意不含 relation_id：本分区是 1:1 明细面，当前行所属关系已由所在分区
#      表达，该列恒等于父 id，是纯冗余（对照 excludedColumnKeys 对 product→version
#      剔冗余列的同款口径）。
# ============================================
ui_view_config:
  skip_auto_menu: true
  list:
    detail_mode: drawer
    title: 客户档案
    columns:
      - field: name
        width: 220
      - field: description
        width: 240
      - field: created_at
        width: 170
    searchFields:
      - name
    # 动作权限用双段式（permissions 表实有 customer_account:customer_account_create；
    # 单段式 customer_account:create 命中数为 0，非 admin 会看不到按钮）。
    actions:
      - id: create
        label: 新建客户档案
        icon: plus
        type: primary
        permission: customer_account:customer_account_create
      - id: export
        label: 导出
        icon: download
        type: default
  form:
    title: 客户档案信息
    layout: vertical
    sections:
      - title: 基本信息
        columns:
          - fields: [name]
      - title: 其他
        columns:
          - fields: [description]
  detail:
    facets:
      - title: 客户档案信息
        type: fieldGroup
        fields:
          - name
          - description
