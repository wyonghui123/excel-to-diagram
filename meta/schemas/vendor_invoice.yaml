# 采购发票 (Vendor Invoice) — W1
# 依据: docs/specs/spec-vendor-invoice-object-model-2026-11-11.md
#       §3 头字段 / §6 状态机 / §7 过账副作用 / §8 doc_flow 边 / §12 页面与动作
#
# 定位: 供应商来票的业务事实载体（发票 / 贷项凭证 / 借项通知单 / 取消单）。
#       匹配结果与过账副作用由服务层写，前端只读；不承载付款域事实。
#
# 服务层不变量:
#   R-VI-1   invoice_no 取号后不可变
#   R-VI-7   头金额 = Σ 行金额（round_amount 口径）
#   R-VI-9   红冲单必须回指原发票；反转类型 direction 与原类型相反
#   R-VI-14  重复发票硬拦：supplier_account_id + normalized(supplier_invoice_no)
#   R-VI-18  过账事务以 BEGIN IMMEDIATE 开启

id: vendor_invoice
name: 采购发票
table_name: vendor_invoices
description: 采购发票头（供应商来票 / 贷项 / 借项 / 取消单）
display_name_field: invoice_no

aspects:
  - audit_aspect
  - document_type_aspect

semantics:
  meaning: 采购发票
  category: business_document
  business_key: [invoice_no]
  aliases:
    - 应付发票
    - 供应商发票
    - Vendor Invoice

deletion_policy:
  mode: restrict
  restrict_on: []
  cascade_delete:
    - vendor_invoice_lines

audit:
  enabled: true
  create:
    enabled: true
    fields: all
  update:
    enabled: true
    fields: changed_only
    exclude:
      - id
      - created_at
      - updated_at
  delete:
    enabled: true
    fields: business_only
    exclude:
      - id
      - created_at
      - updated_at
  associate:
    enabled: true
  dissociate:
    enabled: true

org_scope:
  mode: direct
  field: org_id
  function: accounting
  write_check: true

numbering:
  no_field: invoice_no
  date_field: invoice_date
  type_table: type_definitions

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true
    description: 技术主键
    semantics:
      meaning: 自增主键
      primary_key: true

  - id: invoice_no
    name: 发票号
    type: string
    db_column: invoice_no
    required: true
    max_length: 30
    description: 内部发票号（编号序列取号，创建后不可变）
    semantics:
      meaning: 发票号
      data_category: code
      immutable: true
      filterable: true
      filter_type: text
      filter_label: 发票号
      filter_scope: local
    ui:
      widget: text
      editable: false

  - id: document_type_id
    name: 单据类型
    type: integer
    db_column: document_type_id
    required: true
    description: 单据类型（type_definitions，scope_bo=vendor_invoice）
    semantics:
      meaning: 采购发票单据类型
      display:
        type: association
        target_type: type_definition
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: type_definition
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        value_filter:
          scope_bo: vendor_invoice
          level: header
          status: active
          # [2026-11-12] 调整单只允许由「新建调整单」动作生成（携带 adjustment_of_invoice_id）；
          #   手工新建表单直选该类型会因必填字段 hidden_in_form 而保存失败，故从候选排除。
          code__notin: [VENDOR_INVOICE_ADJUSTMENT]
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} {name}"
    ui:
      widget: select
      relation: type_definition
      multiple: false

  - id: document_category
    name: 单据类别
    type: string
    db_column: document_category
    required: true
    max_length: 20
    default: invoice
    description: 由单据类型派生（invoice / credit_memo / debit_memo / cancellation / adjustment）
    enum_values:
      - value: invoice
        label: 发票
        color: primary
        category: active
        is_initial: true
      - value: credit_memo
        label: 贷项凭证
        color: warning
        category: active
      - value: debit_memo
        label: 借项通知单
        color: info
        category: active
      - value: cancellation
        label: 取消单
        color: danger
        category: active
      - value: adjustment
        label: 调整单
        color: warning
        category: active
    semantics:
      meaning: 单据类别
      immutable: true
      filterable: true
      filter_type: enum
      filter_label: 单据类别
      filter_scope: local
    ui:
      widget: select
      editable: false

  - id: direction
    name: 方向
    type: integer
    db_column: direction
    required: true
    default: 1
    description: 金额方向（1 正向 / -1 负向），由单据类型派生
    enum_values:
      - value: 1
        label: 正向
        color: success
        category: active
        is_initial: true
      - value: -1
        label: 负向
        color: danger
        category: active
    semantics:
      meaning: 金额方向
      immutable: true
    ui:
      widget: number
      editable: false

  - id: invoice_date
    name: 发票日期
    type: date
    db_column: invoice_date
    required: true
    description: 供应商发票日期（编号日期段基准）
    semantics:
      meaning: 发票日期
      data_category: date
      filterable: true
      filter_type: date_range
      filter_label: 发票日期
      filter_scope: local
    ui:
      widget: date

  - id: received_date
    name: 收票日期
    type: date
    db_column: received_date
    nullable: true
    description: 我方收到发票的日期（匹配基准日）
    semantics:
      meaning: 收票日期
      data_category: date
    ui:
      widget: date

  - id: posting_date
    name: 过账日期
    type: date
    db_column: posting_date
    nullable: true
    description: 过账日期，空则取发票日期
    semantics:
      meaning: 过账日期
      data_category: date
    ui:
      widget: date

  - id: status
    name: 状态
    type: string
    db_column: status
    required: true
    max_length: 20
    default: draft
    description: 单据状态
    enum_values:
      - value: draft
        label: 草稿
        color: info
        category: active
        is_initial: true
      - value: submitted
        label: 已提交
        color: warning
        category: active
      - value: posted
        label: 已过账
        color: success
        category: active
      - value: cancelled
        label: 已取消
        color: danger
        category: terminal
      - value: reversed
        label: 已红冲
        color: danger
        category: terminal
    semantics:
      meaning: 单据状态
      filterable: true
      filter_type: enum
      filter_label: 状态
      filter_scope: local
    ui:
      widget: select
      editable: false

  - id: match_status
    name: 匹配状态
    type: string
    db_column: match_status
    required: true
    max_length: 20
    default: unmatched
    description: 头级匹配聚合结果
    enum_values:
      - value: unmatched
        label: 未匹配
        color: info
        category: active
        is_initial: true
      - value: matched
        label: 已匹配
        color: success
        category: active
      - value: exception
        label: 匹配异常
        color: danger
        category: active
      - value: overridden
        label: 例外放行
        color: warning
        category: active
    semantics:
      meaning: 匹配状态
      filterable: true
      filter_type: enum
      filter_label: 匹配状态
      filter_scope: local
    ui:
      widget: select
      editable: false

  - id: match_mode
