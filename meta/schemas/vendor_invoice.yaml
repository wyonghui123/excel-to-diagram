# 状态机：提交 / 过账 / 取消 / 红冲由 vendor_invoice_guard_interceptor 委托
# vendor_invoice_match_service 执行（跨表副作用唯一写入口）。
# 过账前置：match_status ∈ {matched, overridden} 且重复票硬拦通过（§6.1）。
# 红冲（posted → reversed）= 生成红字采购贷项凭证（direction=-1，回指原票）
# + 对原票行已写出的 billing / ap_match 边写红字冲减，由 reversal_orchestrator
# 按固定 7 步执行（自持事务，调用方只预取号）。
rules:
  - id: submit_vendor_invoice
    name: 提交发票
    type: state_transition
    state_field: status
    from_states: [draft]
    to_state: submitted
    triggers: [before_update]
    ui_hints:
      label: 提交
      icon: send
      confirm_message: "提交后将执行三单匹配并锁定发票内容，确定提交吗？"

  - id: post_vendor_invoice
    name: 过账
    type: state_transition
    state_field: status
    from_states: [submitted]
    to_state: posted
    triggers: [before_update]
    ui_hints:
      label: 过账
      icon: check_circle
      highlight: true
      confirm_message: "过账将写入采购订单 / 收货的已开票量并固化匹配结果，且不可撤销（只能红冲），确定过账吗？"

  - id: cancel_vendor_invoice
    name: 取消发票
    type: state_transition
    state_field: status
    from_states: [draft, submitted]
    to_state: cancelled
    triggers: [before_update]
    ui_hints:
      label: 取消
      icon: close
      confirm_message: "取消后发票作废，确定取消吗？"

  - id: reverse_vendor_invoice
    name: 红冲发票
    type: state_transition
    state_field: status
    from_states: [posted]
    to_state: reversed
    triggers: [before_update]
    ui_hints:
      label: 红冲
      icon: undo
      confirm_message: "红冲将生成一张红字采购贷项凭证并对已开票量写红字冲减，原发票不可再修改、不可再次红冲；确定红冲吗？"
      input_fields:
        - field: reversal_reason
          label: 红冲原因
          type: textarea
          required: true
          placeholder: 请填写红冲原因

doc_effect:
  posting:
    event_key: "vendor_invoice:{id}:post"
    direction_field: direction
  faces:
    - id: doc_flow_red
      primitive: vendor_invoice_doc_flow_red_edge
      args:
        doc_id: "{reversal.doc.id}"
  reversal:
    from_states: [posted]
    to_state: reversed
    idempotent_states: [reversed]
    order: declared
    create_document:
      primitive: vendor_invoice_red_letter
    write_audit_fields:
      updated_at: "{now}"

# 行来源策略：document_role → 允许的行来源种类（§4.3）
# 内核在插入行时按头表角色校验；声明了策略但角色缺失 → 默认拒绝（fail-closed）
line_source_policy:
  invoice: [purchase_order_schedule, receipt_line, manual]
  credit_memo: [invoice_line, return_line, manual]
  debit_memo: [invoice_line, manual]
  cancellation: [invoice_line]
  adjustment: [invoice_line]

indexes:
  - fields: [invoice_no]
    unique: true
    name: uq_vendor_invoice_no
  - fields: [reversal_of_invoice_id]
    type: partial
    unique: true
    condition: "reversal_of_invoice_id IS NOT NULL"
    name: uq_vendor_invoice_reversal
  - fields: [adjustment_of_invoice_id]
    type: partial
    unique: false
    condition: "adjustment_of_invoice_id IS NOT NULL"
    name: idx_vendor_invoice_adjustment_of
  - fields: [status, invoice_date]
    name: idx_vendor_invoice_status_date
  - fields: [supplier_account_id, status]
    name: idx_vendor_invoice_supplier_status
  - fields: [supplier_account_id, supplier_invoice_no]
    name: idx_vendor_invoice_supplier_no
  - fields: [document_type_id]
    name: idx_vendor_invoice_document_type
  - fields: [purchase_org_id]
    name: idx_vendor_invoice_purchase_org
  - fields: [org_id, status]
    name: idx_vendor_invoice_org_status

relations:
  - id: vendor_invoice_to_document_type
    name: 单据类型
    type: reference
    target: type_definition
    source_field: document_type_id
    target_field: id
    cardinality: N:1
    description: 单据类型引用
  - id: vendor_invoice_to_supplier
    name: 供应商
    type: reference
    target: vendor_account
    source_field: supplier_account_id
    target_field: id
    cardinality: N:1
    description: 供应商往来单位引用
  - id: vendor_invoice_to_party
    name: 供应商主体
    type: reference
    target: party
    source_field: supplier_party_id
    target_field: id
    cardinality: N:1
    description: 供应商主体引用
  - id: vendor_invoice_to_currency
    name: 币种
    type: reference
    target: currency
    source_field: currency_id
    target_field: id
    cardinality: N:1
    description: 币种引用
  - id: vendor_invoice_to_org
    name: 财务组织
    type: reference
    target: org
    source_field: org_id
    target_field: id
    cardinality: N:1
    description: 财务归属组织引用
  - id: vendor_invoice_to_purchase_org
    name: 采购组织
    type: reference
    target: org
    source_field: purchase_org_id
    target_field: id
    cardinality: N:1
    description: 采购组织引用（可空）
  - id: vendor_invoice_to_reversal
    name: 红冲原单
    type: reference
    target: vendor_invoice
    source_field: reversal_of_invoice_id
    target_field: id
    cardinality: N:1
    description: 红字 / 取消单指向原发票（可空）
  - id: vendor_invoice_to_adjustment
    name: 调整原单
    type: reference
    target: vendor_invoice
    source_field: adjustment_of_invoice_id
    target_field: id
    cardinality: N:1
    description: 调整单指向原发票 / 原调整单（可空）

ui_view_config:
  list:
    detail_mode: drawer
    title: 采购发票
    columns:
      - field: invoice_no
        width: 170
        sortable: true
      - field: document_type_id
        width: 150
      - field: invoice_date
        width: 130
        sortable: true
      - field: direction
        width: 90
      - field: supplier_account_id
        width: 180
        filterable: true
        filter_type: select
      - field: supplier_invoice_no
        width: 160
      - field: currency_id
        width: 100
      - field: gross_amount
        width: 130
      - field: match_status
        width: 110
        filterable: true
        filter_type: select
      - field: status
        width: 110
        filterable: true
        filter_type: select
      - field: purchase_org_id
        width: 140
      - field: org_id
        width: 140
    filters:
      - field: document_category
      - field: status
      - field: match_status
      - field: supplier_account_id
      - field: invoice_date
      - field: adjustment_direction
    selection:
      enabled: true
      mode: multiple
    defaultSort:
      field: invoice_no
      order: desc
    actions:
      - id: create
        label: 新建采购发票
        icon: plus
        type: primary
        permission: vendor_invoice:create
      - id: export
        label: 导出
        icon: download
        type: default
  form:
    title: 采购发票信息
    layout: vertical
    sections:
      - title: 基本信息
        columns:
          - fields: [invoice_no, document_type_id]
          - fields: [invoice_date, received_date]
          - fields: [status, supplier_invoice_no]
      - title: 供应商
        columns:
          - fields: [supplier_account_id, supplier_party_id]
          - fields: [supplier_tax_no]
          - fields: [supplier_site_text]
      - title: 金额
        columns:
          - fields: [currency_id, exchange_rate]
          - fields: [exchange_rate_type, exchange_rate_date]
          - fields: [net_amount, tax_amount]
          - fields: [gross_amount, rounding_diff]
      - title: 组织与匹配
        columns:
          - fields: [org_id, purchase_org_id]
          - fields: [match_mode, match_pricing_mode]
          - fields: [settlement_mode]
      - title: 备注
        columns:
          - fields: [remark]
      - title: 调整信息
        columns:
          - fields: [adjustment_of_invoice_id, adjustment_direction]
          - fields: [adjustment_reason]
  detail:
    showChangeHistory: true
    showRelations: true
    actions:
      - id: match
        label: 执行匹配
        icon: swap
        variant: secondary
        permission: vendor_invoice:match
        action: vendor_invoice.match
        visible_when: "status in ['draft', 'submitted']"
      - id: override_match
        label: 例外放行
        icon: unlock
        variant: secondary
        permission: vendor_invoice:override_match
        action: vendor_invoice.override_match
        visible_when: "status in ['draft', 'submitted']"
        input_fields:
          - field: override_reason
            label: 放行原因
            type: textarea
            required: true
      - id: override_duplicate
        label: 重复票放行
        icon: unlock
        variant: secondary
        permission: vendor_invoice:override_duplicate
        action: vendor_invoice.override_duplicate
        # [2026-11-12] 补齐 visible_when：其余三个动作均有，唯它缺失导致已过账单据仍可放行
        visible_when: "status in ['draft', 'submitted']"
        input_fields:
          - field: reason
            label: 放行原因
            type: textarea
            required: true
      - id: create_adjustment
        label: 新建调整单
        icon: edit
        variant: secondary
        permission: vendor_invoice:create
        action: vendor_invoice.create_adjustment
        visible_when: "status == 'posted'"
        input_fields:
          - field: direction
            label: 调整方向
            type: select
            required: true
            options:
              - value: increase
                label: 增加（补开数量/金额）
              - value: decrease
                label: 减少（冲减数量/金额）
          - field: reason
            label: 调整原因
            type: textarea
            required: true
    facets:
      - title: 基本信息
        id: vendor_invoice_basic
        type: fieldGroup
        fields:
          - invoice_no
          - document_type_id
          - document_category
          - direction
          - invoice_date
          - received_date
          - posting_date
          - status
          - supplier_invoice_no
      - title: 供应商
        id: vendor_invoice_supplier
        type: fieldGroup
        fields:
          - supplier_account_id
          - supplier_party_id
          - supplier_tax_no
          - supplier_site_text
      - title: 金额
        id: vendor_invoice_amount
        type: fieldGroup
        fields:
          - currency_id
          - exchange_rate
          - exchange_rate_type
          - exchange_rate_date
          - net_amount
          - tax_amount
          - gross_amount
          - rounding_diff
      - title: 匹配与结算
        id: vendor_invoice_match
        type: fieldGroup
        fields:
          - match_mode
          - match_pricing_mode
          - match_status
          - match_exception_reason
          - match_matched_at
          - match_matched_by
          - settlement_mode
      - title: 系统信息
        id: vendor_invoice_system
        type: fieldGroup
        fields:
          - org_id
          - purchase_org_id
          - reversal_of_invoice_id
          - adjustment_of_invoice_id
          - adjustment_direction
          - adjustment_reason
          - remark
          - created_at
          - updated_at
  child_sections:
    - child_object: vendor_invoice_line
      title: 发票行
      display: tab
      pageSize: 10
      useMetaList: true
      enableDetail: true
      enableAutoCrud: true