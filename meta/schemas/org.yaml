# 组织元模型 (原 user_group.yaml, Plan A 迁移 + Spec 16 §2.2/2.3 扩展)
# 说明: 组织（Org），用于组织用户和实现委托管理。
# 新增字段: org_type (department/team/division/company)
# [v3.5 2026-10-17 I5 拍板 C] org_scope 废弃 (见字段本体登记); 列保留待 v095 硬删
# 表名: user_groups → orgs
# 关联表: user_group_members → org_members, group_roles → org_permission_sets
# [生命周期 2026-10-07] 补 status + activate/deactivate（蓝图 §5.4 最小约定 + D4 瞬时开关）
#   口径: status 为 required + default active（与 party / location / region / uom / currency 先例一致）;
#         停用 = 瞬时开关、不加生效日列（D4）; 停用后不再承接新业务、不进入新引用候选，历史保留;
#         §5.4 原「org 沿用现有（状态集待定）」由此关闭（两态拍板 2026-10-07）;
#         只取 activate / deactivate 两动作——不取 freeze/unfreeze（组织无"库存收发冻结"语义）。

id: org
name: 组织
table_name: orgs
description: 组织（Org），用于组织用户和实现委托管理
display_name_field: name
aspects: [audit_aspect]

semantics:
  meaning: 组织
  category: security_entity
  business_key: [code]
  display_name_field: name
  aliases:
    - 组织
    - Org
    - 用户组  # 历史 alias (中文保留, 英文移除以避免与 v089 DROP 后的 user_group 混淆)

deletion_policy:
  # [FIX 2026-06-12 v2] 强依赖检查: 有成员/权限集/数据权限/子组时禁止删除,
  # 避免误删导致权限/数据权限丢失。
  mode: restrict  # 改用 restrict mode, 让 restrict_on 规则生效
  restrict_on:
    - table: org_members
      foreign_key: org_id
      message: 组织下还有成员，请先移除所有成员后再删除
    - table: org_permission_sets
      foreign_key: org_id
      message: 组织还分配了权限集，请先撤销权限集后再删除
    - table: org_data_permissions
      foreign_key: org_id
      message: 组织还配置了数据权限，请先清除数据权限后再删除
    - table: orgs
      foreign_key: parent_id
      message: 该组织下还有子组织，请先删除或迁移子组织后再删除
    - table: sales_orders
      foreign_key: org_id
      message: 该组织被销售订单引用（业务实体），请先处理订单后再删除
    - table: sales_orders
      foreign_key: sales_org_id
      message: 该组织被销售订单引用（销售组织），请先处理订单后再删除
  # [2026-10-22 补漏] org_functions 建表时未建到 orgs 的外键 ⇒ 删除组织不会清理职能行，
  #   会留下孤儿职能。而 party_internal 视图谓词是 EXISTS(org_functions ...) ⇒ 已删组织的
  #   内部表示仍会出现在「我方组织」候选集中（幽灵主体），同 id 组织重建还会让旧职能复活。
  #   本项由 CascadeInterceptor._cleanup_association_tables 处理（字符串形态经
  #   _infer_fk_column 推导出 org_id）。parties 行仍按「不删除原则」保留：视图不再命中，
  #   但存量关系引用不断。
  cascade_delete:
    - org_functions

audit:
  enabled: true
  create:
    enabled: true
    fields: all
  update:
    enabled: true
    fields: changed_only
    exclude:
      - id
      - created_at
      - updated_at
  delete:
    enabled: true
    fields: business_only
    exclude:
      - id
      - created_at
      - updated_at
      - manager_id
      - parent_id
  associate:
    enabled: true
  dissociate:
    enabled: true

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true
    description: 技术主键
    semantics:
      meaning: 自增主键
      primary_key: true

  - id: name
    name: 组织名称
    type: string
    db_column: name
    required: true
    max_length: 100
    description: 组织名称
    semantics:
      meaning: 组织显示名称
      display_name: true

  - id: code
    name: 组织编码
    type: string
    db_column: code
    required: true
    unique: true
    max_length: 50
    pattern: "^[a-z][a-z0-9_]*$"
    description: 组织唯一编码
    semantics:
      meaning: 组织业务编码
      business_key: true
      immutable: true

  - id: org_type
    name: 组织类型
    type: string
    db_column: org_type
    required: true
    default: department
    description: 组织类型（部门/团队/事业部/公司）
    enum_values:
      - value: department
        label: 部门
        color: primary
      - value: team
        label: 团队
        color: success
      - value: division
        label: 事业部
        color: warning
      - value: company
        label: 公司
        color: danger
    semantics:
      meaning: 组织类型分类
    ui:
      widget: select
      filterable: true

  # [v3.5 2026-10-17 I5 拍板 C] org_scope 废弃 (Foundation 蓝图 v2.5 I5=B → v3.5 I5=C;
  #   v2.6 槽位已被 L1 职能域层砍除占用, 故本覆盖登记为 v3.5).
  #   依据: org 不承载外部对手档案 (同蓝图 S5); 该字段前端 src/ 零引用、后端无任何 SQL
  #         按此列过滤 (历史命中皆为 check_org_scope / expand_org_scope 方法名巧合)、
  #         全库 64 条 org 全为 internal ⇒ 无消费方; 且 I5=B 与 S5 及 B′ 自相矛盾.
  #   列保留 (v072 建列为 TEXT DEFAULT 'internal'; SQLite < 3.35 DROP COLUMN 不可用),
  #   建议 2027-Q1 走 v095__drop_orgs_org_scope.py 硬删; deprecated_since 记蓝图版本.
  - id: org_scope
    name: 组织范围
    type: string
    db_column: org_scope
    nullable: true
    default: internal
    description: 组织范围（已废弃；org 不承载内外部档案分域）
    deprecated: true
    deprecated_since: 'v3.5'
    deprecated_message: 'org 不承载内外部档案分域；外部对手档案由 party 对外档案面承载'
    semantics:
      meaning: 组织所属范围
    ui:
      widget: select

  # [生命周期 2026-10-07] 两态 status（§5.4 最小约定；此前「状态集待定」由此关闭）
  - id: status
    name: 状态
    type: string
    db_column: status
    required: true
    default: active
    description: 组织状态 active/inactive（生命周期约定 §5.4；停用=瞬时开关，D4 不加生效日列）
    enum_values:
      - value: active
        label: 启用
        color: success
        category: active
        is_initial: true
        description: 启用，可承接新业务与引用
      - value: inactive
        label: 停用
        color: info
        category: inactive
        description: 停用，不再承接新业务/不进入新引用候选；历史保留
    semantics:
      meaning: 组织启用状态
      filterable: true
      filter_type: enum
      filter_label: 状态
      filter_scope: local
    ui:
      widget: select

  - id: parent_id
    name: 上级组织
    type: integer
    db_column: parent_id
    nullable: true
    description: 上级组织ID，支持层级结构
    semantics:
      meaning: 上级组织引用
      parent_key: true
      hierarchy_field: parent
      hierarchy_level:
        relation: self_reference
        max_depth: 10
      display:
        type: association
        target_type: org
        display_field: name
        placeholder: "无上级"
    value_help:
      source:
        type: bo
        target_bo: org
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        hierarchy:
          enabled: true
          parent_field: parent_id
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        # [FIX 2026-09-05 父组织树状 SearchHelp] 自引用层级防环:
        # 编辑态排除当前记录自身 (SearchHelpDialog 通用树再排除其全部子孙)
        exclude_self: true
      presentation:
        # [FIX 2026-09-05 父组织树状 SearchHelp] dropdown → dialog + tree:
        # 上级组织按组织树弹窗单选 (SearchHelpDialog 通用 buildTree, 读 source.hierarchy)
        result_type: dialog
        display_mode: tree
        display_format: "{name}"
        columns:
          - field: code
            label: 编码
            width: 120
          - field: name
            label: 名称
            width: 200
    ui:
      widget: select
      relation: org
      multiple: false
      clearable: true

  - id: manager_id
    name: 管理员
    type: integer
    db_column: manager_id
    nullable: true
    description: 组织管理员ID
    # [v088 2026-09-15 soft-delete Spec 19 M4] manager_id 字段已废弃 (FR-011 过渡完成).
    #   真实数据摸底: staging + prod 均 0 行非空 (数据摸底见 tools/v19_p2_audit_remote.py).
    #   读路径 fallback 已删除 (org_service.get_managed_orgs 走 OrgAdminScopeService 主源).
    #   列保留 (SQLite < 3.35 DROP COLUMN 不可用); 建议 2027-Q1 走 v09x 硬删.
    deprecated: true
    deprecated_since: 'v088'
    deprecated_message: '请改用资源矩阵 org 行级规则配置委托 (受托管理员=权限集绑定组织节点)'
    semantics:
      meaning: 组织管理员
      display:
        type: association
        target_type: user
        display_field: display_name
        placeholder: "未指定管理员"
    value_help:
      source:
        type: bo
        target_bo: user
        value_field: id
        display_field: display_name
        code_field: username
        apply_target_permissions: true
        value_filter:
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 1
      presentation:
        result_type: dropdown
        display_format: "{display_name} ({username})"
        columns:
          - field: username
            label: 用户名
            width: 120
          - field: display_name
            label: 显示名称
            width: 150
          - field: email
            label: 邮箱
            width: 200
    ui:
      widget: select
      relation: user
      multiple: false
      clearable: true

  - id: description
    name: 描述
    type: string
    db_column: description
    max_length: 500
    nullable: true
    description: 组织描述
    semantics:
      meaning: 组织详细说明
      searchable: true
    ui:
      render_as: textarea

  - id: created_at
    name: 创建时间
    type: datetime
    db_column: created_at
    description: 创建时间
    semantics:
      meaning: 记录创建时间
      audit_field: true

  - id: member_count
    name: 成员数
    type: integer
    description: 组织成员数量（计算字段，通过 org_members 子查询获得）
    computed: true
    db_column: null
    semantics:
      meaning: 成员统计
      virtual: true
      cacheable: true
      cache_ttl: 300
    # [FIX 2026-10-03] computation 声明补到字段本体, 与 business_object.relation_count
    # 等 7 个对象一致; 此前只写在 ui_view_config.list.columns[] 里, 该位置不会被并回
    # MetaField, 导致 v2 排序 400 / 过滤被静默丢弃
    computation:
      type: count_relations
      scope: self

indexes:
  - fields: [code]
    unique: true
    name: idx_org_code
  - fields: [parent_id]
    name: idx_org_parent
  - fields: [org_type]
    name: idx_org_type
  # [v3.5 2026-10-17 I5=C] idx_org_scope 已撤 (列废弃且无消费方)
  # [生命周期 2026-10-07] 状态筛选索引（停用组织不进入新引用候选）
  - fields: [status]
    name: idx_org_status

relations:
  # [FK 2026-10-08] 补对象级自引用声明（原relations: [] 空 ⇒ 字段级
  # semantics.hierarchy_level.relation: self_reference 仅表达UI/层级语义，
  # 落库器只认 relations[].type ∈ (parent_child|reference) 且 reference 必带
  # source_field ⇒ parent_id 一直未落成真FK，与 party_group/item_group/location/
  # region/calendar 五处同类声明不一致。本条补齐后 orgs.parent_id 强制引用。
  - id: org_to_parent
    name: 上级组织
    type: reference
    target: org
    source_field: parent_id
    target_field: id
    cardinality: "N:1"
    description: 上级组织引用（自引用层级；[FK 2026-10-08] 由展示语义升级为真外键；NULL=根组织）
  # 注：manager_id 为已废弃死功能（[v088 2026-09-15 soft-delete Spec 19 M4]
  # FR-011 过渡完成，零数据 / 无消费点，表单与详情均已下线）⇒ 刻意不建 FK。

# 生命周期: 复用平台标准动作（蓝图 §5.4 最小约定 / D4 瞬时开关）
#   inactive --activate--> active
#   active   --deactivate--> inactive
#   仅两态两动作：不取 freeze/unfreeze（组织无"库存收发冻结"语义）
rules:
  - id: activate_org
    name: 启用组织
    type: state_transition
    action_ref: activate
    state_field: status
    from_states: [inactive]
    to_state: active
    triggers: [before_update]
    ui_hints:
      label: 启用
      icon: check_circle
      confirm_message: "确定要启用此组织吗？启用后可继续承接业务与引用。"
      highlight: true

  - id: deactivate_org
    name: 停用组织
    type: state_transition
    action_ref: deactivate
    state_field: status
    from_states: [active]
    to_state: inactive
    triggers: [before_update]
    ui_hints:
      label: 停用
      icon: pause_circle
      confirm_message: "确定要停用此组织吗？停用后不再承接新业务、不进入新引用候选；历史保留。"

associations:
  members:
    name: members
    label: 成员
    plural_label: 成员列表
    target_type: user
    type: many_to_many
    through: org_members
    source_key: org_id
    target_key: user_id
    description: 组织成员关联
    metadata_fields:
      - id: is_manager
        name: 是否管理员
        type: boolean
        default: false
        description: 是否为组织管理员
    display:
      label: 成员
      plural_label: 成员
      target_display_field: display_name
      target_code_field: username
      target_avatar_field: avatar_url
      columns:
        - id: username
          label: 用户名
          width: 120
        - id: display_name
          label: 显示名称
          width: 150
        - id: email
          label: 邮箱
          width: 200
    actions:
      assign:
        name: add_member
        label: 添加成员
      unassign:
        name: remove_member
        label: 移除成员
        confirm_message: 确定要从此组织移除该成员吗？

  permission_sets:
    name: permission_sets
    label: 权限集
    plural_label: 权限集列表
    target_type: permission_set
    type: many_to_many
    through: org_permission_sets
    source_key: org_id
    target_key: permission_set_id
    description: 组织权限集关联
    display:
      label: 权限集
      plural_label: 权限集
      target_display_field: name
      target_code_field: code
      columns:
        - id: code
          label: 权限集编码
          width: 120
        - id: name
          label: 权限集名称
          width: 150
        - id: description
          label: 描述
          width: 250
    actions:
      assign:
        name: assign_permission_set
        label: 分配权限集
      unassign:
        name: revoke_permission_set
        label: 撤销权限集
        confirm_message: 确定要撤销此权限集的分配吗？

  functions:
    name: functions
    label: 职能
    plural_label: 职能列表
    target_type: org_function
    type: one_to_many
    source_key: id
    target_key: org_id
    description: 组织多职能配置 (Spec 16 §2.3)
    display:
      label: 职能
      plural_label: 职能
      target_display_field: function_type
      columns:
        - id: function_type
          label: 职能类型
          width: 150
        - id: is_primary
          label: 是否主职能
          width: 100
    actions:
      add:
        name: add_function
        label: 添加职能
      remove:
        name: remove_function
        label: 移除职能

category_config:
  create_permission: org:create
  update_permission: org:update
  delete_permission: org:delete
  owner_auto_permission: false

# 安全配置（启用权限委托）
security:
  permission_delegation: true

ui_view_config:
  showChangeHistory: true

  # 页面形态：单页 hub（左树 = 组织层级，右表 = 组织列表）
  #   组织与左树是同一对象（自指范围）：勾选节点 → 右表 id__in = 勾选 ∪ 全部子孙；
  #   未勾选 = 不过滤（后端全量），符合「默认看全部组织」的业务预期。
  hub:
    object_types: [org]
    default_tab: org
    tabs:
      org: 组织
    state_key: orgManagerStateBeforeDiagram
    disable_version_context: true
    scope:
      type: hierarchy
      object: org
      scope_key: org
      parent_field: parent_id
      # 空串 = 保持后端返回顺序（与改造前一致）
      order_by: ''
      # orgs 959 行 > 后端单次 500 行上限，逐页拉全量，否则树缺节点
      paginate_all: true
      node_icon: office
      empty_text: 暂无组织数据
      search_placeholder: 搜索组织（编码/名称）
    filters:
      org:
        field: id

  list:
    detail_mode: drawer
    title: 组织管理
    description: 系统组织列表
    columns:
      - field: name
        width: 200
      - field: code
        width: 120
        sortable: true
      - field: org_type
        width: 100
        filterable: true
        filter_type: select
      # [v3.5 2026-10-17 I5=C] org_scope 废弃下线, 列表不再展示
      - field: parent_id
        width: 150
        filterable: true
        filter_type: value_help
        render_as: association
        target_type: org
        display_field: name
        placeholder: "无上级"
      - field: status
        width: 90
        filterable: true
        filter_type: select
      # [FIX 2026-09-06 Spec 19 v084] manager_id 为死功能 (零数据/无消费点),
      # 「管理员」标签按 spec 下线; DB 列保留至 v085 删列
      - field: member_count
        width: 100
        sortable: true
        filterable: true
        filter_type: number_range
        type: number
        align: right
        computed: true
        computation:
          type: count_relations
          scope: self
      - field: description
        width: 250
        type: ellipsis
      - field: created_at
        width: 160
        format: datetime
        filter_type: date_range
      - field: updated_at
        width: 160
        format: datetime
        filter_type: date_range
    selection:
      enabled: true
      mode: multiple
    searchFields:
      - name
      - code
    actions:
      - id: create
        label: 新建组织
        icon: plus
        type: primary
        permission: org:create
      - id: export
        label: 导出
        icon: download
        type: default
      - id: import
        label: 导入
        icon: upload
        type: default
    batch_actions:
      - id: batch_delete
        label: 批量删除
        icon: delete
        type: danger
        permission: org:delete
        confirm: 确定要删除选中的组织吗？
    defaultSort:
      field: updated_at
      order: desc
    filters:
      - field: name
        label: 组织名称
        type: string
        operator: contains
      - field: code
        label: 组织编码
        type: string
        operator: contains
      - field: org_type
        label: 组织类型
        type: select
        options:
          - { value: department, label: 部门 }
          - { value: team, label: 团队 }
          - { value: division, label: 事业部 }
          - { value: company, label: 公司 }

  form:
    title: 组织信息
    layout: vertical
    sections:
      - title: 基本信息
        columns:
          - fields: [code, name]
          - fields: [org_type]
          # [v3.5 2026-10-17 I5=C] org_scope 废弃下线, 表单不再展示
          # [FIX 2026-09-06 Spec 19 v084] manager_id 死功能下线, 表单不再展示
          - fields: [parent_id]
          - fields: [status]
      - title: 其他信息
        columns:
          - fields: [description]

  detail:
    layout: tabs
    title: "{record.name} 详情"
    tabs:
      - id: basic
        label: 基本信息
        type: fields
        fields:
          - code
          - name
          - org_type
          # [v3.5 2026-10-17 I5=C] org_scope 废弃下线, 详情不再展示
          - parent_id
          # [FIX 2026-09-06 Spec 19 v084] manager_id 死功能下线, 详情不再展示
          - status
          - description

      - id: members
        label: 成员
        type: association
        association: members
        actions:
          - assign
          - unassign

      - id: permission_sets
        label: 权限集
        type: association
        association: permission_sets
        actions:
          - assign
          - unassign

      - id: permission_preview
        label: 权限预览
        icon: lock
        type: readonly_aggregate
        endpoint: /api/v1/orgs/{id}/permission-config

      # [业务伙伴关系分区 2026-10-21] 组织侧视图：与 party_archive 的「业务伙伴关系」分区对称。
      #   为什么必须走 customFetcher: party_relations 无 org_id 列（party1_id 存的是
      #   parties.id），平台关联端点把过滤列写死为 `{父对象类型}_id` ⇒ 会得 org_id 而查不到。
      #   取数由 AssociationSection 的 org_party_relations 分支接管（org → party_internal
      #   换 party id → 按 party1_id 单查），与 party_archive 侧同款先例。
      #   只读: 行不可行内编辑（编辑权归「业务伙伴」侧入口）；本分区只提供**新建**入口。
      #   新建: 本对象（组织）经 party_internal 换出内部表示，预绑为关系我方侧
      #     （party1_id）；对手侧由用户选。与 party_archive 侧同一套引导式弹窗，
      #     仅在 xAPP 业务部署有效（party 模块门控关闭时整个分区不出现）。
      #   显示: 只有具备我方主体职能（BU/法人）的 org 才有 party_internal 内部表示；
      #     无内部表示的普通组织此分区恒空 —— 这是正确口径，不是缺陷。
      #   位置: 放在 tab 末尾（权限预览之后）—— 业务伙伴关系是低频查询入口，
      #     且多数组织无内部表示而为空，放前面会挡住常用的权限类分区。
      - id: party_relations
        label: 业务伙伴关系
        type: association
        association: party_relation
        customFetcher: org_party_relations
        readonly: true
        pageSize: 20
        # 创建入口（引导式）：AssociationSection 的 isPartyRelations 分支从
        #   section.actions 读 create，org 侧预绑 party1_id。
        #   permission 用双段式（permissions 表实有 party_relation:party_relation_create）。
        actions:
          - key: create
            label: 新建伙伴关系
            variant: primary
            permission: party_relation:party_relation_create

