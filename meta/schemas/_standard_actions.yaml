# 标准动作声明 — 纯元数据，不映射数据库表
# 由 StandardActionLoader 独立加载，不经过 yaml_loader 的 BO Schema 链路
#
# [Spec 21 PM 反馈 2026-09-12] instance_scope 字段定义动作的语义作用域:
#   - object:  对象级动作（对该资源类型生效，无需指定具体实例）
#     例: 创建前无实例、列表返回集合、搜索/管理是类型级操作
#   - instance: 实例级动作（对资源类型的具体实例生效，需配合数据范围限定实例集合）
#     例: 读/更新/删除/审批/分配单个实例
#
# 与 action_type 区分:
#   - action_type (crud/batch/business): 动作的业务分类，决定列头分块标签
#   - instance_scope (object/instance): 动作的语义作用域，决定列头副标签
#
# 改动前所有 action 都按 action_type 标 [CRUD/批量/业务] 对象级，导致语义不准确
# （实际上 read/update/delete 都是对实例生效）。
# 改动后 read/update/delete/approve/assign/... 列头改为 [CRUD] 实例级

standard_actions:
  - id: crud_create
    name: 创建
    action_type: crud
    instance_scope: object
    method: POST
    description: 创建资源（创建前无具体实例，对象级）

  - id: crud_read
    name: 读取
    action_type: crud
    instance_scope: instance
    method: GET
    description: 读取单个资源（对资源实例生效）

  - id: crud_update
    name: 更新
    action_type: crud
    instance_scope: instance
    method: PUT
    description: 更新单个资源（对资源实例生效）

  - id: crud_delete
    name: 删除
    action_type: crud
    instance_scope: instance
    method: DELETE
    description: 删除单个资源（对资源实例生效，不可逆）

  - id: crud_list
    name: 列表
    action_type: crud
    instance_scope: object
    method: GET
    description: 列表查询（返回某类型的实例集合，对象级入口）

  - id: export
    name: 导出
    action_type: batch
    instance_scope: instance
    method: GET
    description: 导出资源（对范围内实例集合生效，合规敏感）

  - id: import
    name: 导入
    action_type: batch
    instance_scope: object
    method: POST
    description: 导入资源（创建型批处理，对象级）

  - id: approve
    name: 审批
    action_type: business
    instance_scope: instance
    method: POST
    description: 审批单个实例

  - id: search
    name: 搜索
    action_type: crud
    instance_scope: object
    method: GET
    description: 搜索查询（返回结果集合，对象级）

  - id: assign
    name: 分配
    action_type: business
    instance_scope: instance
    method: POST
    description: 分配单个实例

  - id: unassign
    name: 取消分配
    action_type: business
    instance_scope: instance
    method: POST
    description: 取消分配单个实例

  - id: associate
    name: 关联
    action_type: business
    instance_scope: instance
    method: POST
    description: 建立关联关系（对实例生效）

  - id: dissociate
    name: 取消关联
    action_type: business
    instance_scope: instance
    method: POST
    description: 解除关联关系（对实例生效）

  - id: grant
    name: 授权
    action_type: business
    instance_scope: instance
    method: POST
    description: 权限授予（对实例生效）

  - id: revoke
    name: 撤销
    action_type: business
    instance_scope: instance
    method: POST
    description: 撤销授权（对实例生效，提权风险）

  - id: manage
    name: 管理
    action_type: business
    instance_scope: object
    method: POST
    description: 管理操作（不针对单实例，类型级管理动作）

# ────────────────────────────────────────────
# 状态转换通用 action [Spec 22 FR-001 2026-09-13]
# 对象 yaml rules.action_ref 引用此处 id 作为权限码
# 与现有 assign/revoke 等命名风格一致（无 business_ 前缀）
# 后端 PUT /bo/{type}/{id} 时 ActionPermissionInterceptor 校验 action_ref 权限
# ────────────────────────────────────────────
  - id: activate
    name: 启用
    action_type: business
    instance_scope: instance
    method: PUT
    description: 启用对象（切换 status 等状态字段到 active）。通用 action，由各对象 yaml rules.action_ref 引用。

  - id: deactivate
    name: 停用
    action_type: business
    instance_scope: instance
    method: PUT
    description: 停用对象（切换状态字段到 inactive）。

  - id: lock
    name: 锁定
    action_type: business
    instance_scope: instance
    method: PUT
    description: 锁定对象（如 user.status → locked），限制登录。Salesforce Lock User 等价物。

  - id: unlock
    name: 解锁
    action_type: business
    instance_scope: instance
    method: PUT
    description: 解锁已锁定对象。

  - id: freeze
    name: 冻结
    action_type: business
    instance_scope: instance
    method: PUT
    description: 冻结对象（保留数据但禁止操作），Salesforce Freeze User 等价物。

  - id: unfreeze
    name: 解冻
    action_type: business
    instance_scope: instance
    method: PUT
    description: 解冻已冻结对象。

  - id: reset_password
    name: 重设密码
    action_type: business
    instance_scope: instance
    method: POST
    description: 重设用户密码（Salesforce Reset Passwords 等价物）。

  # [Spec 22 PM 反馈第十七次 2026-09-13] archive/restore 撤销说明:
  #   1. archive 不是真人操作，是工作流/系统服务触发，不该作为 business action
  #   2. 长期不活跃语义由 deactivate(已存在) + frozen(已存在) 覆盖
  #   3. 删除的数据恢复由 audit_log row_snapshot + restore endpoint 承担
  #   4. 矩阵「更多动作」列不应出现 archive，避免误授权
  #   5. 详见 Spec 22 §6.7 撤销原因
  # archive / restore 不再进入标准动作池