# 序列号主档（Serial Number）—— P6a 序列号对象模型
# 依据: docs/specs/p6-serial-number-model/spec.md §3.1 / §4.1 / §4.3
#
# 口径（已定，勿重复讨论）:
#   ① 独立主档而非纯库存维度（D1）：本地需按号查状态与历史。
#   ② 唯一键 (item_id, org_id, serial_no)，默认组织级（D2）。
#   ③ 状态拆三轴：usage_status / quality_status / current_location_id（D3）。
#   ④ 主档是投影，serial_transactions 是真相（D4）。
#   ⑤ 数量账不加序列号；桥接放 serial_transactions.inventory_transaction_id（D5）。
#   ⑥ 单据关系走统一 document_serial_links，不建 N 张单据子表（D6）。
#   ⑦ 单据行 serial_no 保留为 qty=1 快捷录入；qty>1 强制走子表（D7）。
#   ⑧ 状态流转只走 serial_number_service 白名单（D11）。
#
# 枚举值由迁移 v202 注册；本文件只声明 enum_values 与 value_help 引用。

id: serial_number
name: 序列号
table_name: serial_numbers
description: 序列号主档——按号识别的最小库存单位，当前状态是事件账的投影
display_name_field: serial_no
aspects: [audit_aspect]

semantics:
  meaning: 序列号
  category: core_entity
  aliases:
    - 序列号
    - 序列号主档
    - serial number
    - serial

deletion_policy:
  mode: restrict
  restrict_on:
    - table: serial_transactions
      foreign_key: serial_id
      message: 该序列号存在事件记录，禁止删除
    - table: document_serial_links
      foreign_key: serial_id
      message: 该序列号被单据引用，禁止删除
    - table: serial_numbers
      foreign_key: parent_serial_id
      message: 该序列号仍被其他序列号作为父号引用，请先处理子号
  cascade_delete: []

audit:
  enabled: true
  create:
    enabled: true
    fields: all
  update:
    enabled: true
    fields: changed_only
    exclude: [id, created_at, updated_at]
  delete:
    enabled: true
    fields: business_only
    exclude: [id, created_at, updated_at]
  associate:
    enabled: true
  dissociate:
    enabled: true

org_scope:
  mode: direct
  field: org_id
  function: inventory
  write_check: true

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true
    description: 技术主键
    semantics:
      meaning: 自增主键
      primary_key: true

  # 身份
  - id: serial_no
    name: 序列号
    type: string
    db_column: serial_no
    required: true
    max_length: 64
    description: 序列号；同一物料同一组织内唯一
    semantics:
      meaning: 序列号业务标识
      business_key: true
      data_category: code
      searchable: true
    ui:
      widget: input
      fieldGroup: 身份
      fieldGroupPosition: 10

  - id: uii
    name: 唯一物料标识
    type: string
    db_column: uii
    nullable: true
    max_length: 64
    description: 唯一物料标识（SAP UII 口径，外部合规用）；全局部分唯一
    semantics:
      meaning: 唯一物料标识
      data_category: code
      searchable: true
    ui:
      widget: input
      fieldGroup: 身份
      fieldGroupPosition: 20

  - id: revision
    name: 修订版
    type: string
    db_column: revision
    nullable: true
    max_length: 20
    description: 修订版
    semantics:
      meaning: 修订版
      data_category: code
    ui:
      widget: input
      fieldGroup: 身份
      fieldGroupPosition: 30

  # 归属
  - id: item_id
    name: 物料
    type: integer
    db_column: item_id
    required: true
    description: 序列号所属物料
    semantics:
      meaning: 物料引用
      display:
        type: association
        target_type: item
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: item
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dialog
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 物料编码
            width: 160
          - field: name
            label: 物料名称
            width: 220
    ui:
      widget: select
      relation: item
      multiple: false
      fieldGroup: 归属
      fieldGroupPosition: 40

  - id: org_id
    name: 库存组织
    type: integer
    db_column: org_id
    required: true
    description: 当前归属库存组织
    semantics:
      meaning: 库存组织引用
      display:
        type: association
        target_type: org
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: org
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{name}"
        columns:
          - field: code
            label: 组织编码
            width: 120
          - field: name
            label: 组织名称
            width: 160
    ui:
      widget: select
      relation: org
      multiple: false
      fieldGroup: 归属
      fieldGroupPosition: 50

  - id: batch_id
    name: 批次
    type: integer
    db_column: batch_id
    nullable: true
    description: 批次引用；先批后序，可空
    semantics:
      meaning: 批次引用
      display:
        type: association
        target_type: batch
        display_field: batch_no
        placeholder: "无批次"
    value_help:
      source:
        type: bo
        target_bo: batch
        value_field: id
        display_field: batch_no
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
      presentation:
        result_type: dropdown
        display_format: "{batch_no}"
        columns:
          - field: batch_no
            label: 批次号
            width: 160
    ui:
      widget: select
      relation: batch
      multiple: false
      clearable: true
      fieldGroup: 归属
      fieldGroupPosition: 60

  - id: current_location_id
    name: 当前库位
    type: integer
    db_column: current_location_id
    nullable: true
    description: 当前库位；defined / issued / shipped 时为空
    semantics:
      meaning: 当前库位引用
      display:
        type: association
        target_type: location
        display_field: name
        placeholder: "不在库"
    value_help:
      source:
        type: bo
        target_bo: location
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
      presentation:
        result_type: dropdown
        display_format: "{name}"
        columns:
          - field: code
            label: 库位编码
            width: 130
          - field: name
            label: 库位名称
            width: 160
    ui:
      widget: select
      relation: location
      multiple: false
      clearable: true
      fieldGroup: 归属
      fieldGroupPosition: 70

  # 状态
  - id: usage_status
    name: 用途状态
    type: string
    db_column: usage_status
    required: true
    default: defined
    max_length: 20
    description: 用途状态（已建档 / 在库 / 在途 / 已发出待运 / 已发运 / 已耗用 / 已退回 / 已报废）
    enum_values:
      - value: defined
        label: 已建档
        color: info
        is_initial: true
      - value: in_stores
        label: 在库
        color: success
      - value: in_transit
        label: 在途
        color: primary
      - value: issued
        label: 已发出待运
        color: warning
      - value: shipped
        label: 已发运
        color: primary
      - value: consumed
        label: 已耗用
        color: default
      - value: returned
        label: 已退回
        color: warning
      - value: scrapped
        label: 已报废
        color: danger
    value_help:
      source:
        type: enum
        enum_type_id: serial_usage_status
        sort_by: sort_order
      behavior:
        validation: true
        binding_strength: strict
        multiple: false
      presentation:
        result_type: dropdown
    semantics:
      meaning: 序列号用途状态
      filterable: true
      filter_type: enum
      filter_label: 用途状态
      filter_scope: local
    ui:
      widget: select
      fieldGroup: 状态
      fieldGroupPosition: 80

  - id: quality_status
    name: 质量状态
    type: string
    db_column: quality_status
    required: true
    default: unrestricted
    max_length: 20
    description: 质量状态；独立流转，不改变用途状态
    enum_values:
      - value: unrestricted
        label: 可用
        color: success
        is_initial: true
      - value: inspection
        label: 检验中
        color: warning
      - value: blocked
        label: 冻结
        color: danger
    value_help:
      source:
        type: enum
        enum_type_id: serial_quality_status
        sort_by: sort_order
      behavior:
        validation: true
        binding_strength: strict
        multiple: false
      presentation:
        result_type: dropdown
    semantics:
      meaning: 序列号质量状态
      filterable: true
      filter_type: enum
      filter_label: 质量状态
      filter_scope: local
    ui:
      widget: select
      fieldGroup: 状态
      fieldGroupPosition: 90

  - id: shipped_at
    name: 发运时间
    type: datetime
    db_column: shipped_at
    nullable: true
    description: 发运时间
    semantics:
      meaning: 序列号发运时间
    ui:
      widget: datetime
      fieldGroup: 状态
      fieldGroupPosition: 100

  - id: scrapped_at
    name: 报废时间
    type: datetime
    db_column: scrapped_at
    nullable: true
    description: 报废时间
    semantics:
      meaning: 序列号报废时间
    ui:
      widget: datetime
      fieldGroup: 状态
      fieldGroupPosition: 110

  # 谱系
  - id: parent_serial_id
    name: 父序列号
    type: integer
    db_column: parent_serial_id
    nullable: true
    description: 父序列号（单父）；P6a 只建字段，不做谱系服务与 UI
    semantics:
      meaning: 父序列号引用
      display:
        type: association
        target_type: serial_number
        display_field: serial_no
        placeholder: "无父号"
    ui:
      widget: select
      relation: serial_number
      multiple: false
      clearable: true
      fieldGroup: 谱系
      fieldGroupPosition: 120

  - id: relation_type
    name: 谱系关系
    type: string
    db_column: relation_type
    nullable: true
    max_length: 20
    description: 谱系关系（装配 / 包装）；P6a 不做服务与 UI
    enum_values:
      - value: assembly
        label: 装配
        color: primary
      - value: packaging
        label: 包装
        color: info
    value_help:
      source:
        type: enum
        enum_type_id: serial_relation_type
        sort_by: sort_order
      behavior:
        validation: true
        binding_strength: strict
        multiple: false
      presentation:
        result_type: dropdown
    semantics:
      meaning: 父子谱系关系
      filterable: true
      filter_type: enum
      filter_label: 谱系关系
      filter_scope: local
    ui:
      widget: select
      fieldGroup: 谱系
      fieldGroupPosition: 130

  - id: parent_item_id
    name: 父件物料
    type: integer
    db_column: parent_item_id
    nullable: true
    description: 父件物料
    semantics:
      meaning: 父件物料引用
      display:
        type: association
        target_type: item
        display_field: name
        placeholder: "无父件"
    ui:
      widget: select
      relation: item
      multiple: false
      clearable: true
      fieldGroup: 谱系
      fieldGroupPosition: 140

  # 来源
  - id: source_type
    name: 来源类型
    type: string
    db_column: source_type
    required: true
    max_length: 20
    description: 建档来源（收货 / 完工 / 期初 / 发货时建档）
    enum_values:
      - value: received
        label: 收货
        color: success
      - value: produced
        label: 完工
        color: primary
      - value: opening
        label: 期初
        color: info
      - value: issue_created
        label: 发货时建档
        color: warning
    value_help:
      source:
        type: enum
        enum_type_id: serial_source_type
        sort_by: sort_order
      behavior:
        validation: true
        binding_strength: strict
        multiple: false
      presentation:
        result_type: dropdown
    semantics:
      meaning: 序列号建档来源
      filterable: true
      filter_type: enum
      filter_label: 来源类型
      filter_scope: local
    ui:
      widget: select
      fieldGroup: 来源
      fieldGroupPosition: 150

  - id: source_doc_type
    name: 来源单据类型
    type: string
    db_column: source_doc_type
    nullable: true
    max_length: 50
    description: 来源单据类型
    semantics:
      meaning: 来源单据类型
      filterable: true
      filter_type: input
      filter_label: 来源单据类型
    ui:
      widget: input
      fieldGroup: 来源
      fieldGroupPosition: 160

  - id: source_doc_id
    name: 来源单据
    type: integer
    db_column: source_doc_id
    nullable: true
    description: 来源单据主键
    semantics:
      meaning: 来源单据引用
    ui:
      widget: number
      fieldGroup: 来源
      fieldGroupPosition: 170

  - id: received_at
    name: 收货时间
    type: datetime
    db_column: received_at
    nullable: true
    description: 收货时间
    semantics:
      meaning: 序列号收货时间
    ui:
      widget: datetime
      fieldGroup: 来源
      fieldGroupPosition: 180

  - id: produced_at
    name: 完工时间
    type: datetime
    db_column: produced_at
    nullable: true
    description: 完工时间
    semantics:
      meaning: 序列号完工时间
    ui:
      widget: datetime
      fieldGroup: 来源
      fieldGroupPosition: 190

  - id: remark
    name: 备注
    type: string
    db_column: remark
    nullable: true
    max_length: 255
    description: 备注
    semantics:
      meaning: 备注
      searchable: true
    ui:
      widget: textarea
      fieldGroup: 来源
      fieldGroupPosition: 200

  - id: created_at
    name: 创建时间
    type: datetime
    db_column: created_at
    description: 创建时间
    semantics:
      meaning: 记录创建时间
      audit_field: true

  - id: updated_at
    name: 更新时间
    type: datetime
    db_column: updated_at
    description: 更新时间
    semantics:
      meaning: 记录更新时间
      audit_field: true

# [Rule Convergence M2 FR-004 2026-11-07] usage_status 状态图唯一真源。
# 规则顺序即目标状态追加顺序，必须与旧 TRANSITIONS 的元组顺序一致；
# triggers 为空、ui_hints.hidden=true：状态变更只走 serial_number_service 白名单
# 与 serial_transactions 事件账（D4/D11），不接通用 RuleEngine。
states:
  - code: defined
    label: 已建档
    category: initial
    seq: 1
  - code: in_stores
    label: 在库
    seq: 2
  - code: in_transit
    label: 在途
    seq: 3
  - code: issued
    label: 已领用
    seq: 4
  - code: shipped
    label: 已发运
    seq: 5
  - code: consumed
    label: 已消耗
    seq: 6
  - code: returned
    label: 已退回
    seq: 7
  - code: scrapped
    label: 已报废
    category: terminal
    seq: 8

rules:
  - id: serial_to_in_stores
    name: 序列号入库
    type: state_transition
    state_field: usage_status
    from_states: [defined, returned, in_transit]
    to_state: in_stores
    enabled: false
    ui_hints:
      hidden: true

  - id: serial_to_issued
    name: 序列号领用
    type: state_transition
    state_field: usage_status
    from_states: [in_stores]
    to_state: issued
    enabled: false
    ui_hints:
      hidden: true

  - id: serial_to_in_transit
    name: 序列号发运在途
    type: state_transition
    state_field: usage_status
    from_states: [in_stores]
    to_state: in_transit
    enabled: false
    ui_hints:
      hidden: true

  - id: serial_to_shipped
    name: 序列号已发运
    type: state_transition
    state_field: usage_status
    from_states: [in_stores, issued]
    to_state: shipped
    enabled: false
    ui_hints:
      hidden: true

  - id: serial_to_consumed
    name: 序列号已消耗
    type: state_transition
    state_field: usage_status
    from_states: [issued]
    to_state: consumed
    enabled: false
    ui_hints:
      hidden: true

  - id: serial_to_returned
    name: 序列号已退回
    type: state_transition
    state_field: usage_status
    from_states: [issued]
    to_state: returned
    enabled: false
    ui_hints:
      hidden: true

  - id: serial_to_scrapped
    name: 序列号报废
    type: state_transition
    state_field: usage_status
    from_states: [defined, in_stores, in_transit, issued, shipped, consumed, returned]
    to_state: scrapped
    enabled: false
    ui_hints:
      hidden: true

indexes:
  - fields: [item_id, org_id, serial_no]
    unique: true
    name: uq_serial_number
    description: 同一物料同一组织内序列号唯一
  - fields: [uii]
    unique: true
    type: partial
    name: uq_serial_uii
    condition: "uii IS NOT NULL"
    description: 唯一物料标识全局唯一（NULL 不约束）
  - fields: [org_id, item_id]
    name: idx_serial_org_item
  - fields: [parent_serial_id]
    name: idx_serial_parent
  - fields: [usage_status]
    name: idx_serial_status

relations:
  - id: serial_number_to_item
    name: 物料
    type: reference
    target: item
    source_field: item_id
    target_field: id
    cardinality: N:1
  - id: serial_number_to_org
    name: 库存组织
    type: reference
    target: org
    source_field: org_id
    target_field: id
    cardinality: N:1
  - id: serial_number_to_batch
    name: 批次
    type: reference
    target: batch
    source_field: batch_id
    target_field: id
    cardinality: N:1
  - id: serial_number_to_location
    name: 当前库位
    type: reference
    target: location
    source_field: current_location_id
    target_field: id
    cardinality: N:1
  - id: serial_number_to_parent
    name: 父序列号
    type: reference
    target: serial_number
    source_field: parent_serial_id
    target_field: id
    cardinality: N:1
  - id: serial_number_to_parent_item
    name: 父件物料
    type: reference
    target: item
    source_field: parent_item_id
    target_field: id
    cardinality: N:1
  - id: serial_number_to_transaction
    name: 序列号事件
    type: reference
    target: serial_transaction
    source_field: id
    target_field: serial_id
    cardinality: 1:N
  - id: serial_number_to_document_link
    name: 单据序列号关系
    type: reference
    target: document_serial_link
    source_field: id
    target_field: serial_id
    cardinality: 1:N

ui_view_config:
  skip_auto_menu: true
  list:
    detail_mode: drawer
    title: 序列号
    columns:
      - field: serial_no
        width: 180
        sortable: true
      - field: item_id
        width: 190
        filterable: true
        filter_type: value_help
        render_as: association
        target_type: item
        display_field: name
      - field: org_id
        width: 160
        filterable: true
        filter_type: value_help
        render_as: association
        target_type: org
        display_field: name
      - field: batch_id
        width: 140
        render_as: association
        target_type: batch
        display_field: batch_no
      - field: usage_status
        width: 120
        filterable: true
        filter_type: select
      - field: quality_status
        width: 110
        filterable: true
        filter_type: select
      - field: current_location_id
        width: 150
        render_as: association
        target_type: location
        display_field: name
    selection:
      enabled: true
      mode: multiple
    searchFields: [serial_no, uii, revision, remark]
    actions:
      - id: create
        label: 新建序列号
        icon: plus
        type: primary
        permission: serial_number:serial_number_create
    defaultSort:
      field: serial_no
      order: asc
  form:
    title: 序列号
    layout: vertical
    sections:
      - title: 身份
        columns:
          - fields: [serial_no, uii, revision]
      - title: 归属
        columns:
          - fields: [item_id, org_id]
          - fields: [batch_id, current_location_id]
      - title: 状态
        columns:
          - fields: [usage_status, quality_status]
          - fields: [shipped_at, scrapped_at]
      - title: 谱系
        columns:
          - fields: [parent_serial_id, relation_type, parent_item_id]
      - title: 来源
        columns:
          - fields: [source_type, source_doc_type, source_doc_id]
          - fields: [received_at, produced_at]
          - fields: [remark]
  detail:
    layout: tabs
    title: "序列号 {record.serial_no}"
    tabs:
      - id: basic
        label: 基本信息
        type: fields
        fields: [serial_no, uii, revision, item_id, org_id, batch_id,
                 current_location_id, usage_status, quality_status,
                 shipped_at, scrapped_at]
      - id: lineage
        label: 谱系
        type: fields
        fields: [parent_serial_id, relation_type, parent_item_id]
      - id: source
        label: 来源
        type: fields
        fields: [source_type, source_doc_type, source_doc_id, received_at,
                 produced_at, remark]

category_config:
