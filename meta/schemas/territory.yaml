# 销售区域（Territory）—— 责任田树
# 依据: docs/superpowers/specs/2026-10-26-sales-territory-design.md
#       §2 组织不可覆盖 / §3 命名 / §4 对象模型 / §5 不变量
#
# 定位: 销售侧的责任划分，按 parent_id 自引用成树。销售员与客户分别通过
#   salesperson_territory_assignment / territory_account_assignment 归属到区域；
#   订单抬头持有 territory_id 快照，供数据范围与汇总消费。
#
# 口径:
#   ① code 全局唯一，是外部系统对接与展示的稳定键。
#   ② parent_id 是自引用真外键；成环由服务层递归校验（R-TER-1），
#      直连自引用同时由 value_help.exclude_self 拦截。
#   ③ 停用区域不影响既有分配，但不再被新的分配引用（R-TER-3 / R-TER-6）。
#   ④ level 由服务层按父链自动派生（R-TER-4），前端不提供手工编辑；
#      父节点变更时服务层级联重算整棵子树。
#   ⑤ 本对象不是行政区划（region）：划分依据可以是地理、行业、客户群或渠道。

id: territory
name: 销售区域
table_name: territories
description: 销售区域树——按 parent_id 自引用分层，表达客户与订单的责任归属
display_name_field: name
aspects: [audit_aspect]

semantics:
  meaning: 销售区域
  category: core_entity
  aliases:
    - 区域
    - 销售辖区
    - 辖区
    - 片区
    - territory
    - sales territory

deletion_policy:
  # 主数据禁止物理删除；有子区域或被销售员分配引用时拒绝
  mode: restrict
  restrict_on:
    - table: territories
      foreign_key: parent_id
      message: 该区域下仍有子区域，请先处理子区域后再删除
    - table: salesperson_territory_assignments
      foreign_key: territory_id
      message: 该区域仍被销售员区域分配引用，请先解除分配后再删除
    # [TER-M2 2026-10-26] 客户侧分配同样阻塞区域删除
    - table: territory_account_assignments
      foreign_key: territory_id
      message: 该区域仍被客户区域分配引用，请先解除分配后再删除
  cascade_delete: []

audit:
  enabled: true
  create:
    enabled: true
    fields: all
  update:
    enabled: true
    fields: changed_only
    exclude: [id, created_at, updated_at]
  delete:
    enabled: true
    fields: business_only
    exclude: [id, created_at, updated_at]
  associate:
    enabled: true
  dissociate:
    enabled: true

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true
    description: 技术主键
    semantics:
      meaning: 自增主键
      primary_key: true

  - id: code
    name: 区域编码
    type: string
    db_column: code
    required: true
    unique: true
    max_length: 32
    description: 区域编码（全局唯一）
    semantics:
      meaning: 区域业务代码
      business_key: true
      data_category: code
      searchable: true
    ui:
      widget: input

  - id: name
    name: 区域名称
    type: string
    db_column: name
    required: true
    max_length: 128
    description: 区域名称
    semantics:
      meaning: 区域显示名称
      display_name: true
      searchable: true
      data_category: text
    ui:
      widget: input

  - id: parent_id
    name: 上级区域
    type: integer
    db_column: parent_id
    nullable: true
    description: 上级区域ID，支持层级结构
    semantics:
      meaning: 上级区域引用
      parent_key: true
      hierarchy_field: parent
      hierarchy_level:
        relation: self_reference
        max_depth: 10
      display:
        type: association
        target_type: territory
        display_field: name
        placeholder: "无上级"
    value_help:
      source:
        type: bo
        target_bo: territory
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        hierarchy:
          enabled: true
          parent_field: parent_id
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        exclude_self: true
      presentation:
        result_type: dialog
        display_mode: tree
        display_format: "{name}"
        columns:
          - field: code
            label: 编码
            width: 140
          - field: name
            label: 名称
            width: 220
    ui:
      widget: select
      relation: territory
      multiple: false
      clearable: true

  - id: level
    name: 层级
    type: integer
    db_column: level
    nullable: true
    description: 区域在树中的层级（根为 1）；由服务层按父链自动派生，父节点变更时级联重算子树
    semantics:
      meaning: 区域层级序号
      filterable: true
      filter_type: number
      filter_label: 层级
      filter_scope: local
    ui:
      widget: number
      editable: false
      readonly: true

  # 归属销售组织（真外键 → orgs；候选取具备销售职能的组织）
  - id: owner_org_id
    name: 归属组织
    type: integer
    db_column: owner_org_id
    nullable: true
    description: 归属销售组织；空表示不限定组织
    semantics:
      meaning: 区域归属的销售组织
      display:
        type: association
        target_type: org
        display_field: name
        placeholder: "不限组织"
    value_help:
      source:
        type: bo
        target_bo: org_sales_org
        display_target_bo: org
        detail_target_bo: org
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        value_filter:
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 组织编码
            width: 140
          - field: name
            label: 组织名称
            width: 220
    ui:
      widget: select
      relation: org
      multiple: false
      clearable: true

  # 划分依据：说明这块责任田按什么切分；仅作说明与展示，不参与归属判定
  - id: territory_type
    name: 划分依据
    type: string
    db_column: territory_type
    required: true
    default: geographic
    description: 区域划分依据（地理/行业/客户群/渠道），仅用于说明与展示
    enum_values:
      - value: geographic
        label: 地理
        color: primary
        is_initial: true
      - value: industry
        label: 行业
        color: success
      - value: account
        label: 客户群
        color: warning
      - value: channel
        label: 渠道
        color: info
    semantics:
      meaning: 区域划分依据
      filterable: true
      filter_type: enum
      filter_label: 划分依据
      filter_scope: local
    ui:
      widget: select

  - id: status
    name: 状态
    type: string
    db_column: status
    required: true
    default: active
    description: 启用状态（停用后不再被新的销售员分配或客户分配引用，R-TER-3 / R-TER-6）
    enum_values:
      - value: active
        label: 启用
        color: success
        category: active
        is_initial: true
      - value: inactive
        label: 停用
        color: info
        category: inactive
    semantics:
      meaning: 区域启用状态
      filterable: true
      filter_type: enum
      filter_label: 状态
      filter_scope: local
    ui:
      widget: select

  - id: description
    name: 描述
    type: text
    db_column: description
    nullable: true
    max_length: 255
    description: 说明
    semantics:
      meaning: 区域说明
      searchable: true
    ui:
      widget: textarea

  - id: created_at
    name: 创建时间
    type: datetime
    db_column: created_at
    description: 创建时间
    semantics:
      meaning: 记录创建时间
      audit_field: true

  - id: updated_at
    name: 更新时间
    type: datetime
    db_column: updated_at
    description: 更新时间
    semantics:
      meaning: 记录更新时间
      audit_field: true

rules:
  - id: deactivate_territory
    name: 停用区域
    type: state_transition
    action_ref: deactivate
    state_field: status
    from_states: [active]
    to_state: inactive
    triggers: [before_update]
    ui_hints:
      label: 停用
      icon: pause_circle
      confirm_message: "停用后该区域将不再被新的销售员分配引用，确定继续吗？"

  - id: activate_territory
    name: 启用区域
    type: state_transition
    action_ref: activate
    state_field: status
    from_states: [inactive]
    to_state: active
    triggers: [before_update]
    ui_hints:
      label: 启用
      icon: play_circle
      confirm_message: "确定要启用此区域吗？"

indexes:
  - fields: [code]
    unique: true
    name: uq_territory_code
  - fields: [parent_id]
    name: idx_territory_parent
  - fields: [owner_org_id]
    name: idx_territory_owner_org
  - fields: [status]
    name: idx_territory_status

relations:
  - id: territory_to_parent
    name: 上级区域
    type: reference
    target: territory
    source_field: parent_id
    target_field: id
    cardinality: N:1
    description: 上级区域引用（自引用树；真外键，restrict）
  - id: territory_to_owner_org
    name: 归属组织
    type: reference
    target: org
    source_field: owner_org_id
    target_field: id
    cardinality: N:1
    description: 归属销售组织引用（可空；真外键）

ui_view_config:
  # 菜单由迁移 v132 手工声明（挂 master-data），不让自动生成器产出孤儿行
  skip_auto_menu: true
  showChangeHistory: true

  # [TER-M4 2026-10-26] 左树右表：树 = 销售区域层级（自引用），右表 = 区域列表
  #   勾选节点 → 右表 id__in = 勾选 ∪ 全部子孙（HierarchyScopeTree 已算好 effective）；
  #   未勾选 = 不过滤（看全部），与组织管理页同口径（设计 §8 / D-TER-7）。
  hub:
    object_types: [territory]
    default_tab: territory
    tabs:
      territory: 销售区域
    state_key: territoryManagerState
    scope:
      type: hierarchy
      object: territory
      scope_key: territory
      parent_field: parent_id
      node_icon: folder
      empty_text: 暂无销售区域数据
      search_placeholder: 搜索销售区域（编码/名称）
    filters:
      territory:
        field: id

  list:
    detail_mode: drawer
    title: 销售区域
    description: 销售区域树：编码、名称、划分依据与上级区域
    columns:
      - field: code
        width: 140
        sortable: true
      - field: name
        width: 220
        sortable: true
      - field: territory_type
        width: 100
        filterable: true
        filter_type: select
      - field: parent_id
        width: 180
        filterable: true
        filter_type: value_help
        render_as: association
        target_type: territory
        display_field: name
        placeholder: "无上级"
      - field: owner_org_id
        width: 180
        filterable: true
        filter_type: value_help
        render_as: association
        target_type: org
        display_field: name
        placeholder: "不限组织"
      - field: level
        width: 90
        sortable: true
      - field: status
        width: 90
        filterable: true
        filter_type: select
      - field: description
        width: 240
        type: ellipsis
      - field: updated_at
        width: 160
        format: datetime
    selection:
      enabled: true
      mode: multiple
    searchFields:
      - code
      - name
    actions:
      - id: create
        label: 新建区域
        icon: plus
        type: primary
        permission: territory:territory_create
    defaultSort:
      field: code
      order: asc

  form:
    title: 销售区域
    layout: vertical
    sections:
      - title: 基本信息
        columns:
          - fields: [code, name]
          - fields: [parent_id, territory_type]
          - fields: [owner_org_id]
          - fields: [status]
      - title: 其他
        columns:
          - fields: [description]
      # level 由服务层派生（R-TER-4），不进入录入表单

  detail:
    layout: tabs
    title: "{record.name} 详情"
    tabs:
      - id: basic
        label: 基本信息
        type: fields
        fields: [code, name, parent_id, level, territory_type, owner_org_id, status, description]

category_config:
  # 双段式权限码，与 permissions 表实际行一致（v132 落库）
  create_permission: territory:territory_create
  update_permission: territory:territory_update
  delete_permission: territory:territory_delete
  owner_auto_permission: false
