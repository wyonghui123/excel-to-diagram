# ============================================
# 权限集数据权限元模型
# 说明: 权限集级别的数据访问权限配置 (Spec 16: role_data_permission → permission_set_data_permission)
# ============================================

id: permission_set_data_permission
name: 权限集数据权限
table_name: permission_set_data_permissions
description: 权限集级别的数据访问权限配置，控制权限集可访问的资源实例范围

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true

  - id: permission_set_id
    name: 权限集ID
    type: integer
    required: true
    description: 关联的权限集ID

  - id: resource_type
    name: 资源类型
    type: string
    required: true
    description: 资源类型

  - id: resource_id
    name: 资源ID
    type: integer
    required: true
    description: 资源实例ID

  - id: permission_level
    name: 权限级别
    type: string
    default: read
    description: 权限级别

  - id: inherit_to_children
    name: 继承至子级
    type: integer
    default: 1
    description: 是否继承至子资源

  - id: created_at
    name: 创建时间
    type: timestamp
    description: 创建时间

  - id: created_by
    name: 创建人
    type: integer
    description: 创建人ID

category_config:
  category: system
  sub_category: permission
  icon: "shield"
  color: "#ef4444"

