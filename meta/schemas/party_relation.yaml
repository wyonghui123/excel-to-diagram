# ============================================
# 客户 / 供应商关系实例（party_relation）— foundation 步 3 · 角色层
# 依据: F2 命名与识别号（§9 D4/D5 → §10 拍板）；蓝图 v2.5（§3.3 结构草案 / §4.3 键 / §8.2）
#
# [F2 §10 D4] 命名三面：界面词「客户关系 / 供应商关系」｜技术标识 party_relation｜物理表 party_relations
#   单表 + role（customer｜vendor）；一实例一角色，双角色 = 两条记录（SAP 多角色）。
#   禁忌词（D7）: 不得用 relationship（meta 关系 BO 已占用）/ role·roles（权限占位）/ product（现有语义）。
#
# [F2 §10 D6] 关系实例**不建**独立识别号：业务键即唯一（薄关系，非对外主数据）⇒ 无 code / 无 key_template。
#
# [F2 §10 D5] 唯一键 = 四元组 (party1_id, party2_id, role, le_org_id) 部分唯一索引；
#   le_org_id（法人，I4-A）非空参与唯一；internal_mark 不入键（是标记非判定，I3-A）。
#
# [J8 延期项 · 2026-10-05 定] 蓝图 §3.3 L268 / L577 / §4.3 L630 另述「域内至多 1 条内部关系实例」（J8）
#   —— 本批不加该索引。原因: I1=C 已拍（一期只预留表示层结构、不建内部关系实例），
#      internal_mark='internal' 无数据 ⇒ 两种口径在空集上行为一致；新增约束无收益，
#      且会把未经复核的唯一性轴烧进 DDL（一个错的唯一索引比没有更糟）。
#   触发条件: 当 I1 由 C（只预留结构）变为 A/B（实际建内部关系实例）时，必须同批落地 J8 专用部分唯一索引。
#   推荐列集（Fusion 口径，贴合 J8「防重复建档」本意）:
#       UNIQUE(party2_id, role, le_org_id) WHERE internal_mark = 'internal'
#   否决字面口径 UNIQUE(le_org_id) WHERE internal_mark = 'internal'（域内全局仅 1 条，与多子公司现实冲突）。
#   [改名 2026-10-05] 原字段名 domain → le_org_id：避免与平台既有 domain 维度（功能域，
#     dimension_object_mapping.yaml 的 dimension_code: domain）同名异义。
#
# [登记] meta/schemas/.schema_version.json 未在本批改动（该文件由在飞 item 批次持有未提交 diff）；
#   party_relation 作为新对象，将由 sync_schema 下次运行时自动登记（new_objects）。
#
# [party_group 2026-10-07] 分类挂载点 = 关系层：group_id → party_groups（N:1 真外键，可空）。
#   硬约束: 单列单 FK 目标（不拆客户组/供应商组两列）——统一分组 + 组侧 role_scope 标注适用性；
#   挂关系层（而非账户层/party 层）: 账户层只覆盖客户侧，party 层管不了角色差异（详见 party_group.yaml 头注）。
#
# [生命周期 2026-10-07] 补 status + activate/deactivate（蓝图 §5.4 最小约定 + D4 瞬时开关）
#   口径: status 为 required + default active（瞬时开关，不加生效日列，D4）;
#         粒度 = 关系行本身（唯一键含 le_org_id 法人域）⇒「对手在法人 A 停用、法人 B 继续交易」
#         由不同行分别表达（对标 SAP KNB1/KNVV 公司代码层冻结）;
#         停用 = 该法人范围内冻结/复通（只补关系层，账户层 customer_account 不重复建 status）;
#         历史单据读单据自身快照（S20）不依赖停用语义 ⇒ 停用不破坏历史;
#         只取 activate / deactivate 两动作——不取 freeze/unfreeze（同动作池的 freeze 预留他域）。
# ============================================

id: party_relation
name: 身份关系
table_name: party_relations
description: 客户 / 供应商关系实例（party₁ 我方 — party₂ 对手；单表 + role，一实例一角色）

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true
    description: 技术主键
    semantics:
      meaning: 自增主键
      primary_key: true

  # ── 两侧统一 party 引用（蓝图 §3.3：均为 party 引用，不落 org 轴）──
  # [FK 目标修正 2026-10-17] 我方侧指向 party 基表（身份锚），不再指向 party_internal 视图。
  #   起因（用户手机端实测报障「对方列显示 8 而不是名称」）：party_relation 存的是
  #     parties.id 外键，但显示名解析走 enrichment_engine.enrich_fk_display_names ——
  #     它按 value_help.source.target_bo 取 table_name 后直查该表（enrichment_engine.py:489-499）。
  #     原 target_bo=party_internal ⇒ 直查 party_internal 视图（谓词 source='org'），
  #     而库内不存在任何 source='org' 的 party 行（写入侧无 org→party 联动机制，
  #     idx_party_org_unique 只是 DDL 约束、无满足它的代码路径）⇒ 视图恒 0 行 ⇒
  #     party1_id_display 恒 null ⇒ 前端只能回退显示原始 id。
  #   改指基表的理由：archive/internal 是**列表呈现口径**（谁能看见哪些行），
  #     不是外键的解析目标；外键指向的是 parties.id，显示名应向身份锚取。
  #   遗留（不在本批）：「我方侧恒为内部组织表示」这一原始约束因此放宽为「我方侧是某个 party」，
  #     候选集不再收窄到内部面。待 org→party 联动机制落地后再收回（届时 target_bo 改回
  #     party_internal，并同步 semantics.display / ui.relation / 列表列 target_type）。
  - id: party1_id
    name: 我方侧
    type: integer
    db_column: party1_id
    required: true
    description: 我方侧的 party 引用（B′：我方 org 的 organization 面，恒为内部组织表示）
    semantics:
      meaning: 关系我方侧身份（party 引用）
      display:
        type: association
        target_type: party
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: party
        value_field: id
        display_field: name
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{name}"
        columns:
          - field: name
            label: 显示名
            width: 200
          - field: party_type
            label: 身份类型
            width: 120
    ui:
      widget: select
      relation: party
      multiple: false

  - id: party2_id
    name: 对手侧
    type: integer
    db_column: party2_id
    required: true
    description: 对手侧的 party 引用（对外伙伴走 party_archive；内部交易对手由 intra_trade 受控路径，F1 §6）
    semantics:
      meaning: 关系对手侧身份（party 引用）
      display:
        type: association
        target_type: party_archive
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: party_archive
        value_field: id
        display_field: name
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{name}"
        columns:
          - field: name
            label: 显示名
            width: 200
          - field: party_type
            label: 身份类型
            width: 120
    ui:
      widget: select
      relation: party_archive
      multiple: false

  # ── 角色（一实例一角色；界面词「客户关系 / 供应商关系」按此呈现）──
  - id: role
    name: 角色
    type: string
    db_column: role
    required: true
    max_length: 30
    description: 关系角色（customer 客户 / vendor 供应商）；一实例一角色，双角色 = 两条记录
    enum_values:
      - value: customer
        label: 客户
        color: primary
      - value: vendor
        label: 供应商
        color: success
    semantics:
      meaning: 角色层角色分类（仅作枚举值，不作 BO / 表名，D7）
    ui:
      widget: select

  # ── 内｜外标记（I3-A 已拍：标记落关系实例层；≠ 判定，判定归 org / 法人关系 J1/J7）──
  - id: internal_mark
    name: 内外标记
    type: string
    db_column: internal_mark
    required: true
    max_length: 30
    description: 内｜外标记（internal 内部 / external 外部）；标记非判定，且不入唯一键（D5）；不设默认以免内部行被静默标为 external
    enum_values:
      - value: internal
        label: 内部
        color: info
      - value: external
        label: 外部
        color: default
    semantics:
      meaning: 关系的内外标记（标记非判定；判定归 org / 法人关系）
    ui:
      widget: select

  # ── 法人域（条款挂点；粒度 = 法人，I4-A 已拍；命名避与平台 domain 维度同名）──
  - id: le_org_id
    name: 法人域
    type: integer
    db_column: le_org_id
    nullable: true
    description: 域（商务条款 / 角色数据生效层）；粒度 = 法人（I4-A），指向具备 legal_entity 职能的 org；非空参与唯一键
    semantics:
      meaning: 商务条款 / 角色数据生效的域（法人粒度）
      display:
        type: association
        target_type: org
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: org
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
      presentation:
        result_type: dropdown
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 编码
            width: 120
          - field: name
            label: 名称
            width: 200
    ui:
      widget: select
      relation: org
      multiple: false

  # ── 往来单位组（分类挂载点，可空；[FK 2026-10-07] 真外键）──
  - id: group_id
    name: 往来单位组
    type: integer
    db_column: group_id
    nullable: true
    description: 所属往来单位组（分类；组侧 role_scope 标注客户/供应商/通用适用范围）
    semantics:
      meaning: 往来单位组引用（分类标签）
      display:
        type: association
        target_type: party_group
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: party_group
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        hierarchy:
          enabled: true
          parent_field: parent_id
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
      presentation:
        result_type: dialog
        display_mode: tree
        display_format: "{name}"
        columns:
          - field: code
            label: 编码
            width: 140
          - field: name
            label: 名称
            width: 220
          - field: role_scope
            label: 适用范围
            width: 100
    ui:
      widget: select
      relation: party_group
      multiple: false
      clearable: true

  # ── 生命周期状态（[生命周期 2026-10-07] 只补关系层；停用粒度=该法人范围冻结/复通）──
  - id: status
    name: 状态
    type: string
    db_column: status
    required: true
    default: active
    description: 关系状态 active/inactive（生命周期约定 §5.4；停用=该法人范围内冻结，D4 不加生效日列）
    enum_values:
      - value: active
        label: 启用
        color: success
        category: active
        is_initial: true
        description: 启用，该法人范围内可建立新单据
      - value: inactive
        label: 停用
        color: info
        category: inactive
        description: 停用，该法人范围内冻结与新单据建立；其他法人行与历史单据不受影响
    semantics:
      meaning: 关系启用状态（法人域粒度：停用只冻结本行所在法人范围）
      filterable: true
      filter_type: enum
      filter_label: 状态
      filter_scope: local
    ui:
      widget: select

indexes:
  # [F2 §10 D5] 四元组部分唯一索引：le_org_id 非空参与唯一（未填 le_org_id 的行不入键）
  - fields: [party1_id, party2_id, role, le_org_id]
    unique: true
    type: partial
    condition: "le_org_id IS NOT NULL"
    name: idx_party_relation_unique
  - fields: [party1_id]
    name: idx_party_relation_party1
  - fields: [party2_id]
    name: idx_party_relation_party2
  - fields: [le_org_id]
    name: idx_party_relation_le_org_id
  - fields: [group_id]
    name: idx_party_relation_group_id
  # [生命周期 2026-10-07] 状态筛选索引（消费方按状态过滤：停用行不进入新单据候选）
  - fields: [status]
    name: idx_party_relation_status

relations:
  - id: party_relation_to_party1
    name: 我方侧
    type: reference
    target: party
    source_field: party1_id
    target_field: id
    cardinality: N:1
    description: 我方侧身份引用（[FK 2026-10-07] 由展示语义升级为真外键；展示面走 party_internal 视图，物理列存 parties.id，故 FK 指向真表 parties）
  - id: party_relation_to_party2
    name: 对手侧
    type: reference
    target: party
    source_field: party2_id
    target_field: id
    cardinality: N:1
    description: 对手侧身份引用（[FK 2026-10-07] 由展示语义升级为真外键；展示面走 party_archive 视图，物理列存 parties.id，故 FK 指向真表 parties）
  - id: party_relation_to_le_org
    name: 法人域
    type: reference
    target: org
    source_field: le_org_id
    target_field: id
    cardinality: N:1
    description: 法人域引用（[FK 2026-10-07] 由展示语义升级为真外键；指向具备 legal_entity 职能的 org，"职能"属性由 org_function_service 校验，非 FK 职责）
  - id: party_relation_to_party_group
    name: 往来单位组
    type: reference
    target: party_group
    source_field: group_id
    target_field: id
    cardinality: "N:1"
    description: 往来单位组引用（[FK 2026-10-07] 真外键，可空=未归类；加引号防御 YAML 1.1 六十进制解析）

# 生命周期: 复用平台标准动作（蓝图 §5.4 最小约定 / D4 瞬时开关）
#   inactive --activate--> active
#   active   --deactivate--> inactive
#   粒度 = 关系行（含 le_org_id 法人域）：同一对手在不同法人各行独立启停（对标 SAP KNB1/KNVV）
#   仅两态两动作：不取 freeze/unfreeze（freeze 语义预留他域）
rules:
  - id: activate_party_relation
    name: 启用关系
    type: state_transition
    action_ref: activate
    state_field: status
    from_states: [inactive]
    to_state: active
    triggers: [before_update]
    ui_hints:
      label: 启用
      icon: check_circle
      confirm_message: "确定要启用此关系吗？启用后该法人范围内可继续建立新单据。"
      highlight: true

  - id: deactivate_party_relation
    name: 停用关系
    type: state_transition
    action_ref: deactivate
    state_field: status
    from_states: [active]
    to_state: inactive
    triggers: [before_update]
    ui_hints:
      label: 停用
      icon: pause_circle
      confirm_message: "确定要停用此关系吗？停用后该法人范围内冻结与新单据建立；其他法人行与历史单据不受影响。"

ui_view_config:
  skip_auto_menu: true
  # 列表列（[列表列 2026-10-17] 补回数据列）
  #   背景：本文件此前只写 skip_auto_menu，未声明 list.columns；前端 useMetaList
  #     只认 listConfig.tableColumns || listConfig.columns（缺则告警并留空、不回退字段自动生成），
  #     故「往来单位关系」tab 只渲染勾选框列、无数据列。口径同 party_archive 的补列处理。
  #   本对象无 name / code（F2 §10 D6：薄关系不建独立识别号、无 display_name_field）
  #     ⇒ 起始列取「对手侧」作为主体列，其余按语义顺序排列。
  #   FK 列沿用 party_group.yaml 的 association 写法（render_as: association + target_type +
  #     display_field），目标面按字段自身的展示语义取：party1_id → party（身份锚，见字段头
  #     [FK 目标修正] 说明）、party2_id → party_archive、le_org_id → org、group_id → party_group。
  #   只补列，不动 selection/actions（MOMP 工具条由页面通用层提供）。
  list:
    detail_mode: drawer
    title: 往来单位关系
    columns:
      - field: party2_id
        width: 220
        filterable: true
        filter_type: value_help
        render_as: association
        target_type: party_archive
        display_field: name
      - field: role
        width: 90
        filterable: true
        filter_type: enum
        render_as: tag
      - field: party1_id
        width: 220
        filterable: true
        filter_type: value_help
        render_as: association
        target_type: party
        display_field: name
      - field: internal_mark
        width: 100
        filterable: true
        filter_type: enum
        render_as: tag
      - field: le_org_id
        width: 160
        filterable: true
        filter_type: value_help
        render_as: association
        target_type: org
        display_field: name
      - field: group_id
        width: 180
        filterable: true
        filter_type: value_help
        render_as: association
        target_type: party_group
        display_field: name
      - field: status
        width: 90
        filterable: true
        filter_type: select
        render_as: tag
    # [列表动作 2026-10-17] 补 actions —— 与 party_archive 同一缺陷的顺延修复。
    #   起因：本表原先只补了 columns 没补 actions ⇒ useMetaList 走兜底 ⇒ 按钮文案只有裸
    #     「新建」，而同页另两个 tab 是「新建往来单位」/「新建往来单位组」，三个 tab 文案不齐。
    #   文案取「新建往来关系」而非「新建往来单位关系」：SAP Fiori UI Text Guidelines 要求
    #     "starting with a verb, keep them as short as possible"，本表对应 tab 标签已是
    #     「往来单位关系」，按钮再重复「单位」属冗余；实测 390px 窄屏下 6 字（96px）
    #     按钮组需 96+8+48+8+48+8+69=285px ≤ 容器 310px，可与其它 tab 一样单行放下。
    #   permission 用双段式（permissions 表实有 party_relation:party_relation_create）；
    #     单段式在该表命中数为 0，写单段式会导致非 admin 看不到按钮。详见 party_archive.yaml 同段注释。
    actions:
      - id: create
        label: 新建往来关系
        icon: plus
        type: primary
        permission: party_relation:party_relation_create
      - id: export
        label: 导出
        icon: download
        type: default
  # [表单/详情 2026-10-17] 补 form + detail（本文件此前只有 list）
  #   报障：手机端点「新建往来关系」，抽屉里除了标题栏的「启用/保存/取消」外一片空白，
  #     一个字段都没有 ⇒ 新建/编辑无从下手。
  #   根因同 party_archive 编辑态空白：DetailPage 编辑态走 ui_view_config.form.sections
  #     （只读态才走 detail.facets 的 fieldGroup）。本文件既没写 form 也没写 detail，
  #     后端 UIConfigBuilder 的兜底推导只收 ui.editable 字段 —— 本表字段未声明 editable
  #     ⇒ 兜底结果同样是空 sections，接口实测确认 `form.sections = `（空）。
  #   分组依据（业务语义，非字母序）：两侧 party 先立住（谁对我方、谁是对手、什么角色），
  #     再是内外标记与归属（法人域 / 往来单位组），最后生命周期状态。
  #   layout: vertical —— 窄屏单列；party1_id/party2_id 都是 value_help 下拉，
  #     两列并排会把两个长下拉挤到放不下 placeholder 的宽度，故两侧各自独占一行。
  form:
    title: 往来关系信息
    layout: vertical
    sections:
      - title: 关系双方
        columns:
          - fields: [party1_id]
          - fields: [party2_id]
          - fields: [role]
      - title: 归属与状态
        columns:
          - fields: [internal_mark]
          - fields: [le_org_id]
          - fields: [group_id]
          - fields: [status]
  detail:
    facets:
      - title: 关系双方
        type: fieldGroup
        fields:
          - party1_id
