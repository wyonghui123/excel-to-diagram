# ============================================
# 客户 / 供应商关系实例（party_relation）— foundation 步 3 · 角色层
# 依据: F2 命名与识别号（§9 D4/D5 → §10 拍板）；蓝图 v2.5（§3.3 结构草案 / §4.3 键 / §8.2）
#
# [F2 §10 D4] 命名三面：界面词「客户关系 / 供应商关系」｜技术标识 party_relation｜物理表 party_relations
#   单表 + role（customer｜vendor）；一实例一角色，双角色 = 两条记录（SAP 多角色）。
#   禁忌词（D7）: 不得用 relationship（meta 关系 BO 已占用）/ role·roles（权限占位）/ product（现有语义）。
#
# [F2 §10 D6] 关系实例**不建**独立识别号：业务键即唯一（薄关系，非对外主数据）⇒ 无 code / 无 key_template。
#
# [F2 §10 D5] 唯一键 = 四元组 (party1_id, party2_id, role, domain) 部分唯一索引；
#   domain（法人，I4-A）非空参与唯一；internal_mark 不入键（是标记非判定，I3-A）。
#   注: 蓝图 §3.3 L267 / §4.3 J8 另述「域内至多 1 条**内部**关系实例」——若需按 internal 单独约束，
#       可另加内部专用部分唯一索引；本批先落 D5 字面口径（domain 非空参与唯一），差异留待 PM 复核。
#
# [登记] meta/schemas/.schema_version.json 未在本批改动（该文件由在飞 item 批次持有未提交 diff）；
#   party_relation 作为新对象，将由 sync_schema 下次运行时自动登记（new_objects）。
# ============================================

id: party_relation
name: 身份关系
table_name: party_relations
description: 客户 / 供应商关系实例（party₁ 我方 — party₂ 对手；单表 + role，一实例一角色）

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true
    description: 技术主键
    semantics:
      meaning: 自增主键
      primary_key: true

  # ── 两侧统一 party 引用（蓝图 §3.3：均为 party 引用，不落 org 轴）──
  - id: party1_id
    name: 我方侧
    type: integer
    db_column: party1_id
    required: true
    description: 我方侧的 party 引用（B′：我方 org 的 organization 面，恒为内部组织表示）
    semantics:
      meaning: 关系我方侧身份（party 引用）
      display:
        type: association
        target_type: party_internal
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: party_internal
        value_field: id
        display_field: name
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{name}"
        columns:
          - field: name
            label: 显示名
            width: 200
          - field: party_type
            label: 身份类型
            width: 120
    ui:
      widget: select
      relation: party_internal
      multiple: false

  - id: party2_id
    name: 对手侧
    type: integer
    db_column: party2_id
    required: true
    description: 对手侧的 party 引用（对外伙伴走 party_archive；内部交易对手由 intra_trade 受控路径，F1 §6）
    semantics:
      meaning: 关系对手侧身份（party 引用）
      display:
        type: association
        target_type: party_archive
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: party_archive
        value_field: id
        display_field: name
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{name}"
        columns:
          - field: name
            label: 显示名
            width: 200
          - field: party_type
            label: 身份类型
            width: 120
    ui:
      widget: select
      relation: party_archive
      multiple: false

  # ── 角色（一实例一角色；界面词「客户关系 / 供应商关系」按此呈现）──
  - id: role
    name: 角色
    type: string
    db_column: role
    required: true
    max_length: 30
    description: 关系角色（customer 客户 / vendor 供应商）；一实例一角色，双角色 = 两条记录
    enum_values:
      - value: customer
        label: 客户
        color: primary
      - value: vendor
        label: 供应商
        color: success
    semantics:
      meaning: 角色层角色分类（仅作枚举值，不作 BO / 表名，D7）
    ui:
      widget: select

  # ── 内｜外标记（I3-A 已拍：标记落关系实例层；≠ 判定，判定归 org / 法人关系 J1/J7）──
  - id: internal_mark
    name: 内外标记
    type: string
    db_column: internal_mark
    required: true
    max_length: 30
    description: 内｜外标记（internal 内部 / external 外部）；标记非判定，且不入唯一键（D5）；不设默认以免内部行被静默标为 external
    enum_values:
      - value: internal
        label: 内部
        color: info
      - value: external
        label: 外部
        color: default
    semantics:
      meaning: 关系的内外标记（标记非判定；判定归 org / 法人关系）
    ui:
      widget: select

  # ── 域（条款挂点；粒度 = 法人，I4-A 已拍）──
  - id: domain
    name: 域
    type: integer
    db_column: domain
    nullable: true
    description: 域（商务条款 / 角色数据生效层）；粒度 = 法人（I4-A），指向具备 legal_entity 职能的 org；非空参与唯一键
    semantics:
      meaning: 商务条款 / 角色数据生效的域（法人粒度）
      display:
        type: association
        target_type: org
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: org
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
      presentation:
        result_type: dropdown
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 编码
            width: 120
          - field: name
            label: 名称
            width: 200
    ui:
      widget: select
      relation: org
      multiple: false

indexes:
  # [F2 §10 D5] 四元组部分唯一索引：domain 非空参与唯一（未填 domain 的行不入键）
  - fields: [party1_id, party2_id, role, domain]
    unique: true
    type: partial
    condition: "domain IS NOT NULL"
    name: idx_party_relation_unique
  - fields: [party1_id]
    name: idx_party_relation_party1
  - fields: [party2_id]
    name: idx_party_relation_party2
  - fields: [domain]
    name: idx_party_relation_domain

relations: []

ui_view_config:
  skip_auto_menu: true