# 批次主数据（Batch）—— 流程制造 P4c
# 依据: docs/specs/spec-routing-process-manufacturing-benchmark-2026-11-01.md §11（P4c）
#       §11.2 表结构 / §11.3 约束 / §11.7 特性接入
#
# 定位: 能被流程订单引用、能挂特性、能表达单父来源的最小批次主数据。
#   不建批次库存余额 / 批次成本 / 多父 genealogy（P5 及以后）。
#
# 口径（已定，勿重复讨论）:
#   ① 身份 = (item_id, org_id, batch_no)；批次属库存组织，不加 location_id。
#   ② status（生命周期 planned/in_process/closed）与 quality_status
#      （unrestricted/inspection/blocked）是两套语义，不合并 —— 否则
#      「在制但质检冻结」无法表达。
#   ③ parent_batch_id 自引用；P4c 只支持单父；禁自指/成环（深度 ≤ 10，服务层校验）。
#   ④ potency_pct 是物理列（计算型、参与投料折算），按 attribute_promotion 口径提列，
#      不进 EAV；描述性批次特性走 batch_attribute_values。
#   ⑤ quality_status=blocked 时不能 status=closed（服务层校验）。
#   ⑥ 从表 batch_attribute_values 的删除受 restrict 保护。
#
# 批次特性（不在本文件）: 复用 attribute_definitions + attribute_scopes(scope_ref='batch')
#   + batch_attribute_values；不建 characteristics_json / batch_characteristics。

id: batch
name: 批次
table_name: batches
description: 批次主数据——最小批次身份、生命周期、质量状态与单父亲来源
display_name_field: batch_no
aspects: [audit_aspect]

semantics:
  meaning: 批次
  category: core_entity
  aliases:
    - 批次
    - 批号
    - batch
    - lot

deletion_policy:
  mode: restrict
  restrict_on:
    - table: batch_attribute_values
      foreign_key: batch_id
      message: 该批次下仍有特性值，请先处理特性值后再删除
    - table: batches
      foreign_key: parent_batch_id
      message: 该批次仍被其他批次作为父批次引用，请先处理子批次
  cascade_delete: []

audit:
  enabled: true
  create:
    enabled: true
    fields: all
  update:
    enabled: true
    fields: changed_only
    exclude: [id, created_at, updated_at]
  delete:
    enabled: true
    fields: business_only
    exclude: [id, created_at, updated_at]
  associate:
    enabled: true
  dissociate:
    enabled: true

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true
    description: 技术主键
    semantics:
      meaning: 自增主键
      primary_key: true

  - id: batch_no
    name: 批次号
    type: string
    db_column: batch_no
    required: true
    max_length: 60
    description: 批次号；同一物料同一组织内唯一
    semantics:
      meaning: 批次业务标识
      business_key: true
      data_category: code
      searchable: true
    ui:
      widget: input
      fieldGroup: 基本信息
      fieldGroupPosition: 10

  - id: item_id
    name: 物料
    type: integer
    db_column: item_id
    required: true
    description: 批次所属物料
    semantics:
      meaning: 物料引用
      display:
        type: association
        target_type: item
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: item
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dialog
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 物料编码
            width: 160
          - field: name
            label: 物料名称
            width: 220
    ui:
      widget: select
      relation: item
      multiple: false
      fieldGroup: 基本信息
      fieldGroupPosition: 20

  - id: org_id
    name: 库存组织
    type: integer
    db_column: org_id
    required: true
    description: 批次所属库存组织（工厂 / 法人）；批次号的唯一范围
    semantics:
      meaning: 库存组织引用
      display:
        type: association
        target_type: org
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: org
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dialog
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 组织编码
            width: 140
          - field: name
            label: 组织名称
            width: 220
    ui:
      widget: select
      relation: org
      multiple: false
      fieldGroup: 基本信息
      fieldGroupPosition: 30

  - id: qty
    name: 批次数量
    type: number
    db_column: qty
    required: true
    description: 批次产出数量（非库存余额），必须大于 0
    constraints:
      - type: numeric_range
        gt: 0
    semantics:
      meaning: 批次产出数量
    ui:
      widget: number
      fieldGroup: 数量
      fieldGroupPosition: 40

  - id: qty_uom_id
    name: 数量单位
    type: integer
    db_column: qty_uom_id
    required: true
    description: 批次数量单位；须与物料基本单位同 uom_group
    semantics:
      meaning: 数量单位引用
      display:
        type: association
        target_type: uom
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: uom
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dialog
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 单位编码
            width: 140
          - field: name
            label: 单位名称
            width: 200
    ui:
      widget: select
      relation: uom
      multiple: false
      fieldGroup: 数量
      fieldGroupPosition: 50

  - id: parent_batch_id
    name: 父批次
    type: integer
    db_column: parent_batch_id
    nullable: true
    description: 拆分 / 合并来源批次（P4c 单父）；禁止自指与成环
    semantics:
      meaning: 父批次引用
      display:
        type: association
        target_type: batch
        display_field: batch_no
        placeholder: "无来源"
    value_help:
      source:
        type: bo
        target_bo: batch
        value_field: id
        display_field: batch_no
        code_field: batch_no
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dialog
        display_format: "{batch_no}"
        columns:
          - field: batch_no
            label: 批次号
            width: 180
          - field: item_id
            label: 物料
            width: 200
    ui:
      widget: select
      relation: batch
      multiple: false
      clearable: true
      fieldGroup: 来源
      fieldGroupPosition: 60

  - id: status
    name: 生命周期状态
    type: string
    db_column: status
    required: true
    default: planned
    max_length: 20
    description: 生命周期（计划 / 在制 / 关闭）
    enum_values:
      - value: planned
        label: 计划
        color: info
        is_initial: true
      - value: in_process
        label: 在制
        color: primary
      - value: closed
        label: 关闭
        color: success
    value_help:
      source:
        type: enum
        enum_type_id: batch_status
        sort_by: sort_order
      behavior:
        validation: true
        binding_strength: strict
        multiple: false
      presentation:
        result_type: dropdown
    semantics:
      meaning: 批次生命周期状态
      filterable: true
      filter_type: enum
      filter_label: 生命周期状态
      filter_scope: local
    ui:
      widget: select
      fieldGroup: 状态
      fieldGroupPosition: 70

  - id: quality_status
    name: 质量状态
    type: string
    db_column: quality_status
    required: true
    default: unrestricted
    max_length: 20
    description: 质量状态（可用 / 检验中 / 冻结）；blocked 时不能关闭批次
    enum_values:
      - value: unrestricted
        label: 可用
        color: success
        is_initial: true
      - value: inspection
        label: 检验中
        color: warning
      - value: blocked
        label: 冻结
        color: danger
    value_help:
      source:
        type: enum
        enum_type_id: batch_quality_status
        sort_by: sort_order
      behavior:
        validation: true
        binding_strength: strict
        multiple: false
      presentation:
        result_type: dropdown
    semantics:
      meaning: 批次质量状态
      filterable: true
      filter_type: enum
      filter_label: 质量状态
      filter_scope: local
    ui:
      widget: select
      fieldGroup: 状态
      fieldGroupPosition: 80

  - id: source
    name: 来源
    type: string
    db_column: source
    required: true
    default: manual
    max_length: 20
    description: 批次来源（生产 / 采购 / 手工 / 调整）
    enum_values:
      - value: production
        label: 生产
        color: primary
      - value: purchase
        label: 采购
        color: info
      - value: manual
        label: 手工
        color: success
        is_initial: true
      - value: adjustment
        label: 调整
        color: warning
    value_help:
      source:
        type: enum
        enum_type_id: batch_source
        sort_by: sort_order
      behavior:
        validation: true
        binding_strength: strict
        multiple: false
      presentation:
        result_type: dropdown
    semantics:
      meaning: 批次来源
      filterable: true
      filter_type: enum
      filter_label: 来源
      filter_scope: local
    ui:
      widget: select
      fieldGroup: 来源
      fieldGroupPosition: 90

  - id: produced_at
    name: 产出时间
    type: datetime
    db_column: produced_at
    nullable: true
    description: 产出时间；有效期起算参考
    semantics:
      meaning: 批次产出时间
    ui:
      widget: datetime
      fieldGroup: 时间
      fieldGroupPosition: 100

  - id: expiry_date
    name: 有效期至
    type: date
    db_column: expiry_date
    nullable: true
    description: 有效期；不得早于产出时间（produced_at 为空时不校验）
    semantics:
      meaning: 批次有效期
    ui:
      widget: date-picker
      fieldGroup: 时间
      fieldGroupPosition: 110

  - id: potency_pct
    name: 效价(%)
    type: number
    db_column: potency_pct
    nullable: true
    description: 效价百分比 0–100；物理列（计算型，参与投料折算），不进属性字典
    constraints:
      - type: numeric_range
        gte: 0
        lte: 100
    semantics:
      meaning: 批次效价百分比
    ui:
      widget: number
      fieldGroup: 质量
      fieldGroupPosition: 120

  - id: grade_code
    name: 质量等级
    type: string
    db_column: grade_code
    nullable: true
    max_length: 20
    description: 质量等级；字典序排序，NULL 排最后；物理列不进属性字典（研究稿 §11.9 O1）
    semantics:
      meaning: 批次质量等级
      data_category: code
      searchable: true
    ui:
      widget: input
      fieldGroup: 质量
      fieldGroupPosition: 125

  - id: description
    name: 说明
    type: string
    db_column: description
    nullable: true
    max_length: 255
    description: 批次说明
    semantics:
      meaning: 批次说明
      searchable: true
    ui:
      widget: textarea
      fieldGroup: 其他
      fieldGroupPosition: 130

  - id: created_at
    name: 创建时间
    type: datetime
    db_column: created_at
    description: 创建时间
    semantics:
      meaning: 记录创建时间
      audit_field: true

  - id: updated_at
    name: 更新时间
    type: datetime
    db_column: updated_at
    description: 更新时间
    semantics:
      meaning: 记录更新时间
      audit_field: true

indexes:
  - fields: [item_id, org_id, batch_no]
    unique: true
    name: uq_batch_item_org_no
    description: 批次号在同一物料同一组织内唯一
  - fields: [item_id]
    name: idx_batch_item
  - fields: [org_id]
    name: idx_batch_org
  - fields: [status]
    name: idx_batch_status
  - fields: [quality_status]
    name: idx_batch_quality_status
  - fields: [parent_batch_id]
    name: idx_batch_parent
  - fields: [produced_at]
    name: idx_batch_produced_at
  - fields: [item_id, grade_code]
    name: idx_batches_grade
    description: 按物料 + 质量等级筛选/排序（批次确定）

relations:
  - id: batch_to_item
    name: 物料
    type: reference
    target: item
    source_field: item_id
    target_field: id
    cardinality: N:1
    description: 物料引用（真外键 restrict）
  - id: batch_to_org
    name: 库存组织
    type: reference
    target: org
    source_field: org_id
    target_field: id
    cardinality: N:1
    description: 库存组织引用（真外键 restrict）
  - id: batch_to_qty_uom
    name: 数量单位
    type: reference
    target: uom
    source_field: qty_uom_id
    target_field: id
    cardinality: N:1
    description: 数量单位引用（真外键 restrict）
  - id: batch_to_parent
    name: 父批次
    type: reference
    target: batch
    source_field: parent_batch_id
    target_field: id
    cardinality: N:1
    description: 单父亲来源引用（自引用；可空）
  - id: batch_to_attribute_value
    name: 批次特性值
    type: reference
    target: batch_attribute_value
    source_field: id
    target_field: batch_id
    cardinality: 1:N
    description: 批次特性值（batch_attribute_values 反向引用）

ui_view_config:
  # 菜单由迁移 v196 手工声明（挂 master-data），不让自动生成器产出孤儿行
  skip_auto_menu: true
  list:
    detail_mode: drawer
    title: 批次
    columns:
      - field: batch_no
        width: 170
        sortable: true
      - field: item_id
        width: 190
        filterable: true
        filter_type: value_help
        render_as: association
        target_type: item
        display_field: name
      - field: org_id
        width: 160
        filterable: true
        filter_type: value_help
        render_as: association
        target_type: org
        display_field: name
      - field: qty
        width: 110
      - field: qty_uom_id
        width: 120
        render_as: association
        target_type: uom
        display_field: name
      - field: status
        width: 100
        filterable: true
        filter_type: select
      - field: quality_status
        width: 110
        filterable: true
        filter_type: select
      - field: source
        width: 100
        filterable: true
        filter_type: select
      - field: produced_at
        width: 160
      - field: expiry_date
        width: 120
      - field: potency_pct
        width: 100
    selection:
      enabled: true
      mode: multiple
    searchFields: [batch_no, description]
    actions:
      - id: create
        label: 新建批次
        icon: plus
        type: primary
        permission: batch:batch_create
    defaultSort:
      field: batch_no
      order: asc
  form:
    title: 批次
    layout: vertical
    sections:
      - title: 基本信息
        columns:
          - fields: [batch_no, item_id]
          - fields: [org_id, parent_batch_id]
      - title: 数量
        columns:
          - fields: [qty, qty_uom_id]
      - title: 状态
        columns:
          - fields: [status, quality_status, source]
      - title: 时间
        columns:
          - fields: [produced_at, expiry_date]
      - title: 质量
        columns:
          - fields: [potency_pct]
      - title: 其他
        columns:
          - fields: [description]
  detail:
    layout: tabs
    title: "批次 {record.batch_no} 详情"
    tabs:
      - id: basic
        label: 基本信息
        type: fields
        fields: [batch_no, item_id, org_id, parent_batch_id, qty,
                 qty_uom_id, status, quality_status, source, produced_at,
                 expiry_date, potency_pct, description]

category_config:
  create_permission: batch:batch_create
  update_permission: batch:batch_update
  delete_permission: batch:batch_delete
  owner_auto_permission: false
