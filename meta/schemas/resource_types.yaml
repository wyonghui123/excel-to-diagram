# ============================================
# 资源类型声明 (Spec §4.5.1 / §3.6.1)
# 单一事实来源 (SSOT) for Resource Type metadata
# 引用方: meta/services/resource_inheritance_engine.py
# ============================================
#
# 3 种资源类型 (v43 2026-09-02 Spec16 Phase7 r3):
#   independent  — 独立资源 (product, user, role) — 不继承
#   subordinate  — 附属资源 (audit_log) — 自动继承 parent.owner
#   hierarchy    — 层级资源 (version, domain, sub_domain) — 向下展开, 不自动继承
#
# [v43 2026-09-02 r3] 删 'association'(relationship)/'subordinate'(annotation):
#   relationship: 两端 BO 权限取并集 (取 source_bo/target_bo 的权限交集), 不单独授权
#   annotation:   备注挂在 BO 上, 跟随 parent BO 的权限, 不该作为独立矩阵行
#   都不属于"业务对象 × 动作 × 范围"的矩阵语义, 走专用管理界面或 BO 权限推导.
#
# actions（[P2-Matrix-01 / A5]）: 每个资源类型「可授权动作清单」。
# 前端矩阵视图据此动态生成动作列，不支持的列灰化禁选（audit_log 无 create/update/delete 等）。
# 动作须在 permission_dimension_api._ACTION_LABELS 中有中文标签（缺则自动用 code 兜底）。
#
# [v36 2026-08-27] 删 'list'（统一守卫 read, 详见 api/permission_dimension_api._ACTION_LABELS）
# [v36 2026-08-27] 加 'import'（_standard_actions.yaml 早已定义, 后端 export_import_api 已校验守卫）

product:
  type: independent
  table: products
  actions: [read, create, update, delete, export, import]

version:
  type: hierarchy
  parent: product
  parent_field: product_id
  table: versions
  actions: [read, create, update, delete, export, import]

domain:
  type: hierarchy
  parent: version
  parent_field: version_id
  table: domains
  actions: [read, create, update, delete, export, import]

sub_domain:
  type: hierarchy
  parent: domain
  parent_field: domain_id
  table: sub_domains
  actions: [read, create, update, delete, export, import]

service_module:
  type: hierarchy
  parent: sub_domain
  parent_field: sub_domain_id
  table: service_modules
  actions: [read, create, update, delete, export, import]

business_object:
  type: hierarchy
  parent: service_module
  parent_field: service_module_id
  table: business_objects
  actions: [read, create, update, delete, export, import]

audit_log:
  type: subordinate
  parent_type_field: object_type
  parent_id_field: object_id
  inherit_owner: true
  table: audit_logs
  actions: [read, export]

user:
  # [Spec 19 M2 2026-09-05] 委托授权行（FR-001）：动作集收窄为 read/create/update。
  # delete/export 不进委托动作集（仅全局管理员 * 内置），防受托管理员删号/批量导出。
  type: independent
  table: users
  actions: [read, create, update]
  # [Spec 19 FR-012 2026-09-05] 灰化动作说明（说明与限制同源）：
  #   /meta 以 action_hints 下发，矩阵灰化格 tooltip 展示"为什么不能勾"。
  #   提示文字与动作集收窄声明写在同一文件，改限制时说明自动跟随，不漂移。
  action_hints:
    delete: '不可通过矩阵授权：用户删除仅限全局管理员（审计链保护，防删号）'
    export: '不可通过矩阵授权：用户导出仅限全局管理员（防批量导出用户数据）'
    import: '不可通过矩阵授权：用户导入仅限全局管理员（防批量写入越权账号）'

# [Spec 19 M2 2026-09-05 FR-001/FR-002] 组织管理委托授权行：
#   行级范围 = 绑定组织子树（OrgAdminScopeService 动态解析），语义是"管理范围"非普通读写。
#   delete / move 不进动作集（FR-005：组织删除/移动仅全局管理员，org:move 门禁）。
org:
  type: independent
  table: orgs
  actions: [read, create, update]
  # [Spec 19 FR-012 2026-09-05] 灰化动作说明（同上，说明与限制同源）
  action_hints:
    delete: '不可通过矩阵授权：组织删除仅限全局管理员（子树数据完整性保护）'
    export: '不可通过矩阵授权：组织导出仅限全局管理员'
    import: '不可通过矩阵授权：组织导入仅限全局管理员'
    move: '组织移动（变更上级组织）仅限全局管理员（org:move 门禁）：移动会改变受托范围拓扑'

role:
  type: independent
  table: roles
  actions: [read, create, update, delete, export]

# ============================================
# [v43 2026-09-02 Spec16 Phase7] 补 5 个真业务 BO 声明
# 背景: v070 之前这些 rt 直接写在 permissions.resource_type (例 scheduled_task:scheduled_task_read),
#   但 resource_types.yaml 未声明, _build_role_matrices 通过 extra_rts 兜底显示 (无标签无维度).
# 现在 yaml 是 SSOT, 这些 BO 正式进入资源矩阵管理, 可勾选动作 + 范围条件.
# 5 个表均已验证存在 (probe_rt_table_exists.py): scheduled_tasks/task_queues/
#   task_executions/ai_async_tasks/enum_types
#
# 不在矩阵中的相关 rt (走专用管理界面):
#   - menu:            菜单管理 (系统级 UI 入口, 走专用菜单权限 Tab)
#   - enum_value:      枚举值 (随 enum_type inherit owner, 但管理走 enum_type 详情页)
#   - filter_variant:  过滤变体 (用户级, 按 user_id 隔离, 不该进 PS 矩阵)
# ============================================
scheduled_task:
  type: independent
  table: scheduled_tasks
  actions: [read, create, update, delete, execute, export, import]

task_queue:
  type: independent
  table: task_queues
  actions: [read, create, update, delete, manage, export]

task_execution:
  # [FIX Spec16 Phase7 2026-09-02] 任务执行记录 是独立资源, 不是 subordinate.
  # DB schema (task_executions 33 cols) 无 parent_type/parent_id 字段, 只有 trigger_source 字符串.
  # user_id 字段表示"执行人" (谁触发的), 不是 inherit owner 关系.
  # 早期误判为 subordinate (依赖 scheduled_task/ai_async_task) 已修正.
  type: independent
  table: task_executions
  actions: [read, delete, export]

ai_async_task:
  type: independent
  table: ai_async_tasks
  actions: [read, create, update, delete, execute, export, import]

enum_type:
  type: independent
  table: enum_types
  actions: [read, create, update, delete, export, import]
