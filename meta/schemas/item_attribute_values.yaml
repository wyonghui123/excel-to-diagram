# 物料分层参数值 (Item Attribute Values) — foundation 步 1 · item 族分层值表（一期预留）
# 依据: 蓝图 §3.4.2 / §3.4.3（属性轴/两种默认机制）/ §3.4.9; 规划 §2.3 / §2.4
# 形态 (D2 已拍 v2.5；2026-10-07 重估收敛): 单表 + 因子列 —— (attr_code, org_id) 因子列化（不按层分表）
# 值列 (D2 残余 2026-10-07 收口): **类型化列** —— value_text / value_number / value_boolean（见 [未决] 1）
# 属性轴止于 2 层 (S2/S3，2026-10-07 重估)，阅读顺序 L2 → L0（逐层回退），层数不写死进物理 schema (S8/S9)：
#   L0 全局:  org_id 空     键 (item_id, attr_code)
#   L2 组织:  org_id 非空   键 (item_id, attr_code, org_id)
# （2026-10-07 重估：原 L1 职能域层已砍除——function_type 列退场，见规划 §5.1 / 规范 v1.2；
#   L1 空档不再启用，保留 L0/L2 编号不重排。）
# 只装 hybrid 参数（可人工覆盖、缺失时逐层回退）; stored 锚属性在主表 items; derived 不落列。
#
# [字典桥接] 本表原以自由文本 attr_code 标识参数，现与属性字典对接：
#   · `attribute_id` 为真外键（→ attribute_definitions），承载类型、值域与状态口径；
#   · `attr_code` 仍是物理唯一键（L0/L2 的 partial unique 依赖它），写入时须与字典 `code` 一致
#     （应用层守卫校验，DSL 无跨表 CHECK）；
#   · 存量行由 v111 迁移按 code 回填 attribute_id，无法匹配的编码输出对账清单，不自动造定义。
#   · 保留 attr_code 而非直接换键，是为了不动 L0/L2 两段式唯一约束（换键须重建索引，收益不足以抵消风险）。
#
# [未决/不阻塞]
#  1. ~~值列承载（类型化列 vs JSON）待 §8.3 值存储规范核对后定~~ —— **已定（2026-10-07 核对落定）：
#     **类型化列**。核对依据：平台 DSL 标量类型体系（`FieldType`：string/integer/float/boolean/datetime/
#     text/json）；`type: json` 在平台仅用于复合负载（快照/条件/事件体），标量业务值一律类型化列
#     （须可 SQL 比较/过滤/索引——JSON 文本比较会坏数字语义）；对标 location 弹性属性结论"不用宽表/JSON"。
#     映射 = string/text/enum/ref → `value_text`；integer/float → `value_number`；boolean → `value_boolean`；
#     datetime 类参数按同一映射增列（ADD COLUMN，成本低）。同行为**互斥填充**（一行仅一列非空；类型由
#     参数目录声明；互斥校验在应用层——DSL 无 CHECK）。原单列 `value`(TEXT, JSON 承载) 占位**废弃**。
#  2. ~~可空复合唯一 —— SQLite 中 NULL 互不相等，唯一约束对含空因子的行不生效（落地实测点）；
#     本期以普通索引 + 应用层查重承接。~~ —— **已定（2026-10-07 拍板并落地，见 indexes 段）**：
#     L0/L2 各一条 partial unique（`uidx_item_attr_l0` WHERE org_id IS NULL /
#     `uidx_item_attr_l2` WHERE org_id IS NOT NULL）——索引列在条件下均非空 ⇒ SQLite 唯一性生效。
#     [核对留痕 2026-10-06，2026-10-07 更新] schema_generator 支持部分唯一索引（type: partial +
#     condition + unique → CREATE UNIQUE INDEX ... WHERE），已实测确认。
#     （原 L1 条随职能域层砍除删除；原「L2 键是否含 function_type」疑问随列退场消解——口径 = 不含。）
#
# [物理落地 2026-10-07 实测·已完成] 本表物理形态已与本yaml 完全对齐（dev 库 meta/architecture.db）：
#   · `value_text` / `value_number` / `value_boolean` 三列已物化（value_number = REAL、value_boolean = INTEGER，
#     合 schema_generator TYPE_MAPPING）。
#   · 唯一索引已就位：uidx_item_attr_l0 (WHERE org_id IS NULL) / uidx_item_attr_l2 (WHERE org_id IS NOT NULL)
#     + idx_item_attr_org。
#   · 历史残留已清理：`function_type`（L1 砍除）与旧 `value`（JSON 占位）两列已 DROP；三条同字段旧普通索引
#     （idx_item_attr_l1 / idx_item_attr_item_code / idx_item_attr_l2）已 DROP。
#   [列序说明] 物理列序为历史建表遗留（description 位于 value_* 之前），与本yaml 声明序不同——按列名访问，
#     无功能影响；如需规整可在同步窗口重建表（本表 0 行，成本极低）。
#   [前置校验] 两旧列删除前已确认：表0 行 + 代码库零引用（无任何读写路径）+ 相关索引已先DROP。
#     执行前已备份 meta/architecture.db.bak-item-axis-20261007-152536。

id: item_attribute_value
name: 物料分层参数值
table_name: item_attribute_values
description: 物料分层参数值（L0/L2 因子列 + 类型化值列 value_text/number/boolean，hybrid 参数；2026-10-07：L1 职能域层砍除 + 值列形态收口）
parent_object: item
hierarchy:
  enabled: true
  parent_field: item_id

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true
    description: 技术主键
    semantics:
      meaning: 自增主键
      primary_key: true

  - id: item_id
    name: 物料
    type: integer
    db_column: item_id
    required: true
    description: 物料引用
    semantics:
      meaning: 所属物料
      display:
        type: association
        target_type: item
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: item
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} {name}"
        columns:
          - field: code
            label: 编码
            width: 140
          - field: name
            label: 名称
            width: 200
    ui:
      widget: select
      relation: item
      multiple: false

  - id: attribute_id
    name: 属性定义
    type: integer
    db_column: attribute_id
    nullable: true
    description: 参数字典引用（→ attribute_definitions）；与 attr_code 并存，attr_code 为物理唯一键，本列承载类型口径
    semantics:
      meaning: 参数字典引用
      display:
        type: association
        target_type: attribute_definition
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: attribute_definition
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} {name}"
        columns:
          - field: code
            label: 编码
            width: 160
          - field: name
            label: 名称
            width: 200
    ui:
      widget: select
      relation: attribute_definition
      multiple: false
      clearable: true

  - id: attr_code
    name: 参数编码
    type: string
    db_column: attr_code
    required: true
    max_length: 60
    description: 参数编码（物理唯一键；须与 attribute_id 指向的定义 code 一致，应用层校验）
    semantics:
      meaning: 分层参数标识
    ui:
      widget: input

  - id: org_id
    name: 组织
    type: integer
    db_column: org_id
    nullable: true
    description: L2 因子——组织覆盖；空 = L0 全局行（全平台默认，2026-10-07 重估）
    semantics:
      meaning: L2 组织因子
      display:
        type: association
        target_type: org
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: org
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
      presentation:
        result_type: dropdown
        display_format: "{name}"
        columns:
          - field: code
            label: 编码
            width: 120
          - field: name
            label: 名称
            width: 200
    ui:
      widget: select
      relation: org
      multiple: false
      clearable: true

  - id: value_text
    name: 参数值（文本）
    type: text
    db_column: value_text
    nullable: true
    description: 文本类参数值（枚举码 / 引用码 / 字符串；D2 值列形态 2026-10-07：类型化列）
    semantics:
      meaning: 分层参数的文本类值（string/text/enum/ref 类参数）
    ui:
      widget: input

  - id: value_number
    name: 参数值（数值）
    type: float
    db_column: value_number
    nullable: true
    description: 数值类参数值（integer/float 均走本列，REAL 承载；如安全库存、提前期天数）
    semantics:
      meaning: 分层参数的数值类值（integer/float 类参数）
    ui:
      widget: number

  - id: value_boolean
    name: 参数值（布尔）
    type: boolean
    db_column: value_boolean
    nullable: true
    description: 布尔类参数值（如 inspection_required；一行仅一列非空）
    semantics:
      meaning: 分层参数的布尔类值（boolean 类参数）
    ui:
      widget: switch

  - id: value_date
    name: 参数值（日期）
    type: date
    db_column: value_date
    nullable: true
    description: 日期类参数值（对应 data_type=date；一行仅一列非空）
    semantics:
      meaning: 分层参数的日期类值
    ui:
      widget: date

  - id: value_datetime
    name: 参数值（日期时间）
    type: datetime
    db_column: value_datetime
    nullable: true
    description: 日期时间类参数值（对应 data_type=datetime；一行仅一列非空）
    semantics:
      meaning: 分层参数的日期时间类值
    ui:
      widget: datetime

  - id: description
    name: 备注
    type: text
    db_column: description
    nullable: true
    description: 备注
    semantics:
      meaning: 参数值备注
    ui:
      widget: textarea

indexes:
  # [D2 唯一约束 · 2026-10-07 落地] 按层各一条 partial unique（拟补法拍板）：
  #   L0 行 org_id 恒空 → WHERE org_id IS NULL；L2 行 org_id 非空 → WHERE org_id IS NOT NULL。
  #   索引列在条件下均非空 ⇒ SQLite 唯一性生效（普通唯一约束对含 NULL 因子的行不生效——NULL 互不相等）。
  # [去重副作用 · 平台机制] schema_generator._deduplicate_indexes 按「索引字段组合」去重、唯一索引覆盖同字段
  #   普通索引 ⇒ 原 idx_item_attr_item_code / idx_item_attr_l2 已被下列两条取代，故不再重复声明。
  # [已知取舍] 「不限 org 的全量查」（列某物料全部参数）不再有专用前缀索引——本表一期预留、当前 0 行，
  #   暂可接受；若后续性能告警再补 (item_id) 普通索引（字段组合不与下两条冲突）。
  # [迁移留痕] SchemaMigrator 仅清理 uidx_ 前缀的过时索引 ⇒ 旧普通索引在 dev 库残留为冗余索引（不影响正确性）。
  - fields: [item_id, attr_code]
    name: uidx_item_attr_l0
    type: partial
    unique: true
    condition: org_id IS NULL
    description: L0 全局行唯一（键 item_id + attr_code；org_id 为空的行）
  - fields: [item_id, attr_code, org_id]
    name: uidx_item_attr_l2
    type: partial
    unique: true
    condition: org_id IS NOT NULL
    description: L2 组织行唯一（键 item_id + attr_code + org_id）
  - fields: [org_id]
    name: idx_item_attr_org

relations:
  - id: item_attribute_value_to_item
    name: 物料
    type: reference
    target: item
    source_field: item_id
    target_field: id
    cardinality: N:1
    description: 所属物料引用（[FK 2026-10-07] 由展示语义升级为真外键；org_id 按平台惯例（组织维弱引用）不建 FK）
  - id: item_attribute_value_to_attribute
    name: 属性定义
    type: reference
    target: attribute_definition
    source_field: attribute_id
    target_field: id
    cardinality: N:1
    description: 参数字典引用（字典桥接：attr_code 仍是物理唯一键，attribute_id 提供外键与类型口径；存量由 v111 回填）

ui_view_config:
  skip_auto_menu: true

nested:
  enabled: true
  parent: item
  children: []