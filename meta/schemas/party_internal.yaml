# ============================================
# 内部治理台账面（party_internal）— foundation 步 2 · F1 治理分域 v1.1 §3.5
# object_type: view（真 SQL 视图，只读面；写请求由 READ_ONLY_VIEW 护栏拒绝 → API 400）
# 谓词: source = 'org'（全内部行，org_id 非空）
# 绑定: 挂 org 维度（direct，字段 org_id）—— 全内部行 ⇒ 无条件 AND org_id IN (子树展开集)
#       在面上恒成立；无范围用户自然得空集
# [机制登记] dimension_object_mapping.yaml org 块 applies_to 同步登记本面
#   {bo: party_internal, field: org_id, filter_type: direct}（查询管线按 BO id 注入）
# ============================================

id: party_internal
name: 内部治理台账
table_name: party_internal
description: 内部治理台账面：恒取 source='org' 的内部组织表示（经 org 维度范围注入过滤）
display_name_field: name
object_type: view
view_definition: |
  SELECT id, name, party_type, source, org_id
  FROM parties
  WHERE source = 'org'

# [F1 §3.2] 绑定只挂内部面（第二条声明路径；基表与 archive 面均不声明）
dimension_bindings:
  - dimension: org
    field: org_id

# [F1 §7.1-4] 只读面：面不含写动作（read / list 之外的动作不声明）；auto_crud 关闭
import_export:
  auto_crud: false

actions:
  - id: party_internal_read
    name: 查询内部治理台账
    type: crud
    method: GET
    path: "/api/v1/party_internals/{id}"
    description: 查询单个内部治理台账记录
  - id: party_internal_list
    name: 查询内部治理台账列表
    type: crud
    method: GET
    path: "/api/v1/party_internals"
    description: 查询内部治理台账列表

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true
    description: 技术主键（继承自 parties.id）
    semantics:
      meaning: 自增主键
      primary_key: true

  - id: name
    name: 显示名
    type: string
    db_column: name
    required: true
    max_length: 200
    description: 身份显示名（组织名）
    semantics:
      meaning: 身份显示名称
      display_name: true
      searchable: true
    ui:
      widget: input

  - id: party_type
    name: 身份类型
    type: string
    db_column: party_type
    required: true
    max_length: 30
    description: 身份类型（本面恒为 organization）
    semantics:
      meaning: 身份类型分类
    ui:
      widget: select

  - id: source
    name: 治理分域
    type: string
    db_column: source
    nullable: true
    max_length: 30
    description: 治理分域键（本面恒为 'org'）
    semantics:
      meaning: 治理分域来源键

  - id: org_id
    name: 组织引用
    type: integer
    db_column: org_id
    nullable: true
    description: orgs 外键（本面非空且 1:1；org 维度注入字段）
    semantics:
      meaning: 对应组织

relations: []

ui_view_config:
  skip_auto_menu: true