# ============================================
# 内部治理台账面（party_internal）— foundation 步 2 · F1 治理分域 v1.1 §3.5
# object_type: view（真 SQL 视图，只读面；写请求由 READ_ONLY_VIEW 护栏拒绝 → API 400）
# 谓词: source = 'org'（全内部行，org_id 非空）
# 绑定: 挂 org 维度（direct，字段 org_id）—— 全内部行 ⇒ 无条件 AND org_id IN (子树展开集)
#       在面上恒成立；无范围用户自然得空集
# [机制登记] dimension_object_mapping.yaml org 块 applies_to 同步登记本面
#   {bo: party_internal, field: org_id, filter_type: direct}（查询管线按 BO id 注入）
# ============================================

id: party_internal
name: 内部治理台账
table_name: party_internal
description: 内部治理台账面：恒取 source='org' 的内部组织表示（经 org 维度范围注入过滤）
display_name_field: name
object_type: view
view_definition: |
  SELECT id, code, name, party_type, source, org_id, status
  FROM parties
  WHERE source = 'org'

# [F1 §3.2] 绑定只挂内部面（第二条声明路径；基表与 archive 面均不声明）
dimension_bindings:
  - dimension: org
    field: org_id

# [F1 §7.1-4] 只读面：面不含写动作（read / list 之外的动作不声明）；auto_crud 关闭
import_export:
  auto_crud: false

actions:
  - id: party_internal_read
    name: 查询内部治理台账
    type: crud
    method: GET
    path: "/api/v1/party_internals/{id}"
    description: 查询单个内部治理台账记录
  - id: party_internal_list
    name: 查询内部治理台账列表
    type: crud
    method: GET
    path: "/api/v1/party_internals"
    description: 查询内部治理台账列表

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true
    description: 技术主键（继承自 parties.id）
    semantics:
      meaning: 自增主键
      primary_key: true

  - id: code
    name: 身份主体编号
    type: string
    db_column: code
    required: true
    max_length: 20
    description: 身份主体唯一识别号（继承自 parties.code）
    semantics:
      meaning: 身份主体业务编码
      business_key: true
      immutable: true
      data_category: code
    ui:
      widget: input

  - id: name
    name: 显示名
    type: string
    db_column: name
    required: true
    max_length: 200
    description: 身份显示名（组织名）
    semantics:
      meaning: 身份显示名称
      display_name: true
      searchable: true
    ui:
      widget: input

  # [v2.6 2026-10-17] 删去 person 枚举项：视图谓词 source='org' ⇒ 本面恒为
  #   organization；列出 person 只会误导（对外个人的表现走 party_archive 面）。
  - id: party_type
    name: 身份类型
    type: string
    db_column: party_type
    required: true
    default: organization
    max_length: 30
    description: 身份类型（本面恒为 organization）
    enum_values:
      - value: organization
        label: 组织
        color: primary
    semantics:
      meaning: 身份类型分类
    ui:
      widget: select

  # [F1 2026-10-17] 恒定字段隐藏 + relation 绑定修复（用户手机端实测报障）
  #   source: 谓词 source = 'org' ⇒ 本面恒为 'org'，它是"这行是内部记录"的
  #     身份标识而非业务输入，暴露即噪声（且可编辑会误导用户去改它）。
  #   org_id: 本面非空且 1:1，是**真实业务数据**，故保留可见；仅补 ui.relation
  #     修复"渲染成 el-input-number 数字框"——ObjectPageShell 按 ui.relation
  #     构造 value_help 走 BO 选择器（见 L246-255），缺 relation 即退回按
  #     type:integer 渲染数字框。基表同字段见 party.yaml 的 party_to_org。
  - id: source
    name: 治理分域
    type: string
    db_column: source
    nullable: true
    max_length: 30
    description: 治理分域键（本面恒为 'org'）
    semantics:
      meaning: 治理分域来源键
    ui:
      visible: false

  - id: org_id
    name: 组织引用
    type: integer
    db_column: org_id
    nullable: true
    description: orgs 外键（本面非空且 1:1；org 维度注入字段）
    semantics:
      meaning: 对应组织
    ui:
      relation: org
      display_field: name

  # [生命周期 2026-10-07] 与基表同列出口径（谓词列 + status），供消费方按状态过滤
  - id: status
    name: 状态
    type: string
    db_column: status
    required: true
    default: active
    max_length: 30
    description: 身份主体状态 active/inactive（继承自 parties.status；内部行同样可停用）
    enum_values:
      - value: active
        label: 启用
        color: success
        category: active
        is_initial: true
      - value: inactive
        label: 停用
        color: info
        category: inactive
    semantics:
      meaning: 身份主体启用状态
      filterable: true
      filter_type: enum
      filter_label: 状态
      filter_scope: local
    ui:
      widget: select

# [v2.6 2026-10-17] 面为 SQL 视图，不在面上建 FK：party→org 的外键口径落在基表
#   party.yaml 的 party_to_org（source_field: org_id）；本面 org_id 引用同一底层列。
#   口径由 test_f1_party_view_facets.py 的 test_org_reference_agreement 锁定。
relations: []

ui_view_config:
  skip_auto_menu: true