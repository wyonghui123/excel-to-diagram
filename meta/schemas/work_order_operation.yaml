# 工单工序 (Work Order Operation) — 销售订单波次 3 / B6
# 依据: docs/superpowers/specs/2026-10-29-so-wave3/spec.md §10.15
#
# 定位: work_order 内部工序（1:N，用于多次上门 / 多道处置）。
#       与批次 4 的 tasks（跨单据编排节点）区分：本表一定消耗资源、
#       按工单模板顺序执行，不参与跨单据依赖。
#
# 父字段: work_order_id（挂 work_orders，子表通过 work_order.yaml 的 child_sections 挂载）。
# 唯一性: (work_order_id, seq) 唯一。

id: work_order_operation
name: 工单工序
table_name: work_order_operations
description: 工单内部工序（多次上门 / 多道处置）
display_name_field: id
parent_object: work_order

hierarchy:
  parent_field: work_order_id

semantics:
  meaning: 工单工序
  category: business_document_line
  business_key: []
  aliases:
    - 工单工序
    - 作业工序
    - Work Order Operation

deletion_policy:
  mode: cascade

audit:
  enabled: true
  create:
    enabled: true
    fields: all
  update:
    enabled: true
    fields: changed_only
    exclude:
      - id
      - created_at
      - updated_at
  delete:
    enabled: true
    fields: business_only
    exclude:
      - id
      - created_at
      - updated_at

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true
    description: 技术主键
    semantics:
      meaning: 自增主键
      primary_key: true

  - id: work_order_id
    name: 工单
    type: integer
    db_column: work_order_id
    required: true
    description: 所属工单（父字段）
    semantics:
      meaning: 所属工单
      display:
        type: association
        target_type: work_order
        display_field: work_order_no
    ui:
      widget: select
      relation: work_order
      hidden_in_form: true

  - id: seq
    name: 工序号
    type: integer
    db_column: seq
    required: true
    description: 工序顺序号（同一工单内唯一）
    constraints:
      - type: numeric_range
        gt: 0
        decimal_places: 0
    semantics:
      meaning: 工序顺序
      filterable: true
      filter_type: number
      filter_label: 工序号
      filter_scope: local
    ui:
      widget: number

  # [P2a 2026-11-01] work_center_id → resource_group_id：消除悬空引用，
  #   工作中心作为 resource_group(group_kind=work_center) 的取值（不建独立表）。
  - id: resource_group_id
    name: 资源组/工作中心
    type: integer
    db_column: resource_group_id
    nullable: true
    description: 资源组（工作中心是 group_kind=work_center 的取值）；空表示未指定
    semantics:
      meaning: 执行工序的资源组 / 工作中心
      display:
        type: association
        target_type: resource_group
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: resource_group
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dialog
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 组编码
            width: 150
          - field: name
            label: 组名称
            width: 220
    ui:
      widget: select
      relation: resource_group
      clearable: true

  - id: operation_name
    name: 工序名称
    type: string
    db_column: operation_name
    required: true
    max_length: 100
    description: 工序名称（如 上门诊断 / 更换配件）
    semantics:
      meaning: 工序名称
      data_category: text
    ui:
      widget: input

  - id: setup_minutes
    name: 准备工时
    type: number
    db_column: setup_minutes
    nullable: true
    description: 准备工时（分钟）
    semantics:
      meaning: 工序准备工时
    ui:
      widget: number

  - id: run_minutes
    name: 执行工时
    type: number
    db_column: run_minutes
    nullable: true
    description: 执行工时（分钟）
    semantics:
      meaning: 工序执行工时
    ui:
      widget: number

  # [P2a 2026-11-01] 收尾工时（作业收尾，默认 0）；
  #   queue_minutes / move_minutes 留 P2b。
  - id: teardown_minutes
    name: 收尾工时
    type: integer
    db_column: teardown_minutes
    nullable: true
    default: 0
    description: 收尾工时（分钟，默认 0）
    semantics:
      meaning: 工序收尾工时
    ui:
      widget: number

  # [P2a 2026-11-01] 技能要求改为主数据引用（skill）；可空。
  - id: required_skill_id
    name: 所需技能
    type: integer
    db_column: required_skill_id
    nullable: true
    description: 所需技能（引用 skill 主数据，可空）
    semantics:
      meaning: 工序所需技能引用
      display:
        type: association
        target_type: skill
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: skill
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dialog
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 技能编码
            width: 160
          - field: name
            label: 技能名称
            width: 220
    ui:
      widget: select
      relation: skill
      clearable: true

  # [P2a 2026-11-01] 旧文本列仅保留历史只读，新逻辑不再读取。
  - id: required_skill
    name: 所需技能（已废弃）
    type: string
    db_column: required_skill
    nullable: true
    max_length: 100
    description: 已废弃：旧文本技能列，仅供历史数据只读，新逻辑请用 required_skill_id
    semantics:
      meaning: 已废弃的文本技能（历史只读；新逻辑改用 required_skill_id）
      data_category: text
      readonly_always: true
    ui:
      widget: input
      editable: false
      readonly: true

  # 作业定义溯源（G12）：本工序由哪条工艺路线 / 哪个标准工序展开而来
  #   手填工序留空（空值 = 未溯源）；存量工单不回溯
  #   不加真外键：SQLite 不支持对存量表 ALTER 加 FK，且删除 restrict 已由
  #   work_definition_operation.deletion_policy 承担（软引用 + 服务层校验）
  - id: work_definition_id
    name: 作业定义
    type: integer
    db_column: work_definition_id
    nullable: true
    description: 来源作业定义（工艺路线 / 服务模板；可空 = 手填工序）
    semantics:
      meaning: 来源作业定义
      display:
        type: association
        target_type: work_definition
        display_field: name
        placeholder: "手填"
    value_help:
      source:
        type: bo
        target_bo: work_definition
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} {name}"
        columns:
          - field: code
            label: 定义编号
            width: 140
          - field: name
            label: 定义名称
            width: 200
    ui:
      widget: select
      relation: work_definition
      multiple: false
      clearable: true

  - id: work_definition_operation_id
    name: 标准工序
    type: integer
    db_column: work_definition_operation_id
    nullable: true
    description: 来源作业定义工序（可空 = 手填工序）
    semantics:
      meaning: 来源作业定义工序
      display:
        type: association
        target_type: work_definition_operation
        display_field: operation_name
        placeholder: "手填"
    value_help:
      source:
        type: bo
        target_bo: work_definition_operation
        value_field: id
        display_field: operation_name
        code_field: seq
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{seq} {operation_name}"
        columns:
          - field: seq
            label: 序号
            width: 80
          - field: operation_name
            label: 工序名称
            width: 200
    ui:
      widget: select
      relation: work_definition_operation
      multiple: false
      clearable: true

  - id: status
    name: 工序状态
    type: string
    db_column: status
    required: true
    default: pending
    description: 工序状态
    enum_values:
      - value: pending
        label: 待开始
        color: info
        category: draft
        is_initial: true
      - value: running
        label: 进行中
        color: primary
        category: active
      - value: completed
        label: 已完成
        color: success
        category: active
      - value: cancelled
        label: 已取消
        color: danger
        category: inactive
    semantics:
      meaning: 工序状态
      filterable: true
      filter_type: enum
      filter_label: 工序状态
      filter_scope: local
    ui:
      widget: select

  - id: created_at
    name: 创建时间
    type: datetime
    db_column: created_at
    description: 创建时间
    semantics:
      meaning: 记录创建时间
      audit_field: true

  - id: updated_at
    name: 更新时间
    type: datetime
    db_column: updated_at
    description: 更新时间
    semantics:
      meaning: 记录更新时间
      audit_field: true

indexes:
  - fields: [work_order_id]
    name: idx_work_order_operation_work_order
  - fields: [work_order_id, seq]
    unique: true
    name: uq_work_order_operation_seq
  - fields: [resource_group_id]
    name: idx_work_order_operation_resource_group
  - fields: [required_skill_id]
    name: idx_work_order_operation_required_skill
  # G12 溯源：按作业定义查工单工序
  - fields: [work_definition_id]
    name: idx_work_order_operation_definition
  - fields: [work_definition_operation_id]
    name: idx_work_order_operation_definition_op

relations:
  - id: work_order_operation_to_work_order
    name: 所属工单
    type: reference
    target: work_order
    source_field: work_order_id
    target_field: id
    cardinality: N:1
    description: 所属工单引用（真外键）
  - id: work_order_operation_to_resource_group
    name: 资源组/工作中心
    type: reference
    target: resource_group
    source_field: resource_group_id
    target_field: id
    cardinality: N:1
    description: 资源组引用（可空；真外键，restrict）
  - id: work_order_operation_to_required_skill
    name: 所需技能
    type: reference
    target: skill
    source_field: required_skill_id
    target_field: id
    cardinality: N:1
    description: 所需技能引用（可空；真外键，restrict）

ui_view_config:
  skip_auto_menu: true
  list:
    detail_mode: drawer
    title: 工单工序
    columns:
      - field: seq
        width: 90
      - field: operation_name
        width: 180
      - field: resource_group_id
        width: 160
        render_as: association
        target_type: resource_group
        display_field: name
      - field: setup_minutes
        width: 110
      - field: teardown_minutes
        width: 110
      - field: run_minutes
        width: 110
      - field: required_skill_id
        width: 150
        render_as: association
        target_type: skill
        display_field: name
      - field: status
        width: 100
        filterable: true
        filter_type: select
    selection:
      enabled: true
      mode: multiple
    defaultSort:
      field: seq
      order: asc
  form:
    title: 工序信息
    layout: vertical
    sections:
      - title: 基本信息
        columns:
          - fields: [seq, operation_name, status]
      - title: 资源与工时
        columns:
          - fields: [resource_group_id, required_skill_id]
          - fields: [setup_minutes, teardown_minutes, run_minutes]
          # required_skill（旧文本列）已废弃，仅历史只读，不进入录入表单
      - title: 工艺溯源
        columns:
          - fields: [work_definition_id, work_definition_operation_id]
  detail:
    facets:
      - title: 工序信息
        id: work_order_operation_basic
        type: fieldGroup
        fields:
          - seq
          - operation_name
          - work_definition_id
          - work_definition_operation_id
          - resource_group_id
          - required_skill_id
          - required_skill
          - setup_minutes
          - teardown_minutes
          - run_minutes
          - status
          - created_at
          - updated_at
