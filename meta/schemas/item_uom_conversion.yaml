# 物料单位换算 (Item UoM Conversion) — foundation 步 1 · item 族子表（一期）
# 依据: 蓝图 §3.4.8 / 规划 §2.5 / §4.3 C7
# 语义: 基本单位 → 采购/销售/库存单位的换算率（对标 Oracle UOM Conversions / SAP 转换因子）
# 键: 唯一 (item_id, uom_id)。factor = 1 个 uom_id 折合多少个基本单位（或反向，一期由域约定；不塞进主表）

id: item_uom_conversion
name: 物料单位换算
table_name: item_uom_conversions
description: 物料单位换算（基本单位与其它单位的换算率）
parent_object: item
hierarchy:
  enabled: true
  parent_field: item_id

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true
    description: 技术主键
    semantics:
      meaning: 自增主键
      primary_key: true

  - id: item_id
    name: 物料
    type: integer
    db_column: item_id
    required: true
    description: 物料引用
    semantics:
      meaning: 所属物料
      display:
        type: association
        target_type: item
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: item
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} {name}"
        columns:
          - field: code
            label: 编码
            width: 140
          - field: name
            label: 名称
            width: 200
    ui:
      widget: select
      relation: item
      multiple: false

  - id: uom_id
    name: 换算单位
    type: integer
    db_column: uom_id
    required: true
    description: 换算目标单位引用
    semantics:
      meaning: 换算目标计量单位
      display:
        type: association
        target_type: uom
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: uom
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{name} ({code})"
        columns:
          - field: code
            label: 编码
            width: 120
          - field: name
            label: 名称
            width: 160
    ui:
      widget: select
      relation: uom
      multiple: false

  - id: factor
    name: 换算率
    type: float
    db_column: factor
    required: true
    description: 换算率（1 个换算单位折合的基本单位数）
    semantics:
      meaning: 单位换算系数
    ui:
      widget: input

  - id: description
    name: 备注
    type: text
    db_column: description
    nullable: true
    description: 换算说明
    semantics:
      meaning: 换算备注
    ui:
      widget: textarea

indexes:
  - fields: [item_id, uom_id]
    unique: true
    name: idx_item_uom_conv_unique
  - fields: [item_id]
    name: idx_item_uom_conv_item
  - fields: [uom_id]
    name: idx_item_uom_conv_uom

relations: []

ui_view_config:
  skip_auto_menu: true

nested:
  enabled: true
  parent: item
  children: []