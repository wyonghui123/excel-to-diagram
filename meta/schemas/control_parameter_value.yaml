# 控制参数取值 (Control Parameter Value) — 按维度给出的参数值
# 依据: sourcing_rule_assignments 的「维度 + 具体度 + 首命中」口径；
#       与 control_parameter_def 构成「参数名 + 参数值」两表。
# 定位: control_parameter_def 的附属明细（child_sections），不单独成菜单。
#
# 维度（全部可空，空 = 该维度通配）:
#   org_id / document_type_id / line_type_id / item_group_id
#
# 命中规则（实现见 meta/services/control_parameter_service.py）:
#   ① 行匹配 = 本例所有非空维度都等于调用方传入值（调用方缺某维度则含该维度的行不命中）；
#   ② 候选按 specificity_rank 升序、id 升序，首个命中获胜；
#   ③ 全不命中回落 control_parameter_def.default_value；
#   ④ 同一参数下「维度组合 + specificity_rank」必须唯一 —— 字段级约束表达不了
#      （SQLite 中 NULL 不参与唯一约束），由 guard 服务按 NULL 归一化后判重。
#
# 性能口径: 解析时一次装载全部 active 取值在内存匹配，不做逐行 SQL；
#           单据落库时把命中结果快照到单据行，执行不依赖配置后续变化。

id: control_parameter_value
name: 控制参数取值
table_name: control_parameter_values
description: 控制参数取值（按组织 / 单据类型 / 行类型 / 物料组的维度组合给出参数值）
parent_object: control_parameter_def
hierarchy:
  enabled: true
  parent_field: control_parameter_id

deletion_policy:
  mode: restrict
  restrict_on: []
  cascade_delete: []

audit:
  enabled: true
  create:
    enabled: true
    fields: all
  update:
    enabled: true
    fields: changed_only
    exclude: [id, created_at, updated_at]
  delete:
    enabled: true
    fields: business_only
    exclude: [id, created_at, updated_at]
  associate:
    enabled: true
  dissociate:
    enabled: true

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true
    description: 技术主键
    semantics:
      meaning: 自增主键
      primary_key: true

  # 父键推断依据（getParentIdField 取首个 ui.relation=control_parameter_def 的字段）
  - id: control_parameter_id
    name: 控制参数
    type: integer
    db_column: control_parameter_id
    required: true
    description: 所属控制参数
    semantics:
      meaning: 所属参数定义
      display:
        type: association
        target_type: control_parameter_def
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: control_parameter_def
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code}"
    ui:
      widget: select
      relation: control_parameter_def
      multiple: false

  - id: org_id
    name: 组织
    type: integer
    db_column: org_id
    nullable: true
    description: 按组织区分；空 = 所有组织通配
    semantics:
      meaning: 参数生效组织
      display:
        type: association
        target_type: org
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: org
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{name}"
    ui:
      widget: select
      relation: org
      multiple: false

  - id: document_type_id
    name: 单据类型
    type: integer
    db_column: document_type_id
    nullable: true
    description: 按销售单据类型区分；空 = 通配
    semantics:
      meaning: 参数生效的销售单据类型
      display:
        type: association
        target_type: document_type
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: document_type
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} {name}"
    ui:
      widget: select
      relation: document_type
      multiple: false

  - id: line_type_id
    name: 行类型
    type: integer
    db_column: line_type_id
    nullable: true
    description: 按销售行类型区分；空 = 通配
    semantics:
      meaning: 参数生效的销售行类型
      display:
        type: association
        target_type: line_type
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: line_type
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} {name}"
    ui:
      widget: select
      relation: line_type
      multiple: false

  - id: item_group_id
    name: 物料组
    type: integer
    db_column: item_group_id
    nullable: true
    description: 按物料组区分；空 = 通配
    semantics:
      meaning: 参数生效的物料组
      display:
        type: association
        target_type: item_group
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: item_group
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} {name}"
    ui:
      widget: select
      relation: item_group
      multiple: false

  - id: specificity_rank
    name: 具体度
    type: integer
    db_column: specificity_rank
    required: true
    default: 100
    description: 数小优先；越具体的行给越小值（与 sourcing_rule_assignment 同口径）
    constraints:
      - type: numeric_range
        gte: 0
        lte: 999
        decimal_places: 0
    semantics:
      meaning: 命中优先级（数小优先）
      hint: 例：通配 900，按物料组 300，按组织+单据类型 10
    ui:
      widget: input

  - id: value
    name: 参数值
    type: text
    db_column: value
    required: true
    description: 按参数定义的值类型解释（bool 存 true/false，ref 存目标主键）
    semantics:
      meaning: 参数取值（文本存储，按值类型解析）
    ui:
      widget: input

  - id: status
    name: 状态
    type: string
    db_column: status
    required: true
    default: active
    description: 停用后不参与解析
    enum_values:
      - value: active
        label: 启用
        color: success
        category: active
        is_initial: true
      - value: inactive
        label: 停用
        color: info
        category: inactive
    semantics:
      meaning: 取值启用状态
      filterable: true
      filter_type: enum
      filter_label: 状态
      filter_scope: local
    ui:
      widget: select

  - id: description
    name: 备注
    type: text
    db_column: description
    nullable: true
    description: 取值说明（为什么这条维度要这样配）
    semantics:
      meaning: 取值备注
    ui:
      widget: textarea

  - id: created_at
    name: 创建时间
    type: datetime
    db_column: created_at
    description: 创建时间
    semantics:
      meaning: 记录创建时间
      audit_field: true

indexes:
  - fields: [control_parameter_id]
    name: idx_control_parameter_value_param
  - fields: [control_parameter_id, specificity_rank]
    name: idx_control_parameter_value_rank

relations:
  - id: control_parameter_value_to_def
    name: 所属控制参数
    type: reference
    target: control_parameter_def
    source_field: control_parameter_id
    target_field: id
    cardinality: N:1
    description: 参数定义引用（删除定义时 restrict）
  - id: control_parameter_value_to_org
    name: 组织
    type: reference
    target: org
    source_field: org_id
    target_field: id
    cardinality: N:1
    description: 组织维度引用（可空）
  - id: control_parameter_value_to_doc_type
    name: 单据类型
    type: reference
    target: type_definition
    source_field: document_type_id
    target_field: id
    cardinality: N:1
    description: 单据类型维度引用（可空；指向 type_definitions 的 header 行）
  - id: control_parameter_value_to_line_type
    name: 行类型
    type: reference
    target: type_definition
    source_field: line_type_id
    target_field: id
    cardinality: N:1
    description: 行类型维度引用（可空；指向 type_definitions 的 line 行）
  - id: control_parameter_value_to_item_group
    name: 物料组
    type: reference
    target: item_group
    source_field: item_group_id
    target_field: id
    cardinality: N:1
    description: 物料组维度引用（可空）

ui_view_config:
  # 只作为控制参数详情的子表出现，不生成侧边栏菜单
  skip_auto_menu: true
  showChangeHistory: true
  list:
    detail_mode: drawer
    title: 参数取值
    description: 控制参数的维度取值
    columns:
      - field: org_id
        width: 160
        render_as: association
        target_type: org
        display_field: name
      - field: document_type_id
        width: 160
        render_as: association
        target_type: document_type
        display_field: name
      - field: line_type_id
        width: 140
        render_as: association
        target_type: line_type
        display_field: name
      - field: item_group_id
        width: 140
        render_as: association
        target_type: item_group
        display_field: name
      - field: specificity_rank
        width: 90
        type: number
        align: right
      - field: value
        width: 140
      - field: status
        width: 80
      - field: description
        width: 200
        type: ellipsis
    selection:
      enabled: true
      mode: multiple
    actions:
      - id: create
        label: 新增取值
        icon: plus
        type: primary
        permission: control_parameter_value:create
    defaultSort:
      field: specificity_rank
      order: asc

  form:
    title: 参数取值
    layout: vertical
    sections:
      - title: 维度
        columns:
          - fields: [org_id, document_type_id]
          - fields: [line_type_id, item_group_id]
      - title: 取值
        columns:
          - fields: [specificity_rank, value]
          - fields: [status]
      - title: 其他
        columns:
          - fields: [description]

  detail:
    layout: tabs
    title: 参数取值详情
    tabs:
      - id: basic
        label: 基本信息
        type: fields
        fields:
          - control_parameter_id
          - org_id
          - document_type_id
          - line_type_id
          - item_group_id
          - specificity_rank
          - value
          - status
          - description

category_config:
  create_permission: control_parameter_value:create
  update_permission: control_parameter_value:update
  delete_permission: control_parameter_value:delete
  owner_auto_permission: false
