# 客户区域分配（Territory Account Assignment）
# 依据: docs/superpowers/specs/2026-10-26-sales-territory-design.md
#       §4.4 对象 / §5 不变量 R-TER-6 / R-TER-7 / §6.1 主区域判定
#
# 定位: customer_account 的附属明细（child_sections），不单独成菜单。
#   一个客户可归属多个销售区域，按生效日期区分历史与当前归属；
#   订单创建时按本表判定带出 territory_id（§6.1 主区域优先 → priority → 最新生效）。
#
# 约束:
#   ① (customer_account_id, territory_id, effective_from) 唯一，防重复分配。
#   ② 同一客户在同一 effective_from 上至多一条主区域（R-TER-7，部分唯一索引）。
#      SQLite 的唯一索引把 NULL 视为互不相等，effective_from 为空的行不受此约束。
#   ③ 停用区域不影响既有分配，但不再被新的分配引用（R-TER-6，服务层校验）。
#   ④ assignment_source 一期只有 manual；rule / import 为后续自动分配预留值域。

id: territory_account_assignment
name: 客户区域分配
table_name: territory_account_assignments
description: 客户与销售区域的分配关系（按生效日期区分，可设主区域与优先级）
parent_object: customer_account
display_name_field: territory_id
aspects: [audit_aspect]

semantics:
  meaning: 客户区域分配
  category: core_entity
  aliases:
    - 客户区域
    - 客户区域分配
    - territory account assignment

deletion_policy:
  mode: restrict
  restrict_on: []
  cascade_delete: []

audit:
  enabled: true
  create:
    enabled: true
    fields: all
  update:
    enabled: true
    fields: changed_only
    exclude: [id, created_at, updated_at]
  delete:
    enabled: true
    fields: business_only
    exclude: [id, created_at, updated_at]
  associate:
    enabled: true
  dissociate:
    enabled: true

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true
    description: 技术主键
    semantics:
      meaning: 自增主键
      primary_key: true

  - id: customer_account_id
    name: 客户档案
    type: integer
    db_column: customer_account_id
    required: true
    description: 所属客户档案（真外键；UI 父面为客户档案详情）
    semantics:
      meaning: 所属客户档案引用
      display:
        type: association
        target_type: customer_account
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: customer_account
        value_field: id
        display_field: name
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{name}"
        columns:
          - field: name
            label: 客户档案
            width: 220
    ui:
      # 必须是 customer_account：child_sections 挂在客户档案详情下
      widget: select
      relation: customer_account
      multiple: false

  - id: territory_id
    name: 销售区域
    type: integer
    db_column: territory_id
    required: true
    description: 分配到的销售区域
    semantics:
      meaning: 销售区域引用
      display:
        type: association
        target_type: territory
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: territory
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        value_filter:
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dialog
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 区域编码
            width: 140
          - field: name
            label: 区域名称
            width: 220
    ui:
      widget: select
      relation: territory
      multiple: false

  - id: effective_from
    name: 生效日
    type: date
    db_column: effective_from
    nullable: true
    description: 生效起始日（含）；空表示立即生效
    semantics:
      meaning: 分配生效起始日
    ui:
      widget: date

  - id: effective_to
    name: 失效日
    type: date
    db_column: effective_to
    nullable: true
    description: 失效日（不含）；空表示长期有效
    semantics:
      meaning: 分配失效日
    ui:
      widget: date

  - id: is_primary
    name: 主区域
    type: boolean
    db_column: is_primary
    required: true
    default: false
    description: 主区域（同一客户同一生效日至多一个，R-TER-7）
    semantics:
      meaning: 主区域标记
      filterable: true
      filter_type: enum
      filter_label: 主区域
      filter_scope: local
    ui:
      widget: switch

  # 非主区域之间的覆盖顺序：数值小者优先；主区域恒优先于非主区域。
  # 空 = 视为最大（排最后），并列时按 effective_from 最新者优先（§6.1）。
  - id: priority
    name: 优先级
    type: integer
    db_column: priority
    nullable: true
    description: 非主区域间的覆盖顺序，数值小者优先；空表示排最后
    semantics:
      meaning: 区域分配优先级
      filterable: true
      filter_type: number
      filter_label: 优先级
      filter_scope: local
    ui:
      widget: number

  - id: assignment_source
    name: 分配来源
    type: string
    db_column: assignment_source
    required: true
    default: manual
    max_length: 16
    description: 分配来源（一期仅人工分配）
    enum_values:
      - value: manual
        label: 人工
        color: primary
        is_initial: true
      - value: rule
        label: 规则
        color: info
      - value: import
        label: 导入
        color: warning
    semantics:
      meaning: 分配来源
      filterable: true
      filter_type: enum
      filter_label: 分配来源
      filter_scope: local
    ui:
      widget: select

  - id: created_at
    name: 创建时间
    type: datetime
    db_column: created_at
    description: 创建时间
    semantics:
      meaning: 记录创建时间
      audit_field: true

  - id: updated_at
    name: 更新时间
    type: datetime
    db_column: updated_at
    description: 更新时间
    semantics:
      meaning: 记录更新时间
      audit_field: true

indexes:
  # 同一客户、同一区域、同一生效日只分配一次
  - fields: [customer_account_id, territory_id, effective_from]
    unique: true
    name: uq_taa_triple
  # 主区域：同一客户同一生效日至多一条（R-TER-7）
  - fields: [customer_account_id, effective_from]
    unique: true
    type: partial
    condition: "is_primary = 1"
    name: uq_taa_primary
  # 区域侧反查（按区域统计客户）与客户侧过滤
  - fields: [territory_id]
    name: idx_taa_territory
  - fields: [customer_account_id]
    name: idx_taa_customer

relations:
  - id: territory_account_to_customer
    name: 客户档案
    type: reference
    target: customer_account
    source_field: customer_account_id
    target_field: id
    cardinality: N:1
    description: 所属客户档案引用（真外键）
  - id: territory_account_to_territory
    name: 销售区域
    type: reference
    target: territory
    source_field: territory_id
    target_field: id
    cardinality: N:1
    description: 销售区域引用（真外键）

ui_view_config:
  # 作为客户档案详情页的子表，不单独成菜单
  skip_auto_menu: true
  list:
    detail_mode: drawer
    title: 客户区域分配
    columns:
      - field: territory_id
        width: 220
        render_as: association
        target_type: territory
        display_field: name
      - field: effective_from
        width: 120
      - field: effective_to
        width: 120
      - field: is_primary
        width: 100
      - field: priority
        width: 100
      - field: assignment_source
        width: 110
    defaultSort:
      field: effective_from
      order: desc
  form:
    title: 客户区域分配
    layout: vertical
    sections:
      - title: 基本信息
        columns:
          - fields: [territory_id]
          - fields: [is_primary, priority]
      - title: 有效期与来源
        columns:
          - fields: [effective_from, effective_to]
          - fields: [assignment_source]
