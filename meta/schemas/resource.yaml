# 资源主体（Resource）—— 统一资源模型 P2a / FR-001
# 依据: docs/specs/spec-unified-resource-model-2026-11-01-v1.0.md
#       §FR-001 / §9.3 数据模型表
#
# 定位: 一个资源代表可被占用、调度、消耗的主体（人 / 设备 / 车辆 / 工具 /
#   场地 / 站点 / 外协）。人直接作为可调度资源，不以 user 作主键。
#
# 口径:
#   ① code 全局唯一，^[A-Z][A-Z0-9_]*$。
#   ② resource_kind=external 时 party_id 必填（服务层校验）。
#   ③ 删除被 resource_group_member / resource_capability / resource_rate
#      引用的资源被拒绝（restrict）。
#   ④ cost_center_id 暂为纯整数引用：平台尚无 cost_center 主数据（TBD-8）。

id: resource
name: 资源
table_name: resources
description: 资源主数据——可被占用、调度、消耗的主体（人/设备/车辆/工具/场地/站点/外协）
display_name_field: name
aspects: [audit_aspect]

semantics:
  meaning: 资源主体
  category: core_entity
  aliases:
    - 资源
    - 资源主数据
    - 可调度对象
    - resource

deletion_policy:
  mode: restrict
  restrict_on:
    - table: resource_group_members
      foreign_key: resource_id
      message: 该资源仍是资源组成员，请先移出成员后再删除
    - table: resource_capabilities
      foreign_key: resource_id
      message: 该资源仍有能力记录，请先处理能力后再删除
    - table: resource_rates
      foreign_key: resource_id
      message: 该资源仍有费率记录，请先处理费率后再删除
    - table: operation_resource_requirements
      foreign_key: resource_id
      message: 该资源仍被工序资源要求引用，请先处理资源要求后再删除
    - table: resource_capacities
      foreign_key: resource_id
      message: 该资源仍有产能记录，请先处理产能后再删除
    - table: resource_assignments
      foreign_key: resource_id
      message: 该资源仍有分配记录，请先处理分配后再删除
    - table: resource_territory_assignments
      foreign_key: resource_id
      message: 该资源仍有区域覆盖记录，请先处理区域分配后再删除
    - table: resource_availabilities
      foreign_key: resource_id
      message: 该资源仍有可用性例外记录，请先处理例外后再删除
  cascade_delete: []

audit:
  enabled: true
  create:
    enabled: true
    fields: all
  update:
    enabled: true
    fields: changed_only
    exclude: [id, created_at, updated_at]
  delete:
    enabled: true
    fields: business_only
    exclude: [id, created_at, updated_at]
  associate:
    enabled: true
  dissociate:
    enabled: true

org_scope:
  mode: direct
  field: org_id
  write_check: true

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true
    description: 技术主键
    semantics:
      meaning: 自增主键
      primary_key: true

  - id: code
    name: 资源编码
    type: string
    db_column: code
    required: true
    unique: true
    max_length: 40
    pattern: "^[A-Z][A-Z0-9_]*$"
    description: 资源编码（全局唯一）
    semantics:
      meaning: 资源业务代码
      business_key: true
      pattern: "^[A-Z][A-Z0-9_]*$"
      data_category: code
      searchable: true
    ui:
      widget: input
      fieldGroup: 基本信息
      fieldGroupPosition: 10

  - id: name
    name: 资源名称
    type: string
    db_column: name
    required: true
    max_length: 128
    description: 资源名称
    semantics:
      meaning: 资源显示名称
      display_name: true
      data_category: text
      searchable: true
    ui:
      widget: input
      fieldGroup: 基本信息
      fieldGroupPosition: 20

  - id: resource_kind
    name: 资源类型
    type: string
    db_column: resource_kind
    required: true
    default: person
    description: 资源类型（人/设备/车辆/工具/场地/站点/外协）
    enum_values:
      - value: person
        label: 人员
        color: primary
        is_initial: true
      - value: machine
        label: 设备
        color: success
      - value: vehicle
        label: 车辆
        color: info
      - value: tool
        label: 工具
        color: warning
      - value: facility
        label: 场地
        color: purple
      - value: site
        label: 站点
        color: cyan
      - value: external
        label: 外协
        color: danger
    value_help:
      source:
        type: enum
        enum_type_id: resource_kind
        sort_by: sort_order
      behavior:
        validation: true
        binding_strength: strict
        multiple: false
      presentation:
        result_type: dropdown
    semantics:
      meaning: 资源类型
      filterable: true
      filter_type: enum
      filter_label: 资源类型
      filter_scope: local
    ui:
      widget: select
      fieldGroup: 基本信息
      fieldGroupPosition: 30

  - id: resource_role
    name: 资源角色
    type: string
    db_column: resource_role
    nullable: true
    max_length: 64
    description: 资源角色（如 worker / driver / advisor）
    semantics:
      meaning: 资源在业务中的角色
      data_category: text
    ui:
      widget: input
      fieldGroup: 基本信息
      fieldGroupPosition: 40

  - id: org_id
    name: 归属组织
    type: integer
    db_column: org_id
    nullable: true
    description: 归属组织；空表示共享资源
    semantics:
      meaning: 归属组织引用
      display:
        type: association
        target_type: org
        display_field: name
        placeholder: "共享资源"
    value_help:
      source:
        type: bo
        target_bo: org
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dialog
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 组织编码
            width: 140
          - field: name
            label: 组织名称
            width: 220
    ui:
      widget: select
      relation: org
      multiple: false
      clearable: true
      fieldGroup: 归属
      fieldGroupPosition: 50

  - id: location_id
    name: 所在地点
    type: integer
    db_column: location_id
    nullable: true
    description: 所在地点；空表示移动资源
    semantics:
      meaning: 地点引用
      display:
        type: association
        target_type: location
        display_field: name
        placeholder: "移动资源"
    value_help:
      source:
        type: bo
        target_bo: location
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dialog
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 地点编码
            width: 140
          - field: name
            label: 地点名称
            width: 220
    ui:
      widget: select
      relation: location
      multiple: false
      clearable: true
      fieldGroup: 归属
      fieldGroupPosition: 60

  # 成本归集：平台暂无 cost_center 主数据（TBD-8），保留纯整数引用
  - id: cost_center_id
    name: 成本中心
    type: integer
    db_column: cost_center_id
    nullable: true
    description: 成本中心ID（平台暂无 cost_center 主数据，暂为纯整数引用）
    semantics:
      meaning: 成本归集中心
    ui:
      widget: number
      fieldGroup: 归属
      fieldGroupPosition: 70

  - id: party_id
    name: 关联交易主体
    type: integer
    db_column: party_id
    nullable: true
    description: 外协/个人关联的交易主体；resource_kind=external 时必填
    semantics:
      meaning: 交易主体引用
      display:
        type: association
        target_type: party
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: party
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dialog
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 主体编码
            width: 150
          - field: name
            label: 主体名称
            width: 220
    ui:
      widget: select
      relation: party
      multiple: false
      clearable: true
      fieldGroup: 身份
      fieldGroupPosition: 80

  - id: person_ref
    name: 人员档案
    type: integer
    db_column: person_ref
    nullable: true
    description: 人员资源指向 person_profile（与 user 解耦）
    semantics:
      meaning: 人员档案引用
      display:
        type: association
        target_type: person_profile
        display_field: mobile
    value_help:
      source:
        type: bo
        target_bo: person_profile
        value_field: id
        display_field: mobile
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dialog
        display_format: "{id} - {mobile}"
        columns:
          - field: id
            label: 档案ID
            width: 120
          - field: mobile
            label: 手机号
            width: 160
    ui:
      widget: select
      relation: person_profile
      multiple: false
      clearable: true
      fieldGroup: 身份
      fieldGroupPosition: 90

  - id: capacity_uom_id
    name: 产能单位
    type: integer
    db_column: capacity_uom_id
    nullable: true
    description: 主产能计量单位（引用 uom，限定 TIME / COUNT 组）
    semantics:
      meaning: 主产能口径单位
      display:
        type: association
        target_type: uom
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: uom
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 单位编码
            width: 140
          - field: name
            label: 单位名称
            width: 180
    ui:
      widget: select
      relation: uom
      multiple: false
      clearable: true
      fieldGroup: 产能
      fieldGroupPosition: 100

  - id: capacity_per_day
    name: 日产能
    type: number
    db_column: capacity_per_day
    nullable: true
    description: 单日产能（按 capacity_uom_id 计量）
    semantics:
      meaning: 日产能
    ui:
      widget: number
      fieldGroup: 产能
      fieldGroupPosition: 110

  - id: capacity_units
    name: 资源单元数
    type: number
    db_column: capacity_units
    required: true
    default: 1
    description: 同类资源的可用单元数（默认 1）
    constraints:
      - type: numeric_range
        gt: 0
        decimal_places: 0
    semantics:
      meaning: 同类资源单元数
    ui:
      widget: number
      fieldGroup: 产能
      fieldGroupPosition: 120

  - id: utilization_pct
    name: 利用率（%）
    type: number
    db_column: utilization_pct
    required: true
    default: 100
    description: 利用率（默认 100，可 >100 表示加班）
    semantics:
      meaning: 产能利用率百分比
    ui:
      widget: number
      fieldGroup: 产能
      fieldGroupPosition: 130

  - id: calendar_id
    name: 可用日历
    type: integer
    db_column: calendar_id
    nullable: true
    description: 可用性日历；空表示继承资源组/地点/组织
    semantics:
      meaning: 可用日历引用
      display:
        type: association
        target_type: calendar
        display_field: name
        placeholder: "继承上级日历"
    value_help:
      source:
        type: bo
        target_bo: calendar
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dialog
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 日历编码
            width: 140
          - field: name
            label: 日历名称
            width: 220
    ui:
      widget: select
      relation: calendar
      multiple: false
      clearable: true
      fieldGroup: 可用性
      fieldGroupPosition: 140

  - id: timezone
    name: 时区
    type: string
    db_column: timezone
    nullable: true
    max_length: 64
    description: 时区（服务跨时区必需；空表示继承组织）
    semantics:
      meaning: 资源时区
      data_category: text
    ui:
      widget: input
      fieldGroup: 可用性
      fieldGroupPosition: 150

  - id: is_active
    name: 启用
    type: boolean
    db_column: is_active
    required: true
    default: true
    description: 是否启用
    semantics:
      meaning: 启用状态
      filterable: true
      filter_type: enum
      filter_label: 启用
      filter_scope: local
    ui:
      widget: switch
      fieldGroup: 基本信息
      fieldGroupPosition: 160

  - id: valid_from
    name: 有效期起
    type: date
    db_column: valid_from
    nullable: true
    description: 有效期起始日（含）；空表示立即有效
    semantics:
      meaning: 资源有效期起始日
    ui:
      widget: date
      fieldGroup: 可用性
      fieldGroupPosition: 170

  - id: valid_to
    name: 有效期止
    type: date
    db_column: valid_to
    nullable: true
    description: 有效期截止日（不含）；空表示长期有效
    semantics:
      meaning: 资源有效期截止日
    ui:
      widget: date
      fieldGroup: 可用性
      fieldGroupPosition: 180

  - id: description
    name: 描述
    type: text
    db_column: description
    nullable: true
    max_length: 255
    description: 说明
    semantics:
      meaning: 资源说明
      searchable: true
    ui:
      widget: textarea
      fieldGroup: 其他
      fieldGroupPosition: 190

  - id: created_at
    name: 创建时间
    type: datetime
    db_column: created_at
    description: 创建时间
    semantics:
      meaning: 记录创建时间
      audit_field: true

  - id: updated_at
    name: 更新时间
    type: datetime
    db_column: updated_at
    description: 更新时间
    semantics:
      meaning: 记录更新时间
      audit_field: true

indexes:
  - fields: [code]
    unique: true
    name: uq_resource_code
  - fields: [resource_kind]
    name: idx_resource_kind
  - fields: [org_id]
    name: idx_resource_org
  - fields: [location_id]
    name: idx_resource_location
  - fields: [party_id]
    name: idx_resource_party
  - fields: [person_ref]
    name: idx_resource_person
  - fields: [is_active]
    name: idx_resource_active

relations:
  - id: resource_to_org
    name: 归属组织
    type: reference
    target: org
    source_field: org_id
    target_field: id
    cardinality: N:1
    description: 归属组织引用（可空；真外键）
  - id: resource_to_location
    name: 所在地点
    type: reference
    target: location
    source_field: location_id
    target_field: id
    cardinality: N:1
    description: 地点引用（可空；真外键）
  - id: resource_to_party
    name: 关联交易主体
    type: reference
    target: party
    source_field: party_id
    target_field: id
    cardinality: N:1
    description: 交易主体引用（可空；真外键）
  - id: resource_to_person_profile
    name: 人员档案
    type: reference
    target: person_profile
    source_field: person_ref
    target_field: id
    cardinality: N:1
    description: 人员档案引用（可空；真外键）
  - id: resource_to_uom
    name: 产能单位
    type: reference
    target: uom
    source_field: capacity_uom_id
    target_field: id
    cardinality: N:1
    description: 产能单位引用（可空；真外键）
  - id: resource_to_calendar
    name: 可用日历
    type: reference
    target: calendar
    source_field: calendar_id
    target_field: id
    cardinality: N:1
    description: 可用日历引用（可空；真外键）

ui_view_config:
  # 菜单由迁移 v175 手工声明（挂 master-data），不让自动生成器产出孤儿行
  skip_auto_menu: true
  list:
    detail_mode: drawer
    title: 资源
    columns:
      - field: code
        width: 150
        sortable: true
      - field: name
        width: 200
        sortable: true
      - field: resource_kind
        width: 110
        filterable: true
        filter_type: select
      - field: resource_role
        width: 120
      - field: org_id
        width: 160
        filterable: true
        filter_type: value_help
        render_as: association
        target_type: org
        display_field: name
      - field: location_id
        width: 160
        filterable: true
        filter_type: value_help
        render_as: association
        target_type: location
        display_field: name
      - field: capacity_per_day
        width: 110
      - field: capacity_units
        width: 100
      - field: utilization_pct
        width: 100
      - field: is_active
        width: 90
        filterable: true
        filter_type: select
    selection:
      enabled: true
      mode: multiple
    searchFields: [code, name]
    actions:
      - id: create
        label: 新建资源
        icon: plus
        type: primary
        permission: resource:resource_create
    defaultSort:
      field: code
      order: asc
  form:
    title: 资源
    layout: vertical
    sections:
      - title: 基本信息
        columns:
          - fields: [code, name]
          - fields: [resource_kind, resource_role]
          - fields: [is_active]
      - title: 归属
        columns:
          - fields: [org_id, location_id]
          - fields: [cost_center_id, party_id]
          - fields: [person_ref]
      - title: 产能与可用性
        columns:
          - fields: [capacity_uom_id, capacity_per_day]
          - fields: [capacity_units, utilization_pct]
          - fields: [calendar_id, timezone]
          - fields: [valid_from, valid_to]
      - title: 其他
        columns:
          - fields: [description]
  detail:
    layout: tabs
    title: "{record.name} 详情"
    tabs:
      - id: basic
        label: 基本信息
        type: fields
        fields: [code, name, resource_kind, resource_role, org_id, location_id,
                 cost_center_id, party_id, person_ref, capacity_uom_id,
                 capacity_per_day, capacity_units, utilization_pct, calendar_id,
                 timezone, is_active, valid_from, valid_to, description]

category_config:
  create_permission: resource:resource_create
  update_permission: resource:resource_update
  delete_permission: resource:resource_delete
  owner_auto_permission: false
