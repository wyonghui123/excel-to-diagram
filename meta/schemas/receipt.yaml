# 收货单头 (Receipt) — M3 第二阶段
# 依据: docs/specs/spec-receipt-object-model-2026-11-01.md §2 / §3 / §5 / §6 / §7 / §12
#
# 定位: 采购域收货事实单据（收货单头）。行见 receipt_line；
#       行唯一挂载点是 purchase_order_schedules（到货计划行），不直接挂 PO 行。
#
# 与销售侧 shipment 的统一骨架（spec §2 M1-M11）:
#   ① 头 + 行两表；行不单独成菜单。
#   ② 业务键 receipt_no，按 document_type.number_sequence_id 取号（R-RC-8：
#      取号在开事务之前完成），生成后不可改，允许跳号。
#   ③ 单据类型由切面 document_type_aspect 提供；头类型
#      scope_bo='receipt' + level='header'；document_category ∈ {standard, return}。
#   ④ 状态机 draft → posted → reversed / cancelled（采购以「过账」为核心事件）。
#   ⑤ 收货不落金额（D-RC-9）；金额以 PO 快照 + 发票为准。
#   ⑥ 收货写需求分配（target_bo='receipt'），这是与销售侧唯一的结构性差异（M11）。
#
# 过账副作用（唯一写入口 receipt_service.post，spec §6）:
#   ① 校验全部不变量；② 拆 demand_allocation；③ 条件 UPDATE 原子累加计划行
#   received_qty / rejected_qty；④ 调 PurchaseOrderFulfillmentService.recompute_order；
#   ⑤ 头 / 行置 posted；⑥ 审计。整单单事务，任一步失败全回滚。
#
# 服务层不变量（R-RC-0 ~ R-RC-18，由 receipt_guard_service / receipt_service 强制）:
#   R-RC-0  document_type_id 须 scope_bo='receipt' + level='header'；
#           document_category='return' 时 reversal_of_receipt_id 必填
#   R-RC-1  PO 来源行 schedule_id 必填，计划行 schedule_kind ∈ {delivery, service}、
#           状态 ∈ {planned, confirmed}；已短收结案的计划行禁止再收（R-RC-17）
#   R-RC-3  qty_received > 0；0 <= qty_rejected <= qty_received
#   R-RC-5  计划行净收累计不得超过 promised_qty × (1 + 容差)；容差取控制参数
#           receipt_over_tolerance_percent（默认 0），不硬编码
#   R-RC-6  posted 后行数量 / 计划行 / 行号 / 批次序列禁止修改；只能整单红冲
#   R-RC-11 收货不修改 PO 金额 / 单价 / 税率 / 汇率
#   R-RC-13 草稿删除级联行；posted / reversed 禁止删除

id: receipt
name: 收货单
table_name: receipts
description: 收货单头（收货行见 receipt_line）
display_name_field: receipt_no
aspects: [audit_aspect, document_type_aspect]

semantics:
  meaning: 收货单
  category: business_document
  business_key: [receipt_no]
  display_name_field: receipt_no
  aliases:
    - 收货单
    - 收货凭证
    - 入库单
    - Receipt
    - Goods Receipt

deletion_policy:
  # 事实单据：非草稿禁止删除（守卫拦截器强制度）；草稿删除时级联清行
  mode: restrict
  restrict_on: []
  cascade_delete:
    - receipt_lines

audit:
  enabled: true
  create:
    enabled: true
    fields: all
  update:
    enabled: true
    fields: changed_only
    exclude:
      - id
      - created_at
      - updated_at
      - reversed_at
  delete:
    enabled: true
    fields: business_only
    exclude:
      - id
      - created_at
      - updated_at
  associate:
    enabled: true
  dissociate:
    enabled: true

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true
    description: 技术主键
    semantics:
      meaning: 自增主键
      primary_key: true

  # 取号由平台按「单据类型 → number_sequence_id」完成（R-RC-8），生成后不可改
  - id: receipt_no
    name: 收货单号
    type: string
    db_column: receipt_no
    required: true
    unique: true
    max_length: 30
    description: 收货单号（业务键，取号生成后不可修改）
    semantics:
      meaning: 收货单业务编号
      business_key: true
      immutable: true
      data_category: code
      searchable: true
    ui:
      widget: input
      editable: false

  # 单据类型由切面 document_type_aspect 提供（T-D20）：
  # 字段 document_type_id → type_definitions 的 header 行，承载编号 / 打印 / 权限等
  # 治理语义；方向由 document_category（standard / return）表达。

  - id: receipt_date
    name: 收货日期
    type: date
    db_column: receipt_date
    required: true
    description: 收货业务日期；取号日期段基准
    semantics:
      meaning: 收货业务日期
      filterable: true
      filter_type: date
      filter_label: 收货日期
      filter_scope: local
    ui:
      widget: date

  - id: actual_arrival_date
    name: 实际到达时间
    type: datetime
    db_column: actual_arrival_date
    nullable: true
    description: 实际到达时间（过账时可补；与 receipt_date 不同口径）
    semantics:
      meaning: 货物实际到达时间
      filterable: true
      filter_type: date
      filter_label: 实际到达时间
      filter_scope: local
    ui:
      widget: datetime

  # 收货单全系统只建一个，按来源单据类型复用（D-RC-1 / T-D12）
  - id: source_doc_type
    name: 来源单据类型
    type: string
    db_column: source_doc_type
    required: true
    max_length: 30
    description: 来源单据类型（purchase_order / transfer_order / work_order / sales_return / intercompany）
    enum_values:
      - value: purchase_order
        label: 采购订单
        color: primary
        category: active
        is_initial: true
      - value: transfer_order
        label: 调拨单
        color: info
        category: active
      - value: work_order
        label: 工单
        color: warning
        category: active
      - value: sales_return
        label: 销售退货
        color: danger
        category: active
      - value: intercompany
        label: 公司间交易
        color: info
        category: active
    semantics:
      meaning: 收货来源单据类型（决定行挂载点）
      filterable: true
      filter_type: enum
      filter_label: 来源类型
      filter_scope: local
    ui:
      widget: select

  - id: source_doc_id
    name: 来源单据
    type: integer
    db_column: source_doc_id
    required: true
    description: 来源单据头 id（多态，按 source_doc_type 解释；PO 来源 = purchase_orders.id）
    semantics:
      meaning: 来源单据头引用（多态）
      filterable: true
      filter_type: number
      filter_label: 来源单据
      filter_scope: local

  - id: source_doc_no
    name: 来源单号快照
    type: string
    db_column: source_doc_no
    nullable: true
    max_length: 40
    description: 来源单号快照（展示 / 打印用，不参与校验）
    semantics:
      meaning: 来源单号快照
      searchable: true
      data_category: code
    ui:
      widget: input
      editable: false

  # PO 来源创建时必填；非 PO 来源可空（过账时按 R-PO-8 同口径校验 vendor 关系）
  - id: supplier_party_id
    name: 供应商
    type: integer
    db_column: supplier_party_id
    nullable: true
    description: 供应商往来单位（PO 来源必填；须具备有效 vendor 关系）
    semantics:
      meaning: 收货供应商
      display:
        type: association
        target_type: party
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: party
        value_field: id
        display_field: name
        code_field: name
        apply_target_permissions: true
        value_filter:
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{name}"
        columns:
          - field: name
            label: 供应商
            width: 220
    ui:
      widget: select
      relation: party
      multiple: false
      clearable: true

  - id: supplier_delivery_no
    name: 供应商送货单号
    type: string
    db_column: supplier_delivery_no
    nullable: true
    max_length: 40
    description: 供应商送货单号（对账 / 三单匹配辅助键）
    semantics:
      meaning: 供应商送货单号
      searchable: true
      data_category: code
    ui:
      widget: input

  - id: org_id
    name: 收货方法人
    type: integer
    db_column: org_id
    required: true
    description: 收货方法人 / 财务归属（取 PO 头 org_id；非 PO 来源按来源推导）
    semantics:
      meaning: 收货单的业务实体
      display:
        type: association
        target_type: org
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: org
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        value_filter:
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 组织编码
            width: 140
          - field: name
            label: 组织名称
            width: 220
    ui:
      widget: select
      relation: org
      multiple: false

  - id: purchase_org_id
    name: 采购组织快照
    type: integer
    db_column: purchase_org_id
    nullable: true
    description: 采购组织快照（取 PO 头；报表维度）
    semantics:
      meaning: 收货单的采购组织快照
      display:
        type: association
        target_type: org
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: org
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        value_filter:
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 组织编码
            width: 140
          - field: name
            label: 组织名称
            width: 220
    ui:
      widget: select
      relation: org
      multiple: false
      clearable: true

  - id: deliver_to_location_id
    name: 收货地点
    type: integer
    db_column: deliver_to_location_id
    nullable: true
    description: 默认收货地点（空 = 取计划行 / 行；行级 putaway 可覆盖）
    semantics:
      meaning: 收货单收货地点
      display:
        type: association
        target_type: location
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: location
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        value_filter:
          location_type: site
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} {name}"
        columns:
          - field: code
            label: 位置编码
            width: 140
          - field: name
            label: 位置名称
            width: 200
    ui:
      widget: select
      relation: location
      multiple: false
      clearable: true

  - id: project_id
    name: 项目
    type: integer
    db_column: project_id
    nullable: true
    description: 整单归集项目（取 PO 头；可空）
    semantics:
      meaning: 收货单所属项目
      display:
        type: association
        target_type: project
        display_field: name
        placeholder: "未归集"
    value_help:
      source:
        type: bo
        target_bo: project
        value_field: id
        display_field: name
        code_field: project_no
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{project_no} {name}"
        columns:
          - field: project_no
            label: 项目编号
            width: 140
          - field: name
            label: 项目名称
            width: 200
    ui:
      widget: select
      relation: project
      multiple: false
      clearable: true

  - id: received_by
    name: 收货人
    type: string
    db_column: received_by
    nullable: true
    max_length: 80
    description: 收货人姓名快照（PII，不进审计）
    semantics:
      meaning: 收货人姓名快照
      searchable: true
    ui:
      widget: input

  - id: status
    name: 状态
    type: string
    db_column: status
    required: true
    default: draft
    max_length: 20
    description: 收货单状态（草稿 / 已过账 / 已冲销 / 已取消）
    enum_values:
      - value: draft
        label: 草稿
        color: info
        category: draft
        is_initial: true
      - value: posted
        label: 已过账
        color: success
        category: active
      - value: reversed
        label: 已冲销
        color: danger
        category: inactive
      - value: cancelled
        label: 已取消
        color: info
        category: inactive
    semantics:
      meaning: 收货单状态
      filterable: true
      filter_type: enum
      filter_label: 状态
      filter_scope: local
    ui:
      widget: select

  # 红字单必填（D-RC-4 / D-RC-14：整单红冲，数量保持正数、净量为负向贡献）
  - id: reversal_of_receipt_id
    name: 冲销原单
    type: integer
    db_column: reversal_of_receipt_id
    nullable: true
    description: 红字收货单指向的原收货单（document_category='return' 时必填）
    semantics:
      meaning: 被冲销的原收货单
      display:
        type: association
        target_type: receipt
        display_field: receipt_no
    ui:
      widget: select
      relation: receipt
      multiple: false
      clearable: true

  - id: reversed_at
    name: 被冲销时间
    type: datetime
    db_column: reversed_at
    nullable: true
    description: 原单被整单冲销的时间（由冲销服务回写）
    semantics:
      meaning: 被冲销时间
      audit_field: true
    ui:
      widget: datetime
      editable: false

  - id: remark
    name: 备注
    type: string
    db_column: remark
    nullable: true
    max_length: 500
    description: 备注
    semantics:
      meaning: 收货单备注
      data_category: text
    ui:
      widget: textarea
      rows: 2

  - id: created_at
    name: 创建时间
    type: datetime
    db_column: created_at
    description: 创建时间
    semantics:
      meaning: 记录创建时间
      audit_field: true

  - id: updated_at
    name: 更新时间
    type: datetime
    db_column: updated_at
    description: 更新时间
    semantics:
      meaning: 记录更新时间
      audit_field: true

# 状态机（spec §5.1）：draft → posted → reversed；draft 可 cancelled。
# 三段均带跨表副作用，由 receipt_service 执行（receipt_guard_interceptor 委托），
# 不走裸 PUT status（避免绕过计划行回写与分配拆分）。
rules:
  - id: post_receipt
    name: 过账
    type: state_transition
    state_field: status
    from_states: [draft]
    to_state: posted
    triggers: [before_update]
    ui_hints:
      label: 过账
      icon: check_circle
      highlight: true
      confirm_message: "过账后数量不可修改，只能整单红冲，确定过账吗？"

  - id: cancel_receipt
    name: 取消收货单
    type: state_transition
    state_field: status
    from_states: [draft]
    to_state: cancelled
    triggers: [before_update]
    ui_hints:
      label: 取消
      icon: close
      confirm_message: "取消后收货单与收货行一并作废，确定取消吗？"

  - id: reverse_receipt
    name: 冲销
    type: state_transition
    state_field: status
    from_states: [posted]
    to_state: reversed
    triggers: [before_update]
    ui_hints:
      label: 冲销
      icon: cancel
      confirm_message: "冲销将生成红字收货单并回退计划行已收量，确定冲销吗？"

indexes:
  - fields: [receipt_no]
    unique: true
    name: uq_receipt_no
  # 来源多态查询：按来源单据反查其收货
  - fields: [source_doc_type, source_doc_id]
    name: idx_receipt_source
  - fields: [status, receipt_date]
    name: idx_receipt_status_date
  - fields: [supplier_party_id]
    name: idx_receipt_supplier
  - fields: [reversal_of_receipt_id]
    name: idx_receipt_reversal
  - fields: [project_id]
    name: idx_receipt_project

relations:
  - id: receipt_to_document_type
    name: 单据类型
    type: reference
    target: type_definition
    source_field: document_type_id
    target_field: id
    cardinality: N:1
    description: 收货单单据类型引用（真外键，限定 header 层）
  - id: receipt_to_supplier
    name: 供应商
    type: reference
    target: party
    source_field: supplier_party_id
    target_field: id
    cardinality: N:1
    description: 供应商往来单位引用（可空）
  - id: receipt_to_org
    name: 业务实体
    type: reference
    target: org
    source_field: org_id
    target_field: id
    cardinality: N:1
    description: 收货方法人引用（真外键）
  - id: receipt_to_location
    name: 收货地点
    type: reference
    target: location
    source_field: deliver_to_location_id
    target_field: id
    cardinality: N:1
    description: 收货地点引用（可空）
  - id: receipt_to_project
    name: 项目
    type: reference
    target: project
    source_field: project_id
    target_field: id
    cardinality: N:1
    description: 项目引用（可空）
  - id: receipt_to_reversal
    name: 冲销原单
    type: reference
    target: receipt
    source_field: reversal_of_receipt_id
    target_field: id
    cardinality: N:1
    description: 红字单 → 原单自引用（可空）

ui_view_config:
  # 菜单由 v186 / v187 迁移手工声明（procurement / goods-receipt-management）
  skip_auto_menu: true
  showChangeHistory: true
  list:
    detail_mode: page
    title: 收货单
    description: 收货单（草稿 / 已过账 / 已冲销 / 已取消）。「已过账」表示业务事实已确认，
      库存台账尚未启用（不写「已入库」）。
    columns:
      - field: receipt_no
        width: 180
        sortable: true
      - field: receipt_date
        width: 120
        format: date
        sortable: true
      - field: source_doc_no
        width: 160
      - field: supplier_party_id
        width: 200
      - field: org_id
        width: 160
      - field: purchase_org_id
        width: 160
      - field: deliver_to_location_id
        width: 160
      - field: actual_arrival_date
        width: 150
      - field: status
        width: 100
        filterable: true
        filter_type: select
    selection:
      enabled: true
      mode: multiple
    searchFields:
      - receipt_no
      - supplier_delivery_no
      - source_doc_no
    actions:
      - id: create
        label: 新建收货单
        icon: plus
        type: primary
        permission: receipt:receipt_create
      - id: export
        label: 导出
        icon: download
        type: default
    defaultSort:
      field: receipt_date
      order: desc
  form:
    title: 收货单信息
    layout: vertical
    sections:
      - title: 基本信息
        columns:
          - fields: [receipt_no, document_type_id]
          - fields: [receipt_date, status]
      - title: 来源
        columns:
          - fields: [source_doc_type, source_doc_id]
          - fields: [source_doc_no, supplier_delivery_no]
          - fields: [supplier_party_id]
      - title: 组织与地点
        columns:
          - fields: [org_id, purchase_org_id]
          - fields: [deliver_to_location_id, project_id]
      - title: 其他
        columns:
          - fields: [actual_arrival_date, received_by]
          - fields: [remark]

  # 行子表：父字段由 ui.relation=receipt 推断
  # demand_allocation 是多态分配表（target_id 指向任意载体），无单一父字段，
  # 不放入 child_sections（与 PO spec D-PO-23 同口径）。
  child_sections:
    - child_object: receipt_line
      title: 收货行
      display: tab
      pageSize: 10
      useMetaList: true
      enableDetail: true
      enableAutoCrud: true
