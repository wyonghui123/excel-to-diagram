# 计量单位主数据 (UoM) — foundation 步 1 · item 族引用基础
# 依据: docs/superpowers/specs/2026-10-04-foundation-object-model-and-architecture.md §3.4.2 / §7 步 1
#       docs/superpowers/specs/2026-10-03-item-structure-and-attribute-list-plan.md §4.3
#       docs/superpowers/specs/2026-10-24-uom-group-tier-upgrade/spec.md §3.3（两层模型改造）
# 定位: item.base_uom / purchase_uom / sales_uom 与两层换算（uom_conversion / item_uom_conversion）的引用前提
# [两层模型 2026-10-24] 原 uom_type 枚举由 uom_group_id 取代 —— 「类」升级为独立主对象
#   uom_group（含组基本单位 base_uom_id 与组内换算 uom_conversion）。
#   注: uom_type 物理列因平台不支持删列而残留于 uoms 表（drift 已容忍），YAML 不再声明、不再读写。

id: uom
name: 计量单位
table_name: uoms
description: 计量单位主数据（基础最小集）
display_name_field: name
aspects: [audit_aspect]

semantics:
  meaning: 计量单位
  category: core_entity
  business_key: [code]
  display_name_field: name
  aliases:
    - 计量单位
    - 单位
    - UoM
    - uom

deletion_policy:
  # S19: 主数据禁止物理删除; 被 item.base_uom / 单位换算引用时 restrict
  mode: restrict
  restrict_on:
    - table: items
      foreign_key: base_uom
      message: 该单位被物料用作基本计量单位，请先调整相关物料后再删除
    - table: item_uom_conversions
      foreign_key: uom_id
      message: 该单位存在物料单位换算记录，请先删除换算记录后再删除
    - table: uom_conversions
      foreign_key: uom_id
      message: 该单位存在组内标准换算记录，请先删除换算记录后再删除
    - table: uom_groups
      foreign_key: base_uom_id
      message: 该单位是计量单位组的基本单位，请先更换组基本单位后再删除
    - table: sales_order_lines
      foreign_key: uom_id
      message: 该单位被销售订单行引用，请先处理订单后再删除
  cascade_delete: []

audit:
  enabled: true
  create:
    enabled: true
    fields: all
  update:
    enabled: true
    fields: changed_only
    exclude:
      - id
      - created_at
      - updated_at
  delete:
    enabled: true
    fields: business_only
    exclude:
      - id
      - created_at
      - updated_at
  associate:
    enabled: true
  dissociate:
    enabled: true

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true
    description: 技术主键
    semantics:
      meaning: 自增主键
      primary_key: true

  - id: code
    name: 单位编码
    type: string
    db_column: code
    required: true
    unique: true
    max_length: 20
    pattern: "^[A-Za-z][A-Za-z0-9_]*$"
    description: 计量单位唯一编码（如 KG / PC / M）
    semantics:
      meaning: 计量单位业务编码
      business_key: true
      immutable: true
      data_category: code
    ui:
      widget: input

  - id: name
    name: 单位名称
    type: string
    db_column: name
    required: true
    max_length: 50
    description: 计量单位显示名称（如 千克 / 个 / 米）
    semantics:
      meaning: 计量单位显示名称
      display_name: true
      data_category: text
    ui:
      widget: input

  - id: uom_group_id
    name: 计量单位组
    type: integer
    db_column: uom_group_id
    required: true
    description: 所属计量单位组（决定组基本单位与组内标准换算）
    semantics:
      meaning: 计量单位所属组
      display:
        type: association
        target_type: uom_group
        display_field: name
      hint: 单位一律归属某个组；组内换算以该组的基本单位为基准
    value_help:
      source:
        type: bo
        target_bo: uom_group
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} {name}"
        columns:
          - field: code
            label: 编码
            width: 140
          - field: name
            label: 名称
            width: 200
    ui:
      widget: select
      relation: uom_group
      multiple: false

  - id: decimal_places
    name: 小数位数
    type: integer
    db_column: decimal_places
    required: true
    default: 0
    description: 该单位的精度（小数位数）
    constraints:
      - type: numeric_range
        gte: 0
        lte: 10
    semantics:
      meaning: 单位精度；数量一律按基本单位存储与计算，仅在展示与单据落值时按目标单位的小数位四舍五入（HALF_UP），中间换算链路不取整
    ui:
      widget: input

  - id: status
    name: 状态
    type: string
    db_column: status
    required: true
    default: active
    description: 单位状态 active/inactive（生命周期约定 §5.4）
    enum_values:
      - value: active
        label: 启用
        color: success
        category: active
        is_initial: true
      - value: inactive
        label: 停用
        color: info
        category: inactive
    semantics:
      meaning: 单位启用状态
      filterable: true
      filter_type: enum
      filter_label: 状态
      filter_scope: local
    ui:
      widget: select

  - id: description
    name: 描述
    type: text
    db_column: description
    nullable: true
    description: 单位说明
    semantics:
      meaning: 计量单位详细说明
      searchable: true
    ui:
      widget: textarea

  - id: created_at
    name: 创建时间
    type: datetime
    db_column: created_at
    description: 创建时间
    semantics:
      meaning: 记录创建时间
      audit_field: true

# 生命周期: 复用平台标准动作 activate / deactivate（蓝图 §5.4）
rules:
  - id: activate_uom
    name: 启用单位
    type: state_transition
    action_ref: activate
    state_field: status
    from_states: [inactive]
    to_state: active
    triggers: [before_update]
    ui_hints:
      label: 启用
      icon: check_circle
      confirm_message: "确定要启用此计量单位吗？"
      highlight: true

  - id: deactivate_uom
    name: 停用单位
    type: state_transition
    action_ref: deactivate
    state_field: status
    from_states: [active]
    to_state: inactive
    triggers: [before_update]
    ui_hints:
      label: 停用
      icon: pause_circle
      confirm_message: "确定要停用此计量单位吗？"

indexes:
  - fields: [code]
    unique: true
    name: idx_uom_code
  - fields: [uom_group_id]
    name: idx_uom_group
  - fields: [status]
    name: idx_uom_status

relations:
  - id: uom_to_uom_group
    name: 计量单位组
    type: reference
    target: uom_group
    source_field: uom_group_id
    target_field: id
    cardinality: N:1
    description: 所属计量单位组引用（由 relations 生成真外键）

ui_view_config:
  showChangeHistory: true
  # [单页 hub 声明 2026-10-24] 见 items.yaml 同名注释；本块是该页形态的唯一真源。
  #   组同时出现在左树与右表 tab 是有意的：左树用于过滤导航，右表 tab 用于维护。
  hub:
    object_types: [uom, uom_group]
    default_tab: uom
    tabs:
      uom: 计量单位
      uom_group: 计量单位组
    state_key: uomManagerState
    disable_version_context: true
    scope:
      type: hierarchy
      object: uom_group
      scope_key: uom
      parent_field: parent_id
      # 组为扁平分类（无 parent 自引用）⇒ 平铺，不组树、不渲染展开/收起
      flat: true
      order_by: ''
      empty_text: 暂无计量单位组数据
      search_placeholder: 搜索计量单位组（编码/名称）
    filters:
      uom:
        field: uom_group_id
      uom_group:
        mode: none
  list:
    detail_mode: drawer
    title: 计量单位管理
    description: 计量单位主数据列表
    columns:
      - field: code
        width: 120
        sortable: true
      - field: name
        width: 160
        sortable: true
      - field: uom_group_id
        width: 150
        render_as: association
        target_type: uom_group
        display_field: name
        filterable: true
        filter_type: select
      - field: decimal_places
        width: 90
        type: number
        align: right
      - field: status
        width: 90
        filterable: true
        filter_type: select
      - field: description
        width: 240
        type: ellipsis
      - field: updated_at
        width: 160
        format: datetime
    selection:
      enabled: true
      mode: multiple
    searchFields:
      - code
      - name
    actions:
      - id: create
        label: 新建单位
        icon: plus
        type: primary
        permission: uom:create
      - id: export
        label: 导出
        icon: download
        type: default
    defaultSort:
      field: code
      order: asc

  form:
    title: 计量单位信息
    layout: vertical
    sections:
      - title: 基本信息
        columns:
          - fields: [code, name]
          - fields: [uom_group_id, decimal_places]
          - fields: [status]
      - title: 其他信息
        columns:
          - fields: [description]

  detail:
    layout: tabs
    title: "{record.name} 详情"
    tabs:
      - id: basic
        label: 基本信息
        type: fields
        fields:
          - code
          - name
          - uom_group_id
          - decimal_places
          - status
          - description

category_config:
  create_permission: uom:create
  update_permission: uom:update
  delete_permission: uom:delete
  owner_auto_permission: false