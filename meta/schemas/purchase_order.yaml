# 采购订单头 (Purchase Order) — M3 第一阶段
# 依据: docs/specs/spec-purchase-order-object-model-2026-11-01.md §2 / §3 / §5 / §6 / §13
#
# 定位: 采购域事实单据（订单头）。行见 purchase_order_line，
#       到货计划见 purchase_order_schedule，需求分配见 demand_allocation。
#
# 与销售订单统一的骨架（spec §2 U1-U13）:
#   ① 业务键列名 order_no（与 sales_order 同名）；创建时按
#      document_type.number_sequence_id 取号，生成后不可改，允许跳号。
#   ② 单据类型由切面 document_type_aspect 提供（T-D20）；头类型
#      scope_bo='purchase_order' + level='header'，离开草稿不可改。
#   ③ 状态机 5 态 draft / submitted / confirmed / closed / cancelled。
#   ④ 金额三项 net / tax / gross 是行汇总快照，服务层回写，界面只读。
#   ⑤ 头 / 行只存快照；计划层（purchase_order_schedule）是收货行的唯一挂载点。
#   ⑥ 供应商 = supplier_party_id（必填）+ supplier_account_id（可空，只带默认值）。
#
# 审批（spec §6）:
#   approval_status 与 status 正交，是只读缓存（事实源 = tasks(type=approval)）。
#   免审批（无命中策略）→ not_required，提交后可直接确认；
#   需审批 → pending，审批通过 approved / 驳回 rejected 并退回 draft。
#
# 服务层不变量（R-PO-0 ~ R-PO-18，由 purchase_order_guard_service 强制）:
#   R-PO-0  创建时 document_type_id 必填（切面 + 守卫）
#   R-PO-1  order_no 生成后不可改；取号失败不回退
#   R-PO-2  document_type_id / currency_id / supplier_party_id 离开草稿不可改
#   R-PO-5  头三项恒等于行汇总（金额服务回写）
#   R-PO-7  确认时冻结 exchange_rate / 税率 / 单价
#   R-PO-8  提交 / 确认时供应商须有有效 vendor 关系；purchase_org_id 须具备 purchasing 职能
#   R-PO-12 仅 approval_status ∈ {not_required, approved} 时允许确认

id: purchase_order
name: 采购订单
table_name: purchase_orders
description: 采购订单头（行见 purchase_order_line）
display_name_field: order_no
aspects: [audit_aspect, document_type_aspect]

semantics:
  meaning: 采购订单
  category: business_document
  business_key: [order_no]
  aliases:
    - 采购订单
    - 采购单
    - Purchase Order
    - PO

# [S1 2026-11-06] 状态目录 + 状态×字段矩阵（对标 SAP 状态参数文件的字段选择控制）。
# 把原来只写在 ui_hints.confirm_message 里的口头承诺（「确认后汇率冻结」「关闭后只读」）
# 变成元数据强制。默认未命中的状态行为完全不变。
states:
  - code: draft
    label: 草稿
    category: initial
    seq: 1
  - code: submitted
    label: 已提交
    seq: 2
  - code: confirmed
    label: 已确认
    seq: 3
  - code: closed
    label: 已关闭
    category: terminal
    seq: 4
  - code: cancelled
    label: 已取消
    category: terminal
    seq: 5

state_field_policies:
  # 已确认：源头字段锁定（供应商/组织/地点/日期/币种/汇率/折扣）
  confirmed:
    readonly:
      - supplier_party_id
      - supplier_account_id
      - purchase_org_id
      - purchase_legal_entity_id
      - deliver_to_location_id
      - order_date
      - currency_id
      - exchange_rate
      - exchange_rate_type
      - exchange_rate_date
      - header_discount_percent
  # 已关闭：订单只读（业务文案「关闭后订单只读」）
  closed:
    readonly:
      - supplier_party_id
      - supplier_account_id
      - purchase_org_id
      - purchase_legal_entity_id
      - deliver_to_location_id
      - order_date
      - currency_id
      - exchange_rate
      - exchange_rate_type
      - exchange_rate_date
      - header_discount_percent
      - payment_term_id
      - incoterm_code
  # 已取消：不可再改抬头要素
  cancelled:
    readonly:
      - supplier_party_id
      - purchase_org_id
      - purchase_legal_entity_id
      - order_date

deletion_policy:
  # 事实单据：非草稿禁止删除（守卫拦截器强制度）；草稿删除时级联清行
  mode: restrict
  restrict_on: []
  cascade_delete:
    - purchase_order_lines

audit:
  enabled: true
  create:
    enabled: true
    fields: all
    exclude:
      - contact_name_text
      - contact_phone_text
  update:
    enabled: true
    fields: changed_only
    exclude:
      - id
      - created_at
      - updated_at
      - fulfillment_status
      - fulfillment_derived_at
      - approval_status
      - contact_name_text
      - contact_phone_text
  delete:
    enabled: true
    fields: business_only
    exclude:
      - id
      - created_at
      - updated_at
      - contact_name_text
      - contact_phone_text
  associate:
    enabled: true
  dissociate:
    enabled: true

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true
    description: 技术主键
    semantics:
      meaning: 自增主键
      primary_key: true

  # 创建时由平台取号（meta/api/bo_api.py 通用路径），生成后不可改
  - id: order_no
    name: 采购订单号
    type: string
    db_column: order_no
    required: true
    unique: true
    max_length: 30
    description: 采购订单号（业务键，取号生成后不可修改）
    semantics:
      meaning: 采购订单业务编号
      business_key: true
      immutable: true
      data_category: code
      searchable: true
    ui:
      widget: input
      editable: false

  # 单据类型由切面 document_type_aspect 提供（平台层规范 T-D20）：
  # 字段 document_type_id → type_definitions 的 header 行，只承载编号 / 审批 /
  # 打印 / 权限等治理语义；不编码行级业务类型（行级差异走 line_type_id）。

  - id: order_date
    name: 订单日期
    type: date
    db_column: order_date
    required: true
    description: 单据日期；取号日期段与汇率快照基准日
    semantics:
      meaning: 订单业务日期
      filterable: true
      filter_type: date
      filter_label: 订单日期
      filter_scope: local
    ui:
      widget: date

  - id: project_id
    name: 项目
    type: integer
    db_column: project_id
    nullable: true
    description: 整单归集项目（可空）；行级归集走 demand_allocation
    semantics:
      meaning: 订单所属项目
      display:
        type: association
        target_type: project
        display_field: name
        placeholder: "未归集"
    value_help:
      source:
        type: bo
        target_bo: project
        value_field: id
        display_field: name
        code_field: project_no
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{project_no} {name}"
        columns:
          - field: project_no
            label: 项目编号
            width: 140
          - field: name
            label: 项目名称
            width: 200
    ui:
      widget: select
      relation: project
      multiple: false
      clearable: true

  - id: status
    name: 状态
    type: string
    db_column: status
    required: true
    default: draft
    description: 订单状态（草稿 / 已提交 / 已确认 / 已关闭 / 已取消）
    enum_values:
      - value: draft
        label: 草稿
        color: info
        category: draft
        is_initial: true
      - value: submitted
        label: 已提交
        color: primary
        category: active
      - value: confirmed
        label: 已确认
        color: success
        category: active
      - value: closed
        label: 已关闭
        color: info
        category: inactive
      - value: cancelled
        label: 已取消
        color: danger
        category: inactive
    semantics:
      meaning: 订单状态
      filterable: true
      filter_type: enum
      filter_label: 状态
      filter_scope: local
    ui:
      widget: select

  # 供应商：M2 sourcing 直接输出 party.id；M2 未接线前允许人工填
  - id: supplier_party_id
    name: 供应商
    type: integer
    db_column: supplier_party_id
    required: true
    description: 供应商往来单位（party.id；须具备有效 vendor 关系）
    semantics:
      meaning: 订单供应商
      display:
        type: association
        target_type: party
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: party
        value_field: id
        display_field: name
        code_field: name
        apply_target_permissions: true
        value_filter:
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{name}"
        columns:
          - field: name
            label: 供应商
            width: 220
    ui:
      widget: select
      relation: party
      multiple: false

  - id: supplier_account_id
    name: 供应商档案
    type: integer
    db_column: supplier_account_id
    nullable: true
    description: 供应商档案（空 = 用该供应商默认 vendor 档案；承载币种 / 付款条件默认值）
    semantics:
      meaning: 供应商商务档案
      display:
        type: association
        target_type: vendor_account
        display_field: name
        placeholder: "默认档案"
    value_help:
      source:
        type: bo
        target_bo: vendor_account
        value_field: id
        display_field: name
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{name}"
        columns:
          - field: name
            label: 供应商档案
            width: 220
    ui:
      widget: select
      relation: vendor_account
      multiple: false
      clearable: true

  - id: supplier_reference_no
    name: 供应商单号
    type: string
    db_column: supplier_reference_no
    nullable: true
    max_length: 40
    description: 供应商侧的订单号
    semantics:
      meaning: 供应商订单参考号
      searchable: true
      data_category: code
    ui:
      widget: input

  - id: contact_party_id
    name: 联系人
    type: integer
    db_column: contact_party_id
    nullable: true
    description: 供应商联系人（自然人）
    semantics:
      meaning: 订单联系人
      display:
        type: association
        target_type: party
        display_field: name
        placeholder: "未指定"
    value_help:
      source:
        type: bo
        target_bo: party
        value_field: id
        display_field: name
        code_field: name
        apply_target_permissions: true
        value_filter:
          status: active
          party_type: person
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{name}"
        columns:
          - field: name
            label: 联系人
            width: 180
    ui:
      widget: select
      relation: party
      multiple: false
      clearable: true

  - id: contact_name_text
    name: 联系人姓名
    type: string
    db_column: contact_name_text
    nullable: true
    max_length: 80
    description: 联系人姓名快照（PII，不进审计）
    semantics:
      meaning: 联系人姓名快照
      searchable: true
    ui:
      widget: input

  - id: contact_phone_text
    name: 联系电话
    type: string
    db_column: contact_phone_text
    nullable: true
    max_length: 40
    description: 联系电话快照（PII，不进审计）
    semantics:
      meaning: 联系电话快照
      searchable: true
    ui:
      widget: input

  - id: org_id
    name: 业务实体
    type: integer
    db_column: org_id
    required: true
    description: 采购方法人 / 财务归属；默认取送达组织所属法人
    semantics:
      meaning: 订单的业务实体
      display:
        type: association
        target_type: org
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: org
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        value_filter:
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 组织编码
            width: 140
          - field: name
            label: 组织名称
            width: 220
    ui:
      widget: select
      relation: org
      multiple: false

  - id: purchase_org_id
    name: 采购组织
    type: integer
    db_column: purchase_org_id
    required: true
    description: 采购组织（须具备 purchasing 职能）；数据范围与报表主过滤维度
    semantics:
      meaning: 订单的采购组织
      display:
        type: association
        target_type: org
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: org
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        value_filter:
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 组织编码
            width: 140
          - field: name
            label: 组织名称
            width: 220
    ui:
      widget: select
      relation: org
      multiple: false

  # TBD-10（v195）：采购法人只读快照 —— 由 purchase_org_id 沿组织层级上溯
  # legal_entity 职能组织解析后写入；解析失败留空，不阻断保存。
  # 收货单（purchase_order 来源）据此校验收货组织 org_id 一致性。
  - id: purchase_legal_entity_id
    name: 采购法人
    type: integer
    db_column: purchase_legal_entity_id
    nullable: true
    description: 采购法人快照（由 purchase_org_id 上溯，不直接维护）
    semantics:
      meaning: 采购法人快照
      display:
        type: association
        target_type: org
        display_field: name
        placeholder: "未解析"
    ui:
      readonly: true

  - id: division_code
    name: 产品分部
    type: string
    db_column: division_code
    nullable: true
    max_length: 20
    description: 产品分部代码（与销售订单同义）
    semantics:
      meaning: 采购产品分部
      data_category: code
      display:
        type: association
        target_type: division
        display_field: name
        placeholder: "未指定"
    value_help:
      source:
        type: bo
        target_bo: division
        value_field: code
        display_field: name
        code_field: code
        apply_target_permissions: true
        value_filter:
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} - {name}"
    ui:
      widget: select
      relation: division
      multiple: false
      clearable: true

  - id: deliver_to_location_id
    name: 收货地点
    type: integer
    db_column: deliver_to_location_id
    nullable: true
    description: 默认收货地点（空 = 采购组织默认地点；行 / 计划行可覆盖）
    semantics:
      meaning: 订单收货地点
      display:
        type: association
        target_type: location
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: location
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        value_filter:
          location_type: site
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} {name}"
        columns:
          - field: code
            label: 位置编码
            width: 140
          - field: name
            label: 位置名称
            width: 200
    ui:
      widget: select
      relation: location
      multiple: false
      clearable: true

  - id: currency_id
    name: 订单币种
    type: integer
    db_column: currency_id
    required: true
    description: 订单币种（金额精度来源）
    semantics:
      meaning: 订单币种
      display:
        type: association
        target_type: currency
        display_field: code
    value_help:
      source:
        type: bo
        target_bo: currency
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        value_filter:
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 币种
            width: 100
          - field: name
            label: 名称
            width: 160
    ui:
      widget: select
      relation: currency
      multiple: false

  - id: exchange_rate
    name: 汇率
    type: number
    db_column: exchange_rate
    required: true
    default: 1
    description: 汇率快照（确认时冻结）
    constraints:
      - type: numeric_range
        gt: 0
        decimal_places: 12
    semantics:
      meaning: 订单汇率快照
    ui:
      widget: input

  - id: exchange_rate_type
    name: 汇率类型
    type: string
    db_column: exchange_rate_type
    required: true
    default: spot
    description: 汇率类型快照（确认时冻结）
    enum_values:
      - value: spot
        label: 即期汇率
        color: primary
        is_initial: true
      - value: corporate
        label: 公司汇率
        color: info
      - value: user
        label: 用户汇率
        color: warning
      - value: fixed
        label: 固定汇率
        color: success
    semantics:
      meaning: 订单汇率类型快照
      filterable: true
    ui:
      widget: select

  - id: exchange_rate_date
    name: 汇率日期
    type: date
    db_column: exchange_rate_date
    nullable: true
    description: 汇率有效日快照；exchange_rate != 1 时必填
    semantics:
      meaning: 订单汇率有效日期快照
      filterable: true
      filter_type: date
      filter_label: 汇率日期
      filter_scope: local
    ui:
      widget: date
      clearable: true

  - id: payment_term_id
    name: 付款条件
    type: integer
    db_column: payment_term_id
    nullable: true
    description: 付款条件（空 = 供应商档案默认）
    semantics:
      meaning: 订单付款条件
      display:
        type: association
        target_type: payment_term
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: payment_term
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        value_filter:
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} - {name}"
        columns:
          - field: code
            label: 条件编码
            width: 140
          - field: name
            label: 条件名称
            width: 200
    ui:
      widget: select
      relation: payment_term
      multiple: false
      clearable: true

  - id: incoterm_code
    name: 贸易条款
    type: string
    db_column: incoterm_code
    nullable: true
    max_length: 10
    description: 国际贸易术语代码（Incoterms 2020）
    semantics:
      meaning: 订单贸易条款代码
      data_category: code
      display:
        type: association
        target_type: incoterm
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: incoterm
        value_field: code
        display_field: name
        code_field: code
        apply_target_permissions: true
        value_filter:
          edition: '2020'
          status: active
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} - {name}"
    ui:
      widget: select
      relation: incoterm
      multiple: false
      clearable: true

  - id: requested_date
    name: 需求交付日
    type: date
    db_column: requested_date
    nullable: true
    description: 整单需求交付日；计划行可覆盖
    semantics:
      meaning: 需求交付日
      filterable: true
      filter_type: date
      filter_label: 需求交付日
      filter_scope: local
    ui:
      widget: date

  - id: confirmed_date
    name: 供应商确认日
    type: date
    db_column: confirmed_date
    nullable: true
    description: 供应商确认日期（确认时填）
    semantics:
      meaning: 供应商承诺日期
    ui:
      widget: date

  - id: price_date
    name: 定价日期
    type: date
    db_column: price_date
    nullable: true
