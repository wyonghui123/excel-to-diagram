  - id: header_surcharge_percent
    name: 头附加率
    type: number
    db_column: header_surcharge_percent
    required: true
    default: 0
    description: 整单附加费百分比（与销售订单同一分摊口径）
    constraints:
      - type: numeric_range
        gte: 0
        lte: 100
        decimal_places: 4
    semantics:
      meaning: 整单附加费百分比
    ui:
      widget: input

  - id: header_discount_amount
    name: 头折扣额
    type: number
    db_column: header_discount_amount
    required: true
    default: 0
    description: 整单折扣金额快照（负值；由分摊服务写回）
    constraints:
      - type: numeric_range
        decimal_places: 4
    semantics:
      meaning: 整单折扣金额快照
    ui:
      widget: number
      editable: false

  - id: header_surcharge_amount
    name: 头附加额
    type: number
    db_column: header_surcharge_amount
    required: true
    default: 0
    description: 整单附加费金额快照（正值；由分摊服务写回）
    constraints:
      - type: numeric_range
        decimal_places: 4
    semantics:
      meaning: 整单附加费金额快照
    ui:
      widget: number
      editable: false

  - id: price_list_id
    name: 价目表
    type: integer
    db_column: price_list_id
    nullable: true
    description: 命中的价目表快照（取价服务回写）
    semantics:
      meaning: 命中的价目表
      display:
        type: association
        target_type: rate_table
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: rate_table
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        value_filter:
          status: approved
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} - {name}"
    ui:
      widget: select
      relation: rate_table
      multiple: false
      editable: false

  - id: pricing_procedure_id
    name: 定价过程
    type: integer
    db_column: pricing_procedure_id
    nullable: true
    description: 命中的定价过程快照（取价服务回写）
    semantics:
      meaning: 命中的定价过程
      display:
        type: association
        target_type: calc_procedure
        display_field: name
    value_help:
      source:
        type: bo
        target_bo: calc_procedure
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{code} - {name}"
    ui:
      widget: select
      relation: calc_procedure
      multiple: false
      editable: false

  - id: net_amount
    name: 不含税合计
    type: number
    db_column: net_amount
    required: true
    default: 0
    description: 不含税合计（行汇总快照，服务层回写）
    constraints:
      - type: numeric_range
        decimal_places: 4
    semantics:
      meaning: 订单不含税合计
    ui:
      widget: input
      editable: false

  - id: tax_amount
    name: 税额合计
    type: number
    db_column: tax_amount
    required: true
    default: 0
    description: 税额合计（行汇总快照，服务层回写）
    constraints:
      - type: numeric_range
        decimal_places: 4
    semantics:
      meaning: 订单税额合计
    ui:
      widget: input
      editable: false

  - id: gross_amount
    name: 含税合计
    type: number
    db_column: gross_amount
    required: true
    default: 0
    description: 含税合计（行汇总快照，服务层回写）
    constraints:
      - type: numeric_range
        decimal_places: 4
    semantics:
      meaning: 订单含税合计
    ui:
      widget: input
      editable: false

  - id: approval_status
    name: 审批状态
    type: string
    db_column: approval_status
    required: true
    default: not_required
    max_length: 20
    description: 审批状态（只读缓存，事实源 tasks(type=approval)）
    enum_values:
      - value: not_required
        label: 免审批
        color: info
        category: active
        is_initial: true
      - value: pending
        label: 审批中
        color: warning
        category: active
      - value: approved
        label: 审批通过
        color: success
        category: active
      - value: rejected
        label: 审批驳回
        color: danger
        category: inactive
    semantics:
      meaning: 审批进度（与订单状态 status 正交）
      filterable: true
      filter_type: enum
      filter_label: 审批状态
      filter_scope: local
    ui:
      readonly: true

  - id: fulfillment_status
    name: 履约状态
    type: string
    db_column: fulfillment_status
    nullable: true
    max_length: 20
    description: 收货进度（只读缓存，由收货 / 分配数据派生）
    enum_values:
      - value: open
        label: 未收货
        color: info
        category: active
      - value: partially_received
        label: 部分收货
        color: warning
        category: active
      - value: received
        label: 已收货
        color: success
        category: active
      - value: closed
        label: 已关闭
        color: info
        category: inactive
    semantics:
      meaning: 到货进度（由计划行 / 收货聚合），与订单状态 status 正交
      filterable: true
      filter_type: enum
      filter_label: 履约状态
      filter_scope: local
    ui:
      readonly: true

  - id: fulfillment_derived_at
    name: 履约派生时间
    type: datetime
    db_column: fulfillment_derived_at
    nullable: true
    description: 最近一次履约状态派生确认时间（UTC），只读
    semantics:
      meaning: 派生确认时间，非人工维护
      audit_field: true
    ui:
      readonly: true

  - id: description
    name: 订单说明
    type: text
    db_column: description
    nullable: true
    description: 订单说明
    semantics:
      meaning: 订单说明
      searchable: true
    ui:
      widget: textarea

  - id: revision_no
    name: 版本号
    type: integer
    db_column: revision_no
    required: true
    default: 1
    description: 文档内容版本号（平台写入，界面不可编辑）
    semantics:
      meaning: 每次内容变更 +1，用于版本快照与并发冲突检测
    ui:
      editable: false

  - id: created_at
    name: 创建时间
    type: datetime
    db_column: created_at
    description: 创建时间
    semantics:
      meaning: 记录创建时间
      audit_field: true

  - id: updated_at
    name: 更新时间
    type: datetime
    db_column: updated_at
    description: 更新时间
    semantics:
      meaning: 记录更新时间
      audit_field: true

# 状态机（spec §6.3）：draft → submitted → confirmed → closed；任意态可 cancelled
# 审批驱动的 approve / reject 由 BO Action 调回（purchase_order.approve / .reject），
# 仍走 status 迁移，落在同一 YAML 规则集内。
rules:
  - id: submit_purchase_order
    name: 提交订单
    type: state_transition
    state_field: status
    from_states: [draft]
    to_state: submitted
    triggers: [before_update]
    ui_hints:
      label: 提交
      icon: send
      confirm_message: "提交后将进入待确认状态，确定要提交吗？"

  - id: approve_purchase_order
    name: 审批通过
    type: state_transition
    state_field: status
    from_states: [submitted]
    to_state: confirmed
    triggers: [before_update]
    ui_hints:
      label: 审批通过
      icon: check_circle
      confirm_message: "审批通过后订单确认，汇率、税率与单价将冻结，确定吗？"

  - id: reject_purchase_order
    name: 审批驳回
    type: state_transition
    state_field: status
    from_states: [submitted]
    to_state: draft
    triggers: [before_update]
    ui_hints:
      label: 审批驳回
      icon: cancel
      confirm_message: "驳回后订单退回草稿，修改后可重提，确定要驳回吗？"

  - id: confirm_purchase_order
    name: 确认订单
    type: state_transition
    state_field: status
    from_states: [submitted]
    to_state: confirmed
    triggers: [before_update]
    ui_hints:
      label: 确认
      icon: check_circle
      highlight: true
      confirm_message: "确认后汇率、税率与单价将冻结，确定要确认吗？"

  - id: close_purchase_order
    name: 关闭订单
    type: state_transition
    state_field: status
    from_states: [confirmed]
    to_state: closed
    triggers: [before_update]
    ui_hints:
      label: 关闭
      icon: archive
      confirm_message: "关闭后订单只读，未收数量不再执行，确定要关闭吗？"

  - id: cancel_purchase_order
    name: 取消订单
    type: state_transition
    state_field: status
    from_states: [draft, submitted, confirmed]
    to_state: cancelled
    triggers: [before_update]
    ui_hints:
      label: 取消
      icon: cancel
      confirm_message: "取消后订单不再参与履约（不回滚已收货事实），确定要取消吗？"

indexes:
  - fields: [order_no]
    unique: true
    name: uidx_purchase_order_no
  - fields: [supplier_party_id, order_date]
