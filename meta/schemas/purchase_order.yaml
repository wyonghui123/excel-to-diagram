ui_view_config:
  # 菜单由 v177 迁移手工声明（procurement / purchase-order-management）
  skip_auto_menu: true
  showChangeHistory: true
  list:
    detail_mode: page
    title: 采购订单
    description: 采购订单（草稿 / 已提交 / 已确认 / 已关闭 / 已取消）
    columns:
      - field: order_no
        width: 180
        sortable: true
      - field: document_type_id
        width: 120
      - field: order_date
        width: 120
        format: date
        sortable: true
      - field: supplier_party_id
        width: 200
      - field: purchase_org_id
        width: 160
      - field: purchase_legal_entity_id
        width: 160
      - field: org_id
        width: 160
      - field: currency_id
        width: 90
      - field: net_amount
        width: 130
      - field: status
        width: 100
        filterable: true
        filter_type: select
      - field: approval_status
        width: 110
        filterable: true
        filter_type: select
      - field: fulfillment_status
        width: 110
        filterable: true
        filter_type: select
    selection:
      enabled: true
      mode: multiple
    searchFields:
      - order_no
      - supplier_reference_no
    actions:
      - id: create
        label: 新建采购订单
        icon: plus
        type: primary
        permission: purchase_order:purchase_order_create
      - id: export
        label: 导出
        icon: download
        type: default
    defaultSort:
      field: order_date
      order: desc
  form:
    title: 采购订单信息
    layout: vertical
    sections:
      - title: 单据信息
        columns:
          - fields: [order_no, document_type_id]
          - fields: [order_date, status]
          - fields: [approval_status, fulfillment_status]
      - title: 供应商与组织
        columns:
          - fields: [supplier_party_id, supplier_account_id]
          - fields: [supplier_reference_no, contact_party_id]
          - fields: [contact_name_text, contact_phone_text]
          - fields: [purchase_org_id, purchase_legal_entity_id]
          - fields: [org_id]
          - fields: [division_code, project_id]
      - title: 交付与条款
        columns:
          - fields: [deliver_to_location_id, incoterm_code]
          - fields: [currency_id, exchange_rate]
          - fields: [exchange_rate_type, exchange_rate_date]
          - fields: [payment_term_id]
          - fields: [requested_date, confirmed_date]
      - title: 抬头折扣与附加费
        columns:
          - fields: [header_discount_percent, header_surcharge_percent]
          - fields: [header_discount_amount, header_surcharge_amount]
      - title: 定价信息
        columns:
          - fields: [price_date]
          - fields: [price_list_id, pricing_procedure_id]
      - title: 金额合计
        columns:
          - fields: [net_amount, tax_amount, gross_amount]
      - title: 其他信息
        columns:
          - fields: [description]

  # 行 / 计划行子表：父字段由 ui.relation=purchase_order 推断
  # demand_allocation 是多态分配表（target_id 指向任意载体），
  # 无单一父字段，故不放入 child_sections（M3 通过服务 / API 维护）。
  child_sections:
    - child_object: purchase_order_line
      title: 订单行
      display: tab
      pageSize: 10
      useMetaList: true
      enableDetail: true
      enableAutoCrud: true
      rowMutability: fullEditable
    - child_object: purchase_order_schedule
      title: 到货计划
      display: tab
      pageSize: 10
      useMetaList: true
      enableDetail: true
      enableAutoCrud: true
