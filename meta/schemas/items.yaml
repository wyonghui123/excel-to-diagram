# 物料 (Item) — foundation 步 1 · 物料锚（主对象）
# 依据: docs/superpowers/specs/2026-10-04-foundation-object-model-and-architecture.md §3.4 / §7 步 1
#       docs/superpowers/specs/2026-10-03-item-structure-and-attribute-list-plan.md §2.2 / §4.1–4.3
# 命名三分 (S1): 界面词「物料」/ 技术标识 item / 物理表 items（禁用 product）
# 结构: 1 主表(stored 锚属性) + 子表/item_group/分层值表（见各自 schema）
# 红线: item 只装"物料的"东西；流程的(控制参数)/位置的(策略参数)/账的 一律留各自域（§4.12）
#
# [本期范围] L0 锚属性 + 生命周期. 以下随拍板/后期：
#  - allow_* 用途开关: D11 待定（倾向一期暂缓）→ 本期不落列
#  - 供应方式: D10 已拍移出 item → 归"供应计划策略"（步 5）
#  - 会计处置: D1 随财务相邻项挂起（v2.4）→ 不进 item
#  - 采购/销售/库存/质量域参数(hybrid: 采购单位/提前期/安全库存/批次控制 等): 落 item_attribute_values 分层值表
#
# [待接线] item_group_id / base_uom 引用 item_groups / uoms（同步建表）

id: item
name: 物料
table_name: items
description: 物料主数据（foundation 物料锚）
display_name_field: name
aspects: [audit_aspect]

semantics:
  meaning: 物料
  category: core_entity
  business_key: [code]
  display_name_field: name
  aliases:
    - 物料
    - 物料主数据
    - Item

deletion_policy:
  # S19: 主数据禁止物理删除; 被引用时 restrict（只能停用）
  mode: restrict
  restrict_on:
    - table: item_uom_conversions
      foreign_key: item_id
      message: 该物料存在单位换算记录，请先删除换算记录后再删除
    - table: item_xrefs
      foreign_key: item_id
      message: 该物料存在外部标识（客/供/造件号）记录，请先删除后再删除
    - table: item_attribute_values
      foreign_key: item_id
      message: 该物料存在分层参数值记录，请先删除后再删除
  cascade_delete: []

audit:
  enabled: true
  create:
    enabled: true
    fields: all
  update:
    enabled: true
    fields: changed_only
    exclude:
      - id
      - created_at
      - updated_at
  delete:
    enabled: true
    fields: business_only
    exclude:
      - id
      - created_at
      - updated_at
  associate:
    enabled: true
  dissociate:
    enabled: true

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true
    description: 技术主键
    semantics:
      meaning: 自增主键
      primary_key: true

  # A 标识与名称
  - id: code
    name: 物料编码
    type: string
    db_column: code
    required: true
    unique: true
    max_length: 40
    pattern: "^[A-Za-z0-9][A-Za-z0-9_\\-]*$"
    description: 物料唯一编码（签发冻结，可走 key_template 自动编号）
    semantics:
      meaning: 物料业务编码
      business_key: true
      immutable: true
      data_category: code
      # 签发冻结字段集 = code / item_type / base_uom（active 后不可改）
      freeze_on_issue: true
    ui:
      widget: input

  - id: name
    name: 物料名称
    type: string
    db_column: name
    required: true
    max_length: 120
    description: 物料显示名称
    semantics:
      meaning: 物料显示名称
      display_name: true
      data_category: text
    ui:
      widget: input

  - id: spec
    name: 规格型号
    type: string
    db_column: spec
    nullable: true
    max_length: 120
    description: 规格型号
    semantics:
      meaning: 物料规格型号
      searchable: true
    ui:
      widget: input

  - id: description
    name: 描述备注
    type: text
    db_column: description
    nullable: true
    description: 描述备注
    semantics:
      meaning: 物料详细说明
      searchable: true
    ui:
      widget: textarea

  # B 类型与分类
  - id: item_type
    name: 物料类型
    type: string
    db_column: item_type
    required: true
    default: goods
    # 标签用「实物物料 / 服务物料」（SAP 中文口径），避免与对象名「物料」同名造成的
    # 同义反复（旧标签下列表会显示「物料类型 = 物料」）。存储值 goods/service 不变。
    description: 物料本体性质（实物物料/服务物料；互斥，签发冻结）
    enum_values:
      - value: goods
        label: 实物物料
        color: primary
      - value: service
        label: 服务物料
        color: info
    semantics:
      meaning: 物料本体性质
      filterable: true
      filter_type: enum
      filter_label: 物料类型
      filter_scope: local
      freeze_on_issue: true
    ui:
      widget: radio

  - id: item_group_id
    name: 物料组
    type: integer
    db_column: item_group_id
    required: true
    description: 物料组（分类）引用
    semantics:
      meaning: 物料所属分类
      display:
        type: association
        target_type: item_group
        display_field: name
        placeholder: "请选择物料组"
    value_help:
      source:
        type: bo
        target_bo: item_group
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
        hierarchy:
          enabled: true
          parent_field: parent_id
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
      presentation:
        result_type: dialog
        display_mode: tree
        display_format: "{name}"
        columns:
          - field: code
            label: 编码
            width: 140
          - field: name
            label: 名称
            width: 220
    ui:
      widget: select
      relation: item_group
      multiple: false
      clearable: true

  # C 计量与换算（L0 锚）
  - id: base_uom
    name: 基本单位
    type: integer
    db_column: base_uom
    required: true
    description: 基本计量单位引用（签发冻结）
    semantics:
      meaning: 物料基本计量单位
      display:
        type: association
        target_type: uom
        display_field: name
        placeholder: "请选择基本单位"
      freeze_on_issue: true
    value_help:
      source:
        type: bo
        target_bo: uom
        value_field: id
        display_field: name
        code_field: code
        apply_target_permissions: true
      behavior:
        multiple: false
        validation: true
        binding_strength: strict
        min_search_length: 0
      presentation:
        result_type: dropdown
        display_format: "{name} ({code})"
        columns:
          - field: code
            label: 编码
            width: 120
          - field: name
            label: 名称
            width: 160
    ui:
      widget: select
      relation: uom
      multiple: false
      clearable: false

  - id: net_weight
    name: 净重
    type: float
    db_column: net_weight
    nullable: true
    description: 净重（单位随基本单位/重量单位约定）
    semantics:
      meaning: 物料净重
    ui:
      widget: input
      unit_hint: 重量

  - id: gross_weight
    name: 毛重
    type: float
    db_column: gross_weight
    nullable: true
    description: 毛重
    semantics:
      meaning: 物料毛重
    ui:
      widget: input
      unit_hint: 重量

  # I 外部标识（主值；配对值走 item_xref 子表）
  - id: barcode
    name: 主条码
    type: string
    db_column: barcode
    nullable: true
    max_length: 30
    description: 主条码（EAN / GTIN）
    semantics:
      meaning: 物料主条码
      searchable: true
    ui:
      widget: input

  # A6 生命周期状态
  - id: status
    name: 状态
    type: string
    db_column: status
    required: true
    default: draft
    description: 生命周期状态 draft/active/frozen/inactive
    enum_values:
      - value: draft
        label: 草稿
        color: info
        category: draft
        is_initial: true
        description: 未签发，不可被单据引用
      - value: active
        label: 已签发
        color: success
        category: active
        description: 已签发，可被单据引用、可收发
      - value: frozen
        label: 已冻结
        color: warning
        category: error
        description: 冻结，阻止新收发（库存域硬校验）
      - value: inactive
        label: 已停用
        color: default
        category: inactive
        description: 停用，阻止新单据引用；老单据可继续结算
    semantics:
      meaning: 物料生命周期状态
      filterable: true
      filter_type: enum
      filter_label: 状态
      filter_scope: local
    ui:
      widget: select

  - id: created_at
    name: 创建时间
    type: datetime
    db_column: created_at
    description: 创建时间
    semantics:
      meaning: 记录创建时间
      audit_field: true

# 生命周期: 复用平台标准动作（蓝图 §3.4.8 / _standard_actions）
#   draft --activate--> active --freeze--> frozen --unfreeze--> active
#   active / frozen --deactivate--> inactive
#   签发冻结字段集 = code / item_type / base_uom（业务规则，由领域校验/规则承接）
rules:
  - id: activate_item
    name: 签发物料
    type: state_transition
    action_ref: activate
    state_field: status
    from_states: [draft, inactive]
    to_state: active
    triggers: [before_update]
    ui_hints:
      label: 签发
      icon: check_circle
      confirm_message: "确定要签发此物料吗？签发后 code / item_type / base_uom 将被冻结。"
      highlight: true

  - id: deactivate_item
    name: 停用物料
    type: state_transition
    action_ref: deactivate
    state_field: status
    from_states: [active, frozen]
    to_state: inactive
    triggers: [before_update]
    ui_hints:
      label: 停用
      icon: pause_circle
      confirm_message: "确定要停用此物料吗？停用后将阻止新单据引用。"

  - id: freeze_item
    name: 冻结物料
    type: state_transition
    action_ref: freeze
    state_field: status
    from_states: [active]
    to_state: frozen
    triggers: [before_update]
    ui_hints:
      label: 冻结
      icon: snowflake
      confirm_message: "确定要冻结此物料吗？冻结后将阻止新收发。"

  - id: unfreeze_item
    name: 解冻物料
    type: state_transition
    action_ref: unfreeze
    state_field: status
    from_states: [frozen]
    to_state: active
    triggers: [before_update]
    ui_hints:
      label: 解冻
      icon: fire
      confirm_message: "确定要解冻此物料吗？"

  # [规则模型试点 2026-10-06] 属性确定规则（default）首次业务落地：因子 → 输出
  # 目的：验证「YAML 声明 default 规则 → 加载 → 保存链路执行 → 落库」端到端可用。
  #       此前 default 规则仅有引擎单测 + 手工构造对象的集成测试，零业务 schema 使用。
  # 因子 = item_type；输出 = gross_weight；两条规则演示「优先级 + 首个命中获胜」。
  # [TBD-19 修复 2026-10-06] 裸写 0 曾被 _resolve_source 的 falsy 判断误判为「无值」；
  #       平台已修（0 / 0.0 / False 视为有效常量）⇒ 本规则回归自然写法，兼作回归防线。
  - id: default_gross_weight_service
    name: 服务类物料毛重为0
    type: default
    target_fields: [gross_weight]
    source_type: constant
    source_value: 0
    condition: "item_type == 'service'"
    apply_mode: fill_if_empty
    priority: 10

  - id: default_gross_weight_from_net
    name: 毛重默认取净重
    type: default
    target_fields: [gross_weight]
    source_type: field
    source_value: net_weight
    condition: ""
    apply_mode: fill_if_empty
    priority: 20

indexes:
  - fields: [code]
    unique: true
    name: idx_item_code
  - fields: [item_group_id]
    name: idx_item_group
  - fields: [item_type]
    name: idx_item_type
  - fields: [status]
    name: idx_item_status
  - fields: [base_uom]
    name: idx_item_base_uom
  - fields: [barcode]
    name: idx_item_barcode

relations:
  - id: item_to_item_group
    name: 物料组
    type: reference
    target: item_group
    source_field: item_group_id
    target_field: id
    cardinality: N:1
    description: 物料所属物料组引用（[FK 2026-10-07] 由展示语义升级为真外键）
  - id: item_to_uom
    name: 基本单位
    type: reference
    target: uom
    source_field: base_uom
    target_field: id
    cardinality: N:1
    description: 物料基本计量单位引用（[FK 2026-10-07] 由展示语义升级为真外键）

ui_view_config:
  showChangeHistory: true
  # [单页 hub 声明 2026-10-24] 菜单 page_type=multi_object_hub 且无 children 时，
  #   GenericTabContainer 渲染通用 MultiObjectHubPage，后者读本块构建「左树 + 多 tab」，
  #   不再需要一对象一个 Vue 壳。契约见 MultiObjectHubPage/hubOptions.js。
  #   filters 缺省（未列出的 tab）= 不受左树影响；mode: none 显式表达同一语义。
  hub:
    object_types: [item_group, item]
    default_tab: item
    tabs:
      item: 物料/服务
      item_group: 物料组
    state_key: materialManagerState
    disable_version_context: true
    scope:
      type: hierarchy
      object: item_group
      # 写入 scopeIds 的键，须与 object_types 中「受过滤」的 tab 同名
      scope_key: item
      parent_field: parent_id
      # 空串 = 保持后端返回顺序（不做客户端按 code 排序）
      order_by: ''
      empty_text: 暂无物料组数据
      search_placeholder: 搜索物料组（编码/名称）
    filters:
      item:
        field: item_group_id
      item_group:
        mode: none
  list:
    detail_mode: drawer
    title: 物料管理
    description: 物料主数据列表
    columns:
      - field: code
        width: 140
        sortable: true
      - field: name
        width: 200
      - field: spec
        width: 160
        type: ellipsis
      - field: item_type
        width: 90
        filterable: true
        filter_type: select
      - field: item_group_id
        width: 160
        filterable: true
        filter_type: value_help
        render_as: association
        target_type: item_group
        display_field: name
      - field: base_uom
        width: 110
        render_as: association
        target_type: uom
        display_field: name
      - field: status
        width: 100
        filterable: true
        filter_type: select
      - field: updated_at
        width: 160
        format: datetime
    selection:
      enabled: true
      mode: multiple
    searchFields:
      - code
      - name
      - spec
      - barcode
    actions:
      - id: create
        label: 新建物料
        icon: plus
        type: primary
        permission: item:create
      - id: export
        label: 导出
        icon: download
        type: default
    defaultSort:
      field: updated_at
      order: desc
    filters:
      - field: code
        label: 物料编码
        type: string
        operator: contains
      - field: name
        label: 物料名称
        type: string
        operator: contains
      - field: item_type
        label: 物料类型
        type: select
        options:
          - { value: goods, label: 实物物料 }
          - { value: service, label: 服务物料 }

  form:
    title: 物料信息
    layout: vertical
    sections:
      - title: 基本信息
        columns:
          - fields: [code, name]
          - fields: [spec, item_type]
          - fields: [item_group_id]
      - title: 计量信息
        columns:
          - fields: [base_uom, barcode]
          - fields: [net_weight, gross_weight]
      - title: 其他信息
        columns:
          - fields: [status, description]

  detail:
    layout: tabs
    title: "{record.name} 详情"
    tabs:
      - id: basic
        label: 基本信息
        type: fields
        fields:
          - code
          - name
          - spec
          - item_type
          - item_group_id
          - base_uom
          - barcode
          - net_weight
          - gross_weight
          - status
          - description

  # 单位换算子表（item_uom_conversion，parent_field=item_id）
  #   与 calendar→calendar_day / product→version / enum_type→enum_value 同一套
  #   child_sections 机制，由 AssociationSection 的 parent_child 分支按 item_id 取数。
  #   勿再写 detail.tabs 的 `type: nested` —— 前端从未实现该分支（同 calendar.yaml 注），
  #   item_uom_conversion 里的 `nested:` 因此一直是死声明。
  child_sections:
    - child_object: item_uom_conversion
      title: 单位换算
      display: tab
      pageSize: 10
      useMetaList: true
      enableDetail: true
      enableAutoCrud: true
      rowMutability: fullEditable

category_config:
  create_permission: item:create
  update_permission: item:update
  delete_permission: item:delete
  owner_auto_permission: false