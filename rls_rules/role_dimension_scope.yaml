# RLS 规则：role_dimension_scope（角色维度范围）
# V027 权限 BUG 域核心 - 角色管理维度范围声明

entity: role_dimension_scope

# 行级过滤
row_filters:
  # 管理员看所有
  - applies_to: [role:admin]
    condition: "true"
  # 普通用户仅看自己角色的维度范围
  - applies_to: [role:user, role:viewer]
    condition: "role_dimension_scope.role_id IN (SELECT role_id FROM user_roles WHERE user_id = $user.id)"
  # Manager 看自己管理的角色维度范围
  - applies_to: [role:manager]
    condition: "role_dimension_scope.role_id IN (SELECT role_id FROM user_roles WHERE user_id = $user.id)"

# 操作权限
actions:
  create: [role:admin]
  read: [role:admin, role:manager, role:user, role:viewer]
  update: [role:admin]
  delete: [role:admin]
