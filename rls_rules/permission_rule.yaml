# RLS 规则：permission_rule（条件权限规则）
# 基于条件的动态权限规则

entity: permission_rule

# 行级过滤
row_filters:
  # 管理员看所有
  - applies_to: [role:admin]
    condition: "true"
  # 普通用户仅看自己角色的规则
  - applies_to: [role:user, role:viewer]
    condition: "permission_rule.role_id IN (SELECT role_id FROM user_roles WHERE user_id = $user.id)"
  # Manager 看自己管理的角色规则
  - applies_to: [role:manager]
    condition: "permission_rule.role_id IN (SELECT role_id FROM user_roles WHERE user_id = $user.id)"

# 操作权限
actions:
  create: [role:admin]
  read: [role:admin, role:manager, role:user, role:viewer]
  update: [role:admin]
  delete: [role:admin]
