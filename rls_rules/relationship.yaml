# M11 RLS 规则：relationship（业务关系）

entity: relationship

row_filters:
  - applies_to: [role:admin, role:manager]
    condition: "true"
  - applies_to: [role:user, role:viewer]
    condition: "relationship.version_id IN ($user.accessible_version_ids)"
  - applies_to: [role:ai-agent]
    condition: "true"

field_masks: []

actions:
  create: [role:admin, role:manager, role:user]
  read: [role:admin, role:manager, role:user, role:viewer, role:ai-agent]
  update: [role:admin, role:manager, role:user]
  delete: [role:admin, role:manager]
