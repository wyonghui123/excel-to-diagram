# M11 RLS 规则: menu_permission (菜单权限)

entity: menu_permission

# menu_permission 是公开配置, 所有人可读, 仅 admin 可写
row_filters:
  - applies_to: [role:admin, role:user, role:viewer, role:manager]
    condition: "true"

field_masks:
  # 普通用户隐藏内部 required_permissions (实际权限仍生效, 字段仅用于审计)
  - role: [role:user, role:viewer]
    fields: [internal_audit_meta]

actions:
  create: [role:admin]
  read: [role:admin, role:user, role:viewer, role:manager]
  update: [role:admin]
  delete: [role:admin]