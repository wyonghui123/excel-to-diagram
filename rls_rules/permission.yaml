# M11 RLS 规则：permission（功能权限）

entity: permission

row_filters:
  - applies_to: [role:admin]
    condition: "true"
  - applies_to: [role:manager, role:user, role:viewer]
    condition: "permission.is_active == true"
  - applies_to: [role:ai-agent]
    condition: "permission.is_active == true"

field_masks:
  - field: internal_config
    mask: "***HIDDEN***"
    applies_to: [role:user, role:viewer, role:ai-agent, role:manager]

actions:
  create: [role:admin]
  read: [role:admin, role:manager, role:user, role:viewer, role:ai-agent]
  update: [role:admin]
  delete: [role:admin]
