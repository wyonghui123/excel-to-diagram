# RLS 规则：data_permission（数据权限）
# 用户级别的数据访问权限

entity: data_permission

# 行级过滤
row_filters:
  # 管理员看所有
  - applies_to: [role:admin]
    condition: "true"
  # 普通用户仅看自己的数据权限
  - applies_to: [role:user, role:viewer]
    condition: "data_permission.user_id = $user.id"
  # Manager 看自己管辖范围内的数据权限
  - applies_to: [role:manager]
    condition: "data_permission.user_id IN (SELECT user_id FROM user_roles WHERE role_id IN (SELECT role_id FROM user_roles WHERE user_id = $user.id))"

# 操作权限
actions:
  create: [role:admin]
  read: [role:admin, role:manager, role:user, role:viewer]
  update: [role:admin]
  delete: [role:admin]
