# Migration Lint Legacy 白名单
#
# 用途: 标记不接受新规范 (v<NNN>__<desc> 命名 / 缺 migrate() 函数)
# 的历史 migration 文件. lint 加 --legacy 选项时会跳过这些文件.
#
# 维护规则:
#   - 新文件不允许加入此白名单 (新文件必须遵守 L1/L2 规范)
#   - 已有文件只在 P1.5 rename 一次性迁移后才会移除
#   - 添加时附理由 + ticket
#
# 格式:
#   - name: 文件名
#     reason: 为什么是 legacy
#     ticket: 关联的 ticket / PR
#     destructive_allowed: 是否有 DROP (lint 跳过 L5)

