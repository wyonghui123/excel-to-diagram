# 全局配置
common:
  python_bin: "/opt/miniconda3-py39/bin/python"
  python3_bin: "/opt/miniconda3-py39/bin/python3"
  prod_root: "/opt/app"
  prod_deployments: "/opt/app/deployments"
  shared_dir: "/opt/app/shared"
  token_algorithm: "SHA256(secret:hour)[:16]"
  token_window_hours: 3   # ±1h 容错
  db_backup_dir: "/opt/app/backups"
  logrotate_dir: "/etc/logrotate.d"
  cron_file: "/etc/cron.d/yonaa-services"

# ops_scheduler 任务模板 (每个环境注册一份)
ops_scheduler_tasks:
  - name: "{env}_db_backup"
    desc: "{env} db backup"
    interval_sec: 21600   # 6h
    command: "/bin/bash /opt/app/shared/db_backup.sh --env={env}"

  - name: "{env}_health_inspect"
    desc: "{env} health inspection"
    interval_sec: 1800   # 30m
    command: "curl -sf http://127.0.0.1:{log_port}/api/health/inspect"

  - name: "{env}_disk_io_check"
    desc: "{env} SQLite disk I/O health check"
    interval_sec: 300   # 5m
    command: "curl -sf 'http://127.0.0.1:{log_port}/api/disk/check?quick=true'"

# e2e 测试模板 (8 项 smoke + staging 扩展项)
e2e_tests:
  common:
    - name: "T1: 4 端口健康"
      check: "all_ports_alive"
    - name: "T2: 登录接口"
      check: "login"
    - name: "T3: 业务对象列表"
      check: "bo_list"
    - name: "T4: db 完整性"
      check: "db_integrity"
    - name: "T5: 进程 fd 只有 1 个 .db"
      check: "single_db_fd"
    - name: "T6: symlink 正确"
      check: "symlink_correct"
    - name: "T7: 共享 Python 包可达"
      check: "shared_pkgs_importable"
    - name: "T8: prod 不受影响"
      check: "prod_unchanged"

  staging_extra:
    - name: "T9: 7 天前 backup 同步"
      check: "db_sync_age"
    - name: "T10: chaos 演练 (6 场景)"
      check: "chaos_drill"
    - name: "T11: rollback 演练"
      check: "rollback_drill"