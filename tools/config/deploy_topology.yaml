# tools/config/deploy_topology.yaml
#
# [2026-09-13] 通用部署目标配置
# ----------------------------------------------------------------------------
# 设计:
#   - 每个 target = 一个独立部署环境 (staging / production / dev / preview)
#   - 每个 target 声明 resolver (路径解析策略) + resource_overrides
#   - exec_fn / upload_fn / md5_fn 默认绑定 staging_round.remote_*
#   - 切到 prod / dev / k8s 时, 加新 entry 即可, 不需要改代码
#
# Lessons Learned (symlink_namespace_package 场景):
#   staging 真实情况 (2026-09-13 验证):
#     - deploy_root = /opt/app/staging/deploy/current (symlink)
#     - current -> v1789297457_staging_spec22 (实际快照目录)
#     - meta -> /opt/app/staging/deploy/current (也是 symlink)
#     - backend cwd = /opt/app/staging/deploy/v1789297457_staging_spec22
#     - meta/ 目录下只有 spec22 修改过的子集文件 (bo_api.py / models.py /
#       yaml_loader.py / models_enums.py / permission_dimension_api.py / user.yaml /
#       _standard_actions.yaml)
#     - meta/ 下没有完整 core/ 业务代码 (bo_framework / action_constants 等缺失)
#     - Python 加载 `meta.api.bo_api` 时, 实际走 namespace package 解析,
#       仅在 meta/api/ 下找 bo_api.py (找到)
#     - 然后 meta.api.bo_api 里 `from meta.core.bo_framework` 找不到
#     - **关键洞察**: backend 通过 lazy import / lazy route 注册规避了
#       cold-start 失败 (endpoint 在第一次请求时才实际加载), 所以 401
#       (endpoint registered) 仍然能通过 health check
#     - **修复**: 上传 spec22 修改的 4 个文件双发 (meta/X/Y + X/Y),
#       - 顶层 X/Y 提供完整的 core/ 包
#       - meta/X/Y 提供 spec22 修改的"补丁版"
#   解决方案: 用 symlink_namespace_package resolver, 自动双发到
#   {deploy_root}/meta/X/Y + {deploy_root}/X/Y
# ----------------------------------------------------------------------------

# ---------- staging ----------
staging:
  host: 172.20.59.7
  gw_port: 19200
  deploy_root: /opt/app/staging/deploy/current
  resolver: symlink_namespace_package

  # [2026-09-26 B] app 清单 SSOT (语义同 production)
  #   2026-09-26 只读实测: 三个候选路径**都不存在** ——
  #     current/apps / deploy/apps / /opt/app/staging/apps 全部 No such file.
  #   推导 (含 `.resolve()`, 这一步是关键, 漏掉会把值算错):
  #     app_loader.get_apps_root() = Path(__file__).resolve().parents[2] / "apps"
  #     __file__  = /opt/app/staging/deploy/meta/core/app_loader.py   (deploy/meta 是 symlink, __file__ 不解析)
  #     .resolve() -> /opt/app/staging/deploy/v1789297457_staging_spec22/meta/core/app_loader.py
  #     parents[2] -> /opt/app/staging/deploy/v1789297457_staging_spec22   (= current 的实体)
  #     ⇒ apps_root = <snapshot>/apps ≡ /opt/app/staging/deploy/current/apps  [OK]
  #   注意: 因为 get_apps_root() 内部 resolve 过, 这个值对 symlink 漂移免疫
  #     (current 换快照时, current/apps 自动跟随), 故**不要**写死 snapshot 目录名.
  #   当前 apps/ 尚未创建 —— app 机制真正落地时由安装流程 mkdir.
  apps_root: /opt/app/staging/deploy/current/apps
  apps: []

  # [2026-09-26 FIX] staging 平台库绝对路径 (只读实测: 121548800 bytes, Sep 26 08:18).
  #   来自现役进程 env SQLITE_DB_PATH/ARCH_DB_PATH, 二者同值.
  #   app-status 由它推导同目录的 runtime_apps.json 事实副本.
  db_path: /opt/app/staging/meta/architecture.db

  # 资源类型级 overrides (可选)
  resource_overrides:
    python_module:
      # [FIX 2026-09-26] 恢复双发 —— 推翻 2026-09-14 的「强制单发」。
      #
      # 2026-09-26 远端只读实测 (决定性证据, 非推测):
      #   1) deploy/meta -> deploy/current/meta    (2026-09-16 21:08 symlink 修复后的现状)
      #   2) server.py:16  sys.path.insert(0, dirname(dirname(__file__))) = /opt/app/staging/deploy
      #   3) 以该 sys.path 实测:
      #        meta.core.audit_derived_fields -> /opt/app/staging/deploy/meta/core/audit_derived_fields.py
      #        meta.core.app_builder          -> /opt/app/staging/deploy/meta/core/app_builder.py
      #        import core.<x>                -> ModuleNotFoundError: No module named 'core'
      #   ⇒ 活树 = {deploy_root}/meta/**；{deploy_root}/*.py 已**不是**可导入路径。
      #   ⇒ 2026-09-14 的强制单发(落点 current/core/**)自 09-16 symlink 修复之后
      #      就写进了死目录 —— 表现为「部署成功但代码永不生效」，该家族第 5 次复发。
      #      (另: 09-14 注释引用的 tools/check_meta_import_origin.py 在仓库中并不存在，属失效依据)
      #
      # 例外 (为何不能一刀切只写 meta/ 前缀):
      #   server.py / ops_server.py / unified_18081.py 是**按文件路径启动**的
      #   (cmdline: /opt/app/staging/deploy/current/server.py)，必须落在 {deploy_root}/ 顶层。
      #
      # 结论: 双发 = {deploy_root}/meta/{relative} + {deploy_root}/{relative}
      #       同时满足「可 import」与「可执行」两种语义，且对 symlink 拓扑漂移免疫
      #       (无论 meta 指向 current 还是 current/meta，两份里总有一份是活的)。
      #       代价 = 多写一份文件，staging 可接受。
      #
      # 实现注意: SymlinkNamespacePackageResolver 对 python_module 用
      # `override.get("double_path_prefixes")` 判前缀；这里统一用 "meta/" 覆盖全部
      # meta/** 文件 (含 graphql/ handlers/ enums/ migrations/ 等)。
      # 部署后必须用 introspect 断言实时加载路径，md5 一致不足以保证生效。
      double_path_prefixes:
        - meta/
    yaml_config:
      double_path_prefixes:
        - meta/schemas/
        - meta/config/
    # 单发资源: {relative} = 去 meta/ 前缀后的相对路径 (活树是顶层, current/meta/** 是死镜像)
    json_config:
      target_path_template: "{deploy_root}/{relative}"
    static_asset:
      target_path_template: "{deploy_root}/{relative}"
    db_migration:
      target_path_template: "{deploy_root}/{relative}"

  # 健康检查端点 (verify 时用)
  health_check:
    base_url: http://172.20.59.7:13011
    spec22_endpoints:
      - /api/v2/bo/user/state-transition-actions
      - /api/v2/bo/user/1/state_transitions

# ---------- production (2026-09-14 实测修正) ----------
# 实测事实:
#   - 网关: core_service 9200, HTTPS (self-signed), secret 见 staging_round.use_prod_gateway
#   - deploy_root = /opt/app/deployments/meta (meta 包根本身, 扁平布局;
#     /opt/app/deployments/current -> meta 为兼容 symlink)
#   - backend: meta-backend.service, python3.11.16 (P9 2026-09-30), 监听 172.20.59.7:5001
#   - frontend: meta-unified.service, unified_8081.py, dist=/opt/app/deployments/frontend_dist_files
production:
  host: 172.20.59.7
  gw_port: 9200
  gw_https: true
  deploy_root: /opt/app/deployments/meta
  resolver: flat_meta_package

  # [2026-09-26 B] app 清单单一真源 (SSOT) —— "这台服务器应该部署哪些 app"
  #   apps_root = app 包根. 它与 meta/ 平级, 不是 meta/ 的子目录:
  #     依据 meta/core/app_loader.get_apps_root() = parents[2] / "apps"
  #     __file__ = /opt/app/deployments/meta/core/app_loader.py
  #     → parents[2] = /opt/app/deployments → apps_root = /opt/app/deployments/apps
  #   实测现状 (2026-09-25 只读侦察): prod 无 apps/ 目录、DB 无 installed_apps 表、
  #     /health 返回 apps_mode=legacy → 本清单应为空.
  #   上传规则: apps/<id>/X → {apps_root}/<id>/X (排除 data/ 与 __pycache__)
  #   门禁: 清单外的 app 文件在 resolve 阶段直接报错, 防误传.
  apps_root: /opt/app/deployments/apps
  apps: []
  # 平台库绝对路径 (= staging_round.PROD_DB_PATH, 2026-09-25 实测).
  # app-status 由它推导同目录的 runtime_apps.json 事实副本.
  db_path: /opt/app/deployments/meta/architecture.db

  resource_overrides:
    json_config:
      target_path_template: "{deploy_root}/{relative}"
    static_asset:
      target_path_template: "{deploy_root}/{relative}"
    db_migration:
      target_path_template: "{deploy_root}/{relative}"
  health_check:
    base_url: http://172.20.59.7:5001

# ---------- dev (本地 copy) ----------
dev:
  host: null            # 本地
  gw_port: null
  deploy_root: ""       # 不需要远端 root
  resolver: local
  resource_overrides: {}
  health_check: null

