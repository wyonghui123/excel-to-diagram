# ============================================
# warehouse 应用的业务对象：出库单
#
# 用途: PoC 4 —— 跨应用事件的**发布方实体**。
#       出库单状态变为 shipped 时经 app.yaml 的 events.publish 声明
#       产生 outbound_completed 事件（roadmap §6.14.3）。
# 结构参照 meta/schemas/_template.yaml
# ============================================

id: outbound_order
name: 出库单
table_name: outbound_orders
description: 仓储管理应用的出库单

semantics:
  meaning: 一次出库作业的单据
  category: business_entity
  business_key: [order_no]

deletion_policy:
  mode: restrict
  cascade_delete: []

audit:
  enabled: true
  create:
    enabled: true
    fields: all
  update:
    enabled: true
    fields: changed_only
    exclude:
      - id
      - created_at
      - updated_at
  delete:
    enabled: true
    fields: business_only

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true

  - id: order_no
    name: 出库单号
    type: string
    db_column: order_no
    required: true
    unique: true
    max_length: 50
    description: 出库单唯一编号（同时是事件的幂等键）
    semantics:
      business_key: true

  - id: item_id
    name: 物料
    type: integer
    db_column: item_id
    required: true
    description: 出库物料（同应用库内引用 stock_items.id）
    ui:
      widget: select
      relation: stock_item

  - id: quantity
    name: 出库数量
    type: float
    db_column: quantity
    required: true
    ui:
      widget: number

  - id: warehouse_id
    name: 发货仓库
    type: integer
    db_column: warehouse_id
    required: true
    description: 发货仓库（同应用库内引用 warehouses.id）
    ui:
      widget: select
      relation: warehouse

  - id: status
    name: 单据状态
    type: string
    db_column: status
    required: true
    max_length: 20
    default: created
    description: created / picking / shipped（shipped 触发 outbound_completed 事件）

  - id: shipped_at
    name: 发货时间
    type: datetime
    db_column: shipped_at
    description: 出库完成时间（随事件带给下游应用）

  - id: created_at
    name: 创建时间
    type: datetime
    db_column: created_at
    semantics:
      audit_field: true

  - id: updated_at
    name: 更新时间
    type: datetime
    db_column: updated_at
    semantics:
      audit_field: true

indexes:
  - fields: [order_no]
    unique: true
    name: idx_outbound_order_no
  - fields: [status]
    unique: false
    name: idx_outbound_order_status

ui_view_config:
  list:
    title: 出库单管理
    searchFields:
      - order_no
      - status
    columns:
      - field: order_no
        width: 160
        sortable: true
      - field: item_id
        width: 120
      - field: quantity
        width: 100
      - field: status
        width: 110
      - field: shipped_at
        width: 160
    actions:
      - id: create
        label: 新建
        icon: plus
        type: primary
        permission: warehouse:create

  form:
    title: 出库单信息
    layout: vertical
    groups:
      - id: basic
        label: 基本信息
        columns: 2
        fields:
          - order_no
          - status
      - id: lines
        label: 出入库明细
        columns: 2
        fields:
          - item_id
          - quantity
          - warehouse_id
          - shipped_at

  detail:
    layout: tabs
    tabs:
      - id: basic
        label: 基本信息
        type: fields
        fields:
          - order_no
          - item_id
          - quantity
          - warehouse_id
          - status
          - shipped_at

category_config:
  create_permission: warehouse:create
  update_permission: warehouse:update
  delete_permission: warehouse:delete
  owner_auto_permission: false

import_export:
  import_enabled: true
  export_enabled: true
  cascade_export: false
  cascade_import: false
  conflict_strategy: upsert
  conflict_key: order_no