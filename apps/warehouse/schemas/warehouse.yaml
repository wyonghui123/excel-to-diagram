# ============================================
# warehouse 应用的业务对象：仓库
#
# 用途: PoC 2 —— 验证应用表落到**应用独立库**（data/warehouse.db）
# 结构参照 meta/schemas/_template.yaml
# ============================================

id: warehouse
name: 仓库
table_name: warehouses
description: 仓储管理应用的仓库主数据

semantics:
  meaning: 存放物料的物理仓库
  category: business_entity
  business_key: [code]

deletion_policy:
  mode: restrict
  cascade_delete: []

audit:
  enabled: true
  create:
    enabled: true
    fields: all
  update:
    enabled: true
    fields: changed_only
    exclude:
      - id
      - created_at
      - updated_at
  delete:
    enabled: true
    fields: business_only

fields:
  - id: id
    name: ID
    type: integer
    db_column: id
    required: true
    unique: true

  - id: code
    name: 编码
    type: string
    db_column: code
    required: true
    unique: true
    max_length: 50
    description: 仓库唯一编码
    semantics:
      business_key: true

  - id: name
    name: 名称
    type: string
    db_column: name
    required: true
    max_length: 100
    description: 仓库显示名称
    semantics:
      display_name: true

  - id: address
    name: 地址
    type: string
    db_column: address
    max_length: 200
    nullable: true
    description: 仓库地址

  - id: created_at
    name: 创建时间
    type: datetime
    db_column: created_at
    semantics:
      audit_field: true

  - id: updated_at
    name: 更新时间
    type: datetime
    db_column: updated_at
    semantics:
      audit_field: true

relations:
  - id: warehouse_to_stock_items
    name: 库存物料
    type: parent_child
    target: stock_item
    cardinality: "1:N"
    target_field: warehouse_id
    description: 一个仓库包含多个库存物料
    semantics:
      meaning: 仓库与库存物料的层级关系

indexes:
  - fields: [code]
    unique: true
    name: idx_warehouse_code

ui_view_config:
  list:
    title: 仓库管理
    searchFields:
      - code
      - name
    columns:
      - field: code
        width: 120
        sortable: true
      - field: name
        width: 180
        sortable: true
      - field: address
        width: 250
        type: ellipsis
    actions:
      - id: create
        label: 新建
        icon: plus
        type: primary
        permission: warehouse:create

  form:
    title: 仓库信息
    layout: vertical
    groups:
      - id: basic
        label: 基本信息
        columns: 2
        fields:
          - code
          - name
      - id: extra
        label: 其他信息
        columns: 1
        fields:
          - address

  detail:
    layout: tabs
    tabs:
      - id: basic
        label: 基本信息
        type: fields
        fields:
          - code
          - name
          - address

category_config:
  create_permission: warehouse:create
  update_permission: warehouse:update
  delete_permission: warehouse:delete
  owner_auto_permission: false

import_export:
  import_enabled: true
  export_enabled: true
  cascade_export: false
  cascade_import: false
  conflict_strategy: upsert
  conflict_key: code