name: Schema Drift Check

# 校验 meta/schemas/*.yaml (元模型真源) 与 meta/schemas/generated_schema.sql 快照一致。
# 期望 DDL 由 YAML 推导；快照是已提交的生成物。任一漂移即失败，提示重新生成。

on:
  pull_request:
    paths:
      - 'meta/schemas/**'
      - 'meta/core/schema_generator.py'
      - 'meta/core/yaml_loader.py'
      - 'meta/tools/sync_schema.py'
  push:
    branches: [ main ]
    paths:
      - 'meta/schemas/**'
      - 'meta/core/schema_generator.py'
      - 'meta/core/yaml_loader.py'
      - 'meta/tools/sync_schema.py'
  workflow_dispatch:

jobs:
  schema-drift:
    name: YAML -> generated_schema.sql
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: requirements*.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check schema drift
      run: |
        python -m meta.tools.sync_schema --check --against snapshot

    - name: How to fix
      if: failure()
      run: |
        echo "把 YAML 变更同步到快照后提交:"
        echo "  python -m meta.tools.sync_schema --generate"
        echo "  git add meta/schemas/generated_schema.sql"