name: Tests

# 两档策略（实测基线 2026-11-14，Python 3.14 / Windows 单进程）：
#   Tier 1 (push / PR)  -> engine 162 例 ~10s + unit 6636 例 ~15min
#   Tier 2 (夜间 schedule / 手动) -> full suite（含 integration / api / performance）
#
# 注: 项目测试未做 xdist 并行（test.py 固定 -n 0，DB 共享），故 Tier 1 为串行。
#
# TEST_ENTRY=1：CI 没有 d:\filework\test.py，显式声明走 conftest 的受控入口
# （本地开发仍必须使用 test.py，见 .trae/rules/IRON-RULES-CHEATSHEET.md L1）。

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 18 * * *'   # UTC 18:00 = Asia/Shanghai 02:00
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: 'utf-8'
  TEST_ENTRY: '1'

jobs:
  backend-fast:
    name: Backend (engine + unit)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: requirements*.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Prepare test database
      # 仓库不跟踪 architecture.db；由 YAML 元模型生成 201 张表，供 DB 相关用例使用
      timeout-minutes: 5
      run: |
        python -m meta.tools.sync_schema --source sqlite --local meta/architecture.db

    - name: Engine tests
      # meta/tests/test_*_eng.py：核心引擎用例（condition / scope / feature / metrics / nested_where 等）
      run: |
        pytest meta/tests/test_*_eng.py -q --tb=short

    - name: Unit tests
      run: |
        pytest -m "unit and not deprecated" -q --tb=short

  frontend-unit:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --no-audit --no-fund

    - name: Run Vitest
      run: npm run test:run

  backend-full:
    name: Backend Full Suite
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: requirements*.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Prepare test database
      timeout-minutes: 5
      run: |
        python -m meta.tools.sync_schema --source sqlite --local meta/architecture.db

    - name: Run full suite
      run: |
        pytest -q --tb=short --cov=meta --cov-report=xml --cov-report=term-missing

    - name: Upload coverage
      if: always()
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false