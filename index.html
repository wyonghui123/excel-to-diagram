<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- [FIX 2026-10-12 移动端] 移除 maximum-scale=1.0 / user-scalable=no。
         禁用缩放是无障碍反模式(WCAG 1.4.4 Resize Text), 手机端表格列多时
         用户无法放大查看。viewport-fit=cover 保留, 供安全区补偿使用。
         iOS 10+ 与 Android 浏览器均已忽略 user-scalable=no, 实际本就不生效,
         删除只是让意图与行为一致。

         [FIX 2026-10-17 登录页键盘遮挡] 新增 interactive-widget=resizes-content。
         这是本次问题的真正根因，位于此处而非 CSS：
         Chrome 80+ 默认 soft keyboard 弹出时**布局视口不收缩**，键盘作为浮层
         覆盖其上。此时 100dvh 测的是「地址栏展开时的视口」，不含键盘高度 ——
         dvh 只处理浏览器 UI(地址栏)，不处理软键盘，我此前误以为它能跟随键盘。
         浏览器为露出被聚焦输入框会自动滚动页面，表现为「整页往上移」，
         而 position:fixed 的 overlay 内部滚动后，下方会露出 overlay 之外的白底。
         resizes-content 让布局视口在键盘弹出时真正收缩，于是 dvh 生效、
         卡片就地重排，用户看到的是键盘上方正常显示表单，无需任何 JS 兜底。
         不支持的浏览器(旧 iOS Safari)会忽略该值，退回原行为，无副作用。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#667eea" />
    <title>AA Diagram</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
